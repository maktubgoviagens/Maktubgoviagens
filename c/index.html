(function () {

  // a cotação roda isolada (quadro com sandbox, sem a origem do site): um script dentro dela não alcança

  var abrirCotacao = function (html) {
    var t = (html.match(/<title>([^<]*)<\/title>/i) || [])[1] || 'Sua cotação | Maktub Go';
    var dec = document.createElement('textarea'); dec.innerHTML = t; t = dec.value;

    document.open();
    document.write('<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="icon" href="/ativos/simbolo-verde.png"><title>Maktub Go</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#F3F1EA}iframe{border:0;width:100%;height:100%;display:block}</style></head><body></body></html>');
    document.close();
    document.title = t;
    var f = document.createElement('iframe');
    f.title = 'Cotação'; f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads');
    f.srcdoc = doc; document.body.appendChild(f);
  };
  var erro = function () {
    document.getElementById('msg').innerHTML = '<img src="/ativos/simbolo-verde.png" alt="Maktub Go"><p>Não encontramos esta cotação. Fale com a gente no <a href="https://wa.me/5521976275225">WhatsApp (21) 97627-5225</a>.</p>';
  };
  if (!/^[a-z0-9-]{3,40}$/i.test(k)) return erro();
  fetch('https://qzrpvavhgtklacsbhlfi.supabase.co/rest/v1/rpc/ver_cotacao', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_gKIXLgYTXCSZjNjc5Xcd4Q_EqVBdiSE' },
    body: JSON.stringify({ p_token: k })
  }).then(function (r) { return r.ok ? r.json() : null; }).then(function (html) {

    abrirCotacao(html);
  }).catch(erro);
})();
</script>
