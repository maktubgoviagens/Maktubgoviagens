<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1a3826" />
  <title>Administração | Maktub Go</title>
  <link rel="icon" href="/ativos/app-icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--green:#1a3826;--green-mid:#234832;--green-dark:#142d1f;--gold:#8a6520;--gold-warm:#c9a96e;--gold-soft:rgba(138,101,32,.1);--cream:#f9f6f1;--cream-deep:#f5f0e8;--white:#fff;--text:#2c2c2c;--mid:#3d3d3d;--muted:#5c5c5c;--border:rgba(26,56,38,.1);--border-strong:rgba(26,56,38,.2);--ok:#4f7d53;--warn:#a07830;--bad:#9a4a3a}
    *{box-sizing:border-box;margin:0;padding:0}
    [hidden]{display:none!important}
    body{background:var(--cream);color:var(--text);font-family:'Jost',sans-serif;font-size:14px;line-height:1.55}
    a{color:inherit}
    button,input,select,textarea{font-family:inherit;font-size:14px}
    .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .gate h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:34px;color:var(--green);margin:14px 0 8px}
    .gate p{color:var(--muted);margin-bottom:18px}
    .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
    aside{background:var(--green);color:var(--cream);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
    .brand{display:flex;gap:10px;align-items:center;padding:0 6px}
    .brand img{height:30px}
    .brand .n{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
    .brand .s{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-warm)}
    .sec-t{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:rgba(249,246,241,.45);font-weight:600;margin:6px 6px 2px}
    .nav button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:none;border-left:2px solid transparent;color:rgba(249,246,241,.75);padding:8px 10px;text-align:left;cursor:pointer;font-size:13px}
    .nav button:hover{color:#fff;background:rgba(255,255,255,.04)}
    .nav button.on{color:var(--gold-warm);border-left-color:var(--gold-warm);background:rgba(201,169,110,.08)}
    .nav .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;border-radius:9px;padding:1px 7px}
    .picker select,.picker input{width:100%;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(201,169,110,.3);padding:9px 10px}
    .picker select option{color:var(--text)}
    .picker input{margin-bottom:6px}
    .picker input::placeholder{color:rgba(249,246,241,.45)}
    .who{margin-top:auto;font-size:12px;color:rgba(249,246,241,.6);padding:10px 6px;border-top:1px solid rgba(201,169,110,.15)}
    .who button{background:none;border:none;color:var(--gold-warm);cursor:pointer;font-size:12px;margin-top:4px}
    main{padding:28px 36px 60px;min-width:0}
    .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:24px}
    .top .k{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:600}
    .top h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:36px;color:var(--green);line-height:1.1}
    .top h1 em{color:var(--gold)}
    .top .sub{color:var(--muted);font-size:13px}
    .acts{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid var(--gold);background:var(--white);color:var(--green);padding:9px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
    .btn:hover{background:var(--gold-soft)}
    .btn.pri{background:var(--green);border-color:var(--green);color:#fff}
    .btn.pri:hover{background:var(--green-mid)}
    .btn.del{border-color:var(--bad);color:var(--bad)}
    .btn.sm{padding:6px 10px;font-size:10px}
    .btn:disabled{opacity:.5;cursor:wait}
    .hint{background:var(--cream-deep);border-left:2px solid var(--gold);padding:12px 16px;color:var(--mid);font-size:13px;margin-bottom:18px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:26px}
    .card{background:var(--white);border:1px solid var(--border);padding:18px}
    .card .l{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
    .card .v{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--green);line-height:1.1}
    .card.alert .v{color:var(--bad)}
    h2{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
    h2::before{content:'';width:16px;height:1px;background:var(--gold)}
    .tblw{overflow-x:auto;background:var(--white);border:1px solid var(--border)}
    table{width:100%;border-collapse:collapse;min-width:640px}
    th{text-align:left;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;background:var(--cream-deep);border-bottom:1px solid var(--border-strong);white-space:nowrap}
    td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
    tr:last-child td{border-bottom:none}
    td.a{white-space:nowrap;text-align:right}
    .empty{padding:30px;text-align:center;color:var(--muted);font-style:italic;font-family:'Cormorant Garamond',serif;font-size:17px}
    .pill{display:inline-block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--border-strong);padding:2px 7px;font-weight:600;white-space:nowrap}
    .p-ok{color:var(--ok);border-color:var(--ok)}.p-warn{color:var(--warn);border-color:var(--warn)}.p-bad{color:var(--bad);border-color:var(--bad)}
    .drawer{position:fixed;inset:0;background:rgba(20,45,31,.5);z-index:50;display:flex;justify-content:flex-end}
    .panel{background:var(--white);width:min(560px,100%);height:100%;overflow:auto;padding:26px 28px 40px}
    .panel h3{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:28px;color:var(--green);margin-bottom:4px}
    .panel.wide{width:min(1000px,100%)}
    .imp-drop{border:1px dashed var(--gold);padding:22px;text-align:center;background:var(--cream-deep);font-size:13px;color:var(--mid)}
    .imp-drop input{margin-top:10px}
    .imp-tbl td,.imp-tbl th{font-size:12px;padding:7px 8px;vertical-align:top}
    .imp-tbl tr.bad td{background:rgba(154,74,58,.05)}
    .imp-tbl tr.dup td{background:rgba(180,140,40,.06)}
    .panel .ph{color:var(--muted);font-size:12.5px;margin-bottom:18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
    .f{display:flex;flex-direction:column;gap:5px}
    .f.full{grid-column:1/-1}
    .f label{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
    .f label b{color:var(--bad)}
    .f input,.f select,.f textarea{width:100%;border:1px solid var(--border-strong);background:var(--cream);padding:9px 10px;color:var(--text)}
    .f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--gold)}
    .f textarea{min-height:90px;resize:vertical}
    .f .h{font-size:11px;color:var(--muted)}
    .f.chk{flex-direction:row;align-items:center;gap:8px}
    .f.chk input{width:auto}
    .pbar{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;position:sticky;bottom:-40px;background:var(--white);padding:14px 0}
    .msg{margin-top:12px;padding:10px 12px;font-size:13px}
    .msg.err{background:rgba(154,74,58,.08);color:var(--bad)}
    .msg.ok{background:rgba(79,125,83,.1);color:var(--ok)}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fff;padding:11px 18px;z-index:60;font-size:13px}
    .rowflex{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
    .rowflex .f{min-width:180px}
    .muted{color:var(--muted);font-size:12px}
    @media(max-width:900px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}main{padding:20px 16px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="gate" id="gate"><div><img src="/ativos/simbolo-verde.png" alt="Maktub Go" height="48" /><h1 id="gateT">Verificando acesso...</h1><p id="gateP"></p><div id="gateA"></div></div></div>
 
<div class="app" id="app" hidden>
  <aside>
    <div class="brand"><img src="/ativos/simbolo-creme.png" alt="" /><div><div class="n">Maktub Go</div><div class="s">Administração</div></div></div>
    <div class="nav" id="navGlobal">
      <div class="sec-t">Operação</div>
      <button data-v="home" class="on">Visão geral</button>
      <button data-v="solicitacoes">Solicitações do site <span class="cnt" id="cntSol" hidden></span></button>
      <button data-v="convitesAll">Indicações de clientes <span class="cnt" id="cntConv" hidden></span></button>
      <button data-v="agendaAll">Reuniões solicitadas <span class="cnt" id="cntAg" hidden></span></button>
      <button data-v="novoCliente">Cadastrar cliente</button>
      <button data-v="gestores">Gestores</button>
      <button data-v="valores">Valor do milheiro</button>
      <button data-v="equipe">Equipe</button>
    </div>
    <div class="picker">
      <div class="sec-t" style="margin-bottom:6px">Cliente</div>
      <input id="cliSearch" placeholder="Buscar cliente" />
      <select id="cliSel" size="1"></select>
    </div>
    <div class="nav" id="navCliente"></div>
    <div class="who"><div id="whoName"></div><button id="logout">Sair</button> · <a href="/painel/" style="color:var(--gold-warm);font-size:12px">Ver meu painel</a></div>
  </aside>
  <main id="main"></main>
</div>
 
<div class="drawer" id="drawer" hidden><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" hidden></div>
 
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
  const EXIGIR_CODIGO = true;
  const SUPABASE_URL = 'https://qzrpvavhgtklacsbhlfi.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_gKIXLgYTXCSZjNjc5Xcd4Q_EqVBdiSE';
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s === null || s === undefined ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  const num = (n) => n === null || n === undefined || n === '' ? '' : Number(n).toLocaleString('pt-BR');
  const brl = (n) => n === null || n === undefined || n === '' ? '' : 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const brDate = (s) => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return d ? `${d}/${m}/${y}` : ''; };
  const brDT = (s) => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); };
  const jwtAmr = (t) => { try { return (JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).amr || []).map(a => a.method); } catch (_) { return []; } };
  const toast = (m) => { $('toast').textContent = m; $('toast').hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').hidden = true, 3200); };
  const errMsg = (e) => {
    const m = (e && e.message) || String(e);
    if (/column .* does not exist|Could not find the '(.+)' column/i.test(m)) return 'Um dos campos não existe na tabela. Rode os scripts SQL mais recentes. Detalhe: ' + m;
    if (/violates check constraint/i.test(m)) return 'Algum valor não é aceito pela tabela (ex.: status ou categoria). Detalhe: ' + m;
    if (/row-level security|permission denied/i.test(m)) return 'Sem permissão. Confirme se seu usuário está na tabela "equipe".';
    if (/relation .* does not exist/i.test(m)) return 'Tabela ainda não criada. Rode os scripts SQL. Detalhe: ' + m;
    return m;
  };
 
  // ======================= CONFIGURAÇÃO DAS TABELAS =======================
  const opt = (arr) => arr.map(x => Array.isArray(x) ? x : [x, x]);
  const STATUS_VIAGEM = opt([['estrategia','Estratégia'],['planejamento','Planejamento'],['emitida','Emitida']]);
  const STATUS_VOO = opt([['confirmado','Confirmado'],['checkin_aberto','Check-in aberto'],['alterado','Alterado pela cia.'],['concluido','Realizado'],['cancelado','Cancelado']]);
  const CAT_ECO = opt([['emissao','Passagem (mercado x investido)'],['acumulo','Cartões e super acúmulo (pontos)'],['cashback','Cashback (R$)'],['outro','Outro ganho']]);
  const TIPO_EXT = opt([['acumulo','Acúmulo'],['bonus','Bônus'],['transferencia','Transferência'],['emissao','Emissão'],['expiracao','Expiração'],['ajuste','Ajuste']]);
  const TIPO_DOC = opt([['bilhete','Bilhete aéreo'],['voucher','Voucher'],['seguro','Seguro viagem'],['roteiro','Roteiro'],['relatorio','Relatório'],['contrato','Contrato'],['outro','Outro']]);
  const ST_AG = opt([['solicitada','Solicitada'],['confirmada','Confirmada'],['realizada','Realizada'],['cancelada','Cancelada']]);
  const ST_CONV = opt([['enviado','Recebido'],['em_contato','Em contato'],['convertido','Virou cliente'],['recusado','Não seguiu']]);
  const ST_SOL = opt([['nova','Nova'],['em_analise','Em análise'],['diagnostico_agendado','Diagnóstico agendado'],['aprovada','Aprovada'],['recusada','Recusada']]);
  const COR_CARTAO = opt([['green','Verde Maktub'],['itau','Itaú (grafite)'],['latam','Latam (azul)'],['nubank','Nubank (roxo)'],['santander','Santander (vermelho)'],['bradesco','Bradesco (vinho)']]);
 
  const T = {
    programas_milhas: { title: 'Programas e vencimentos', order: ['ordem', true], hint: 'O saldo é calculado pela Carteira de milhas, não se digita aqui. Use esta tela para nome, unidade e ordem de exibição. O vencimento é preenchido sozinho quando o lançamento tem validade; se não tiver, preencha aqui (alerta 90 dias antes).',
      fields: [['programa','Programa','text',1],['unidade','Unidade','select',0,opt(['milhas','pontos'])],['ordem','Ordem de exibição','number'],
        ['vencimento_data','Próximo vencimento','date'],['vencimento_quantidade','Quantidade a vencer','number']],
      cols: ['programa','saldo','vencimento_data','vencimento_quantidade'] },
    cartoes: { title: 'Cartões', order: ['ordem', true],
      fields: [['banco','Banco','text',1],['categoria','Categoria (ex.: Unique)','text'],['final_cartao','Final do cartão (4 dígitos)','text'],['cor_visual','Cor do cartão','select',0,COR_CARTAO],
        ['pontuacao','Pontuação (ex.: 2,6 pts/US$)','text'],['gasto_medio_mes','Gasto médio mensal (R$)','number'],['anuidade','Anuidade (texto)','text'],['ordem','Ordem','number'],
        ['upgrade_titulo','Recomendação: título','text'],['upgrade_progresso','Progresso do upgrade (0 a 100)','number'],
        ['upgrade_texto','Recomendação: texto (use *palavra* para itálico)','textarea',0,null,'full'],['upgrade_meta_label','Legenda da meta','text'],['upgrade_prazo_label','Legenda do prazo','text']],
      cols: ['banco','categoria','final_cartao','gasto_medio_mes'] },
    viagens: { title: 'Viagens', order: ['data_viagem', true], hint: 'Cada viagem agrupa voos, hotel e documentos no painel do cliente.',
      fields: [['destino','Destino','text',1],['destino_complemento','Complemento (ex.: Santiago e Atacama)','text'],['data_viagem','Data de ida','date',1],['data_retorno','Data de volta','date'],
        ['status','Status','select',1,STATUS_VIAGEM],['detalhes','Detalhes (ex.: Viagem internacional)','text'],['milhas_estimadas','Milhas estimadas (texto)','text'],['programa_usado','Programa','text'],
        ['hotel','Hotel','text'],['hotel_checkin','Check-in','date'],['hotel_checkout','Check-out','date'],['observacoes','Observações','textarea',0,null,'full']],
      cols: ['data_viagem','destino','status','hotel'] },
    voos: { title: 'Voos', order: ['data_voo', true], hint: 'Vincule o voo a uma viagem para ele aparecer dentro dela.',
      fields: [['viagem_id','Viagem','trip'],['status','Status','select',1,STATUS_VOO],['data_voo','Data do voo','date',1],['hora_partida','Partida','time'],['hora_chegada','Chegada','time'],
        ['origem_codigo','Origem (código)','text'],['origem_cidade','Origem (cidade)','text'],['destino_codigo','Destino (código)','text'],['destino_cidade','Destino (cidade)','text'],
        ['companhia','Companhia','text'],['numero_voo','Número do voo','text'],['localizador','Localizador','text'],['classe','Classe','text'],['passageiros','Passageiros','text'],
        ['programa','Programa usado','text'],['milhas_utilizadas','Milhas utilizadas','number'],['taxas_brl','Taxas (R$)','number'],['observacoes','Observações','textarea',0,null,'full']],
      cols: ['data_voo','origem_codigo','destino_codigo','companhia','localizador','status'] },
    historico_saldos: { title: 'Saldos mensais', order: ['mes', false], hint: 'Gerado sozinho pela Carteira de milhas a cada lançamento. Só edite aqui meses anteriores ao primeiro lançamento.',
      fields: [['mes','Mês','month',1],['programa','Programa','prog',1],['saldo','Saldo no fechamento','number',1]],
      cols: ['mes','programa','saldo'] },
    extrato_milhas: { title: 'Extrato de pontos', order: ['data', false], hint: 'Quantidade positiva para entradas e negativa para saídas (ex.: -40000 numa emissão).',
      fields: [['data','Data','date',1],['programa','Programa','prog',1],['tipo','Tipo','select',1,TIPO_EXT],['quantidade','Quantidade','number',1],['descricao','Descrição','text',0,null,'full']],
      cols: ['data','programa','tipo','quantidade','descricao'] },
    historico_economia: { title: 'Economias', order: ['data', false], hint: 'Passagem: preencha valor de mercado e valor investido. Cartões e super acúmulo: preencha programa e pontos gerados (o valor em reais é calculado pelo Valor do milheiro, se ficar em branco). Cashback: preencha o valor recebido em reais.',
      fields: [['categoria','Tipo de ganho','select',1,CAT_ECO],['data','Data','date',1],['descricao','Descrição (ex.: GRU > SCL, executiva)','text',1,null,'full'],['programa','Programa','prog'],
        ['milhas_utilizadas','Milhas utilizadas','number'],['valor_mercado_brl','Valor de mercado (R$)','number'],['valor_pago_brl','Valor investido (R$)','number'],
        ['valor_economia_brl','Valor da economia (R$)','number'],['pontos_gerados','Pontos gerados','number'],['observacao','Observação','text',0,null,'full']],
      cols: ['data','categoria','descricao','_economia'] },
    movimentos_estrategicos: { title: 'Movimentos estratégicos', order: ['ordem', true],
      fields: [['tag','Etiqueta (ex.: Prioridade · Upgrade)','text'],['prioridade','Prioridade','bool'],['titulo','Título (use *palavra* para itálico)','text',1,null,'full'],['descricao','Descrição','textarea',0,null,'full'],
        ['meta_1_label','Info 1: rótulo','text'],['meta_1_valor','Info 1: valor','text'],['meta_2_label','Info 2: rótulo','text'],['meta_2_valor','Info 2: valor','text'],
        ['meta_3_label','Info 3: rótulo','text'],['meta_3_valor','Info 3: valor','text'],['ordem','Ordem','number']],
      cols: ['titulo','tag','prioridade'] },
    reunioes: { title: 'Histórico de reuniões', order: ['data_reuniao', false],
      fields: [['titulo','Título','text',1],['data_reuniao','Data','date',1],['resumo','Resumo','textarea',0,null,'full']],
      cols: ['data_reuniao','titulo','resumo'] },
    agendamentos_reuniao: { title: 'Agendamentos', order: ['created_at', false], hint: 'Para confirmar: status Confirmada, data e hora, e o link do Meet. O cliente vê o botão "Entrar na reunião".',
      fields: [['status','Status','select',1,ST_AG],['data_preferida','Data de preferência','date',1],['periodo','Período','select',0,opt(['Manhã','Tarde','Noite'])],['formato','Formato','select',0,opt(['Videochamada','Ligação','Presencial'])],
        ['data_confirmada','Data e hora confirmadas','datetime'],['link_reuniao','Link da reunião (https://)','text'],['pauta','Pauta','textarea',0,null,'full']],
      cols: ['created_at','data_preferida','periodo','status','data_confirmada'] },
    convites: { title: 'Indicações deste cliente', order: ['created_at', false],
      fields: [['nome','Nome','text',1],['status','Status','select',1,ST_CONV],['whatsapp','WhatsApp','text'],['email','E-mail','text'],['relacao','Relação','text'],['mensagem','Mensagem','textarea',0,null,'full']],
      cols: ['created_at','nome','whatsapp','status'] }
  };
  const CLIENT_VIEWS = [
    ['cadastro','Cadastro e gestor'],['carteira','Carteira de milhas'],['indicadores','Indicadores do patrimônio'],['programas_milhas','Programas e vencimentos'],['cartoes','Cartões'],
    ['viagens','Viagens'],['voos','Voos'],['documentos','Documentos'],['historico_saldos','Saldos mensais'],
    ['historico_economia','Economias'],['movimentos_estrategicos','Movimentos estratégicos'],['reunioes','Histórico de reuniões'],
    ['agendamentos_reuniao','Agendamentos'],['relatorio','Relatório mensal'],['convites','Indicações']
  ];
 
  // ======================= ESTADO =======================

  // ======================= TABELA GENÉRICA =======================
  function fmtCell(k, v, row) {
    if (k === '_economia') { const val = row.valor_economia_brl !== null && row.valor_economia_brl !== undefined ? Number(row.valor_economia_brl) : Number(row.valor_mercado_brl || 0) - Number(row.valor_pago_brl || 0); return `<strong>${brl(val)}</strong>`; }
    if (v === null || v === undefined) return '';
    if (typeof v === 'boolean') return v ? 'Sim' : '';
    if (/created_at|data_confirmada|concluido_em/.test(k)) return brDT(v);
    if (k === 'mes') return String(v).slice(5, 7) + '/' + String(v).slice(0, 4);
    if (/^data|_data$|checkin|checkout/.test(k)) return brDate(v);
    if (/brl|gasto/.test(k)) return brl(v);
    if (/saldo|quantidade|milhas_utilizadas|pontos/.test(k)) return num(v);
    if (k === 'viagem_id') return esc((TRIPS.find(t => t.id === v) || {}).destino || '');
    if (k === 'categoria') return esc((CAT_ECO.find(x => x[0] === (v === 'cartao' ? 'acumulo' : v)) || [0, v])[1]);
    const s = String(v); return esc(s.length > 90 ? s.slice(0, 90) + '…' : s);
  }

    const extra = '';

    m.innerHTML = header(k, esc(cfg.title), esc(c.nome_completo), `${extra}${impBtn}<button class="btn pri" id="novo">+ Novo</button>`) +
      (cfg.hint ? `<div class="hint">${esc(cfg.hint)}</div>` : '') +
      `<div class="tblw"><table><thead><tr>${cfg.cols.map(x => `<th>${esc(label(x))}</th>`).join('')}<th></th></tr></thead><tbody>
      ${rows.length ? rows.map(r => `<tr>${cfg.cols.map(x => `<td>${fmtCell(x, r[x], r)}</td>`).join('')}

  function formTransf(ctx) {
    if (!ctx.W.programas.some(p => p.saldo > 0)) return toast('Lance primeiro o saldo do programa de origem.');
    drawer('Transferência entre programas', esc(ctx.c.nome_completo), `
      <div class="hint">Gera a saída na origem e a entrada no destino. O custo das milhas vai junto, então o bônus barateia o milheiro no destino.</div>
      <div class="grid">
        <div class="f"><label>Data <b>*</b></label><input type="date" name="data" value="${hojeISO()}" /></div>
        <div class="f"><label>De <b>*</b></label><select name="de">${progComSaldo(ctx, '')}</select></div>
        <div class="f"><label>Para <b>*</b></label><input name="para" list="dl_cart" autocomplete="off" />${progDatalist(ctx)}</div>
        <div class="f"><label>Pontos enviados <b>*</b></label><input type="number" min="1" step="1" name="enviados" /></div>
        <div class="f"><label>Paridade</label><select name="paridade"><option value="1">1 ponto = 1 milha</option><option value="2">2 pontos = 1 milha</option><option value="3">3 pontos = 1 milha</option><option value="0.5">1 ponto = 2 milhas</option></select></div>
        <div class="f"><label>Bônus da promoção (%)</label><input type="number" min="0" step="1" name="bonus" value="0" /></div>
        <div class="f"><label>Milhas recebidas <b>*</b></label><input type="number" min="1" step="1" name="recebidas" /><span class="h">Calculado sozinho. Ajuste se o programa creditou diferente.</span></div>
        <div class="f"><label>Validade no destino</label><input type="date" name="validade" /></div>
        <div class="f full"><label>Descrição</label><input name="descricao" placeholder="Ex.: Promoção 100% Livelo > Smiles" /></div>
      </div><div class="msg ok" id="prev" hidden></div>`,
    async (f, fail) => {
      const de = val(f, 'de'), para = val(f, 'para'), env = numv(f, 'enviados'), rec = numv(f, 'recebidas'), par = Number(val(f, 'paridade') || 1);
      if (!val(f, 'data') || !de || !para || !(env > 0) || !(rec > 0)) return fail('Preencha data, origem, destino, pontos enviados e milhas recebidas.'), false;
      if (normProg(de) === normProg(para)) return fail('Origem e destino precisam ser programas diferentes.'), false;
      const s = stateOf(ctx, de);
      if (!s || env > s.saldo) return fail(`Saldo insuficiente em ${de}: ${num(s ? s.saldo : 0)}.`), false;
      const grupo = crypto.randomUUID(), desc = val(f, 'descricao');
      await salvarLinhas(ctx, null, [
        { data: val(f, 'data'), programa: de, tipo: 'transf_saida', quantidade: -Math.round(env), grupo_id: grupo, descricao: `Para ${para}${desc ? ' · ' + desc : ''}` },
        { data: val(f, 'data'), programa: para, tipo: 'transf_entrada', quantidade: Math.round(rec), milhas_bonus: Math.max(0, Math.round(rec - env / par)), grupo_id: grupo, validade: val(f, 'validade') || null, descricao: `De ${de}${desc ? ' · ' + desc : ''}` }
      ]);
    });
    const f = $('fl'); let manual = false;
    f.elements.recebidas.addEventListener('input', () => { manual = true; });
    const upd = (e) => {
      const env = numv(f, 'enviados'), par = Number(val(f, 'paridade') || 1), bon = numv(f, 'bonus') || 0;
      if (e && e.target && e.target.name !== 'recebidas' && ['enviados', 'paridade', 'bonus'].includes(e.target.name)) manual = false;
      if (!manual && env > 0) f.elements.recebidas.value = Math.round(env / par * (1 + bon / 100));
      const rec = numv(f, 'recebidas'), s = stateOf(ctx, val(f, 'de')), d = stateOf(ctx, val(f, 'para'));
      const show = s && env > 0 && rec > 0 && s.saldo > 0;
      $('prev').hidden = !show; if (!show) return;
      const custoVai = (s.custo_total || 0) * Math.min(1, env / s.saldo);
      const novo = ((d ? d.custo_total || 0 : 0) + custoVai) / ((d ? d.saldo : 0) + rec) * 1000;
      $('prev').innerHTML = `Custo que vai junto: <strong>${brl(custoVai)}</strong> · milheiro desta transferência: <strong>${brl(custoVai / rec * 1000)}</strong><br>Custo médio de ${esc(val(f, 'para') || 'destino')} depois: <strong>${brl(novo)}</strong>`;
    };
    f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
  }

      const s = stateOf(ctx, val(f, 'programa')), jaUsado = row && normProg(row.programa) === normProg(val(f, 'programa')) ? Math.abs(row.quantidade) : 0;
      if (!s || q > s.saldo + jaUsado) return fail(`Saldo insuficiente em ${val(f, 'programa')}: ${num(s ? s.saldo : 0)}.`), false;
      await salvarLinhas(ctx, row, { data: val(f, 'data'), programa: val(f, 'programa'), tipo: 'emissao', quantidade: -Math.round(q), categoria_uso: val(f, 'categoria_uso'),
        taxas_brl: numv(f, 'taxas_brl'), valor_pagante_brl: numv(f, 'valor_pagante_brl'), viagem_id: val(f, 'viagem_id') || null, descricao: val(f, 'descricao') });
    });
    const f = $('fl');
    const upd = () => {
      const s = stateOf(ctx, val(f, 'programa')), q = numv(f, 'quantidade'), tx = numv(f, 'taxas_brl') || 0, pag = numv(f, 'valor_pagante_brl');
      const show = s && q > 0 && s.custo_medio !== null;
      $('prev').hidden = !show; if (!show) return;
      const cm = s.custo_medio * q / 1000, real = cm + tx;
      $('prev').innerHTML = `Custo das milhas: <strong>${brl(cm)}</strong> (${brl(s.custo_medio)} por milheiro)<br>Custo real da emissão: <strong>${brl(real)}</strong>` +
        (pag > 0 ? `<br>Economia: <strong>${brl(pag - real)}</strong> (${Math.round((pag - real) / pag * 100)}% menos que em dinheiro)` : '');
    };
    f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
  }

  async function viewValores(m) {
    const { data, error } = await sb.from('valores_milheiro').select('*').order('programa');
    if (error) throw error;
    const rows = data || [];
    m.innerHTML = header('Operação', 'Valor do <em>milheiro</em>', 'Valor de referência por programa, usado para calcular o patrimônio em reais de todos os clientes.',
      '<button class="btn" id="aplicar">Atualizar todos os painéis</button><button class="btn pri" id="novoV">+ Programa</button>') + `
      <div class="hint">Atualize uma vez por mês. Use o valor que a milha rende em emissão (referência de mercado), não valor de venda. Ao salvar, os painéis de todos os clientes são recalculados.</div>
      <div class="tblw"><table><thead><tr><th>Programa</th><th style="text-align:right">Valor por milheiro</th><th>Observação</th><th>Atualizado em</th><th></th></tr></thead><tbody>
      ${rows.length ? rows.map(v => `<tr><td><strong>${esc(v.programa)}</strong></td><td class="a">${brl(v.valor_brl)}</td><td>${esc(v.observacao || '')}</td><td>${brDT(v.atualizado_em)}</td>
        <td class="a"><button class="btn sm" data-v="${v.id}">Editar</button> <button class="btn sm del" data-rmv="${v.id}">Excluir</button></td></tr>`).join('') : '<tr><td colspan="5" class="empty">Nenhum valor cadastrado.</td></tr>'}
      </tbody></table></div>`;
    const todos = async () => {
      const refs = await valoresRef(); let ok = 0;
      for (const c of CLIENTES) { try { await syncCarteira(c.id, refs); ok++; } catch (e) { console.error(e); } }
      toast(`Painéis atualizados: ${ok} de ${CLIENTES.length}.`);
    };
    const open = (v) => {
      $('panel').innerHTML = `<h3>${v ? 'Editar' : 'Novo'} valor</h3><div class="ph">Vale para todos os clientes.</div>
        <form id="fv"><div class="grid">
          <div class="f full"><label>Programa <b>*</b></label><input name="programa" list="dl_pp" value="${esc(v ? v.programa : '')}" /><datalist id="dl_pp">${PROG_PADRAO.map(n => `<option value="${esc(n)}">`).join('')}</datalist><span class="h">Escreva igual ao nome usado nas carteiras.</span></div>
          <div class="f"><label>Valor por milheiro (R$) <b>*</b></label><input type="number" min="0" step="0.01" name="valor_brl" value="${esc(v ? v.valor_brl : '')}" /></div>
          <div class="f"><label>Observação</label><input name="observacao" value="${esc(v ? v.observacao || '' : '')}" placeholder="Ex.: média de emissões de setembro" /></div>
        </div><div class="pbar"><button type="button" class="btn" id="cx">Cancelar</button><button class="btn pri" id="sx">Salvar</button></div><div id="mx"></div></form>`;
      $('drawer').hidden = false; $('cx').onclick = closeDrawer;
      $('fv').onsubmit = async (e) => {
        e.preventDefault();
        const f = e.target, row = { programa: val(f, 'programa'), valor_brl: numv(f, 'valor_brl'), observacao: val(f, 'observacao') || null, atualizado_em: new Date().toISOString() };
        if (!row.programa || !(row.valor_brl >= 0) || row.valor_brl === null) { $('mx').className = 'msg err'; $('mx').textContent = 'Informe programa e valor.'; return; }
        const dup = rows.find(x => normProg(x.programa) === normProg(row.programa) && (!v || x.id !== v.id));
        const { error: er } = v || dup ? await sb.from('valores_milheiro').update(row).eq('id', (v || dup).id) : await sb.from('valores_milheiro').insert(row);
        if (er) { $('mx').className = 'msg err'; $('mx').textContent = errMsg(er); return; }
        closeDrawer(); toast('Valor salvo. Recalculando os painéis...'); await todos(); render();
      };
    };
    $('novoV').onclick = () => open(null);
    $('aplicar').onclick = async () => { $('aplicar').disabled = true; await todos(); $('aplicar').disabled = false; };
    m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => open(rows.find(x => x.id === b.dataset.v)));
    m.querySelectorAll('[data-rmv]').forEach(b => b.onclick = async () => {
      if (!confirm('Excluir este valor de referência?')) return;
      const { error: er } = await sb.from('valores_milheiro').delete().eq('id', b.dataset.rmv);
      if (er) toast(errMsg(er)); else { await todos(); render(); }
    });
  }

  async function viewDocumentos(m, c, k) {
    const { data, error } = await sb.from('documentos').select('*').eq('cliente_id', c.id).order('created_at', { ascending: false });
    if (error) throw error;
    m.innerHTML = header(k, 'Documentos', esc(c.nome_completo)) + `
      <div class="hint">Aceita PDF, imagens e HTML (roteiros e bilhetes em HTML abrem dentro do painel). Tamanho máximo recomendado: 20 MB.</div>
      <div class="card"><form id="fDoc"><div class="grid">
        <div class="f"><label>Título <b>*</b></label><input name="titulo" required placeholder="Ex.: Bilhete GRU-SCL" /></div>
        <div class="f"><label>Tipo</label><select name="tipo">${TIPO_DOC.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
        <div class="f"><label>Viagem</label><select name="viagem_id"><option value="">Sem viagem</option>${TRIPS.map(t => `<option value="${t.id}">${esc(t.destino)} · ${brDate(t.data_viagem)}</option>`).join('')}</select></div>
        <div class="f"><label>Arquivo <b>*</b></label><input type="file" name="arquivo" required accept=".pdf,.html,.htm,.png,.jpg,.jpeg,.webp" /></div>
      </div><div class="pbar" style="position:static"><button class="btn pri" id="upBtn">Enviar documento</button></div><div id="docMsg"></div></form></div>
      <h2>Enviados</h2>
      <div class="tblw"><table><thead><tr><th>Data</th><th>Título</th><th>Tipo</th><th>Viagem</th><th></th></tr></thead><tbody>
      ${(data || []).length ? data.map(d => `<tr><td>${brDT(d.created_at)}</td><td>${esc(d.titulo)}</td><td>${esc((TIPO_DOC.find(x => x[0] === d.tipo) || [0, d.tipo])[1])}</td>
        <td>${esc((TRIPS.find(t => t.id === d.viagem_id) || {}).destino || '')}</td>
        <td class="a"><button class="btn sm" data-see="${esc(d.arquivo_path)}">Ver</button> <button class="btn sm del" data-rmdoc="${d.id}" data-path="${esc(d.arquivo_path)}">Excluir</button></td></tr>`).join('')
        : '<tr><td colspan="5" class="empty">Nenhum documento enviado.</td></tr>'}
      </tbody></table></div>`;
    $('fDoc').onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target), file = f.get('arquivo'), msg = $('docMsg');
      if (!f.get('titulo') || !file || !file.size) { msg.className = 'msg err'; msg.textContent = 'Informe o título e escolha o arquivo.'; return; }
      if (file.size > 20 * 1024 * 1024) { msg.className = 'msg err'; msg.textContent = 'Arquivo acima de 20 MB.'; return; }
      const safeName = file.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '-').toLowerCase();
      const path = `${c.id}/${Date.now()}-${safeName}`;
      $('upBtn').disabled = true; msg.className = 'msg'; msg.textContent = 'Enviando...';
      try {
        const type = /\.html?$/i.test(safeName) ? 'text/html' : (file.type || 'application/octet-stream');
        const up = await sb.storage.from('documentos').upload(path, file, { contentType: type, upsert: false });
        if (up.error) throw up.error;
        const ins = await sb.from('documentos').insert({ cliente_id: c.id, titulo: String(f.get('titulo')).trim(), tipo: f.get('tipo'), viagem_id: f.get('viagem_id') || null, arquivo_path: path, tamanho_bytes: file.size });
        if (ins.error) { await sb.storage.from('documentos').remove([path]); throw ins.error; }
        toast('Documento enviado. Já está no painel do cliente.'); render();
      } catch (err) { msg.className = 'msg err'; msg.textContent = errMsg(err); }
      finally { $('upBtn').disabled = false; }
    };
    m.querySelectorAll('[data-see]').forEach(b => b.onclick = async () => {
      const w = window.open('', '_blank');
      const { data: s, error: er } = await sb.storage.from('documentos').createSignedUrl(b.dataset.see, 300);
      if (er) { w && w.close(); toast(errMsg(er)); } else if (w) w.location = s.signedUrl;
    });
    m.querySelectorAll('[data-rmdoc]').forEach(b => b.onclick = async () => {
      if (!confirm('Excluir este documento? O cliente deixa de ver o arquivo.')) return;
      await sb.storage.from('documentos').remove([b.dataset.path]);
      const { error: er } = await sb.from('documentos').delete().eq('id', b.dataset.rmdoc);
      if (er) toast(errMsg(er)); else { toast('Documento excluído.'); render(); }
    });
  }
 
  // ======================= RELATÓRIO MENSAL =======================
  async function viewRelatorio(m, c, k) {
    const now = new Date();
    const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const mesAtual = m.dataset.mes || `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
    const { data, error } = await sb.from('relatorios_mensais').select('*').eq('cliente_id', c.id).order('mes', { ascending: false });
    if (error) throw error;
    const r = (data || []).find(x => String(x.mes).slice(0, 7) === mesAtual) || {};
    m.innerHTML = header(k, 'Relatório <em>mensal</em>', 'Os números são calculados sozinhos. Aqui você escreve a carta do gestor e decide quando o cliente pode ver.') + `
      <div class="card" style="max-width:760px"><form id="fRel">
        <div class="rowflex"><div class="f"><label>Mês</label><input type="month" id="relMes" value="${mesAtual}" /></div>
          <a class="btn" target="_blank" id="relPrev" href="/painel/relatorio.html?mes=${mesAtual}&cliente=${c.id}">Pré-visualizar</a>
          <span class="muted">${r.id ? (r.publicado ? '<span class="pill p-ok">Publicado</span>' : '<span class="pill p-warn">Rascunho</span>') : '<span class="pill">Sem carta</span>'}</span></div>
        <div class="grid">
          <div class="f full"><label>Carta do gestor</label><textarea name="carta_gestor" style="min-height:180px" placeholder="Como foi o mês, o que foi conquistado e o que vem a seguir.">${esc(r.carta_gestor || '')}</textarea></div>
          <div class="f"><label>Destaques (um por linha)</label><textarea name="destaques">${esc(r.destaques || '')}</textarea></div>
          <div class="f"><label>Próximos passos (um por linha)</label><textarea name="proximos_passos">${esc(r.proximos_passos || '')}</textarea></div>
          <div class="f chk full"><input type="checkbox" id="relPub" name="publicado" ${r.publicado ? 'checked' : ''} /><label for="relPub">Publicar: o cliente passa a ver a carta no relatório</label></div>
        </div>
        <div class="pbar" style="position:static"><button class="btn pri">Salvar</button></div><div id="relMsg"></div>
      </form></div>
      <h2>Meses com carta</h2>
      <div class="tblw"><table><thead><tr><th>Mês</th><th>Status</th><th></th></tr></thead><tbody>
      ${(data || []).map(x => `<tr><td>${fmtCell('mes', x.mes)}</td><td>${x.publicado ? '<span class="pill p-ok">Publicado</span>' : '<span class="pill p-warn">Rascunho</span>'}</td>
        <td class="a"><button class="btn sm" data-mes="${String(x.mes).slice(0, 7)}">Abrir</button> <a class="btn sm" target="_blank" href="/painel/relatorio.html?mes=${String(x.mes).slice(0, 7)}&cliente=${c.id}">Ver</a></td></tr>`).join('') || '<tr><td colspan="3" class="empty">Nenhuma carta ainda.</td></tr>'}
      </tbody></table></div>`;
    $('relMes').onchange = () => { m.dataset.mes = $('relMes').value; render(); };
    m.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => { m.dataset.mes = b.dataset.mes; render(); });
    $('fRel').onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target), pub = $('relPub').checked;
      const row = { cliente_id: c.id, mes: $('relMes').value + '-01', carta_gestor: f.get('carta_gestor') || null, destaques: f.get('destaques') || null,
        proximos_passos: f.get('proximos_passos') || null, publicado: pub, publicado_em: pub ? (r.publicado_em || new Date().toISOString()) : null };
      const { error: er } = await sb.from('relatorios_mensais').upsert(row, { onConflict: 'cliente_id,mes' });
      if (er) { $('relMsg').className = 'msg err'; $('relMsg').textContent = errMsg(er); return; }
      m.dataset.mes = $('relMes').value; toast(pub ? 'Carta publicada para o cliente.' : 'Rascunho salvo.'); render();
    };
  }
 
  // ======================= GESTORES =======================
  async function viewGestores(m) {
    const { data, error } = await sb.from('gestores').select('*').order('nome');
    if (error) throw error;
    GESTORES = data || [];
    const fields = [['nome','Nome','text',1],['cargo','Cargo','text'],['whatsapp','WhatsApp (só números, com 55)','text'],['email','E-mail','text'],
      ['prazo_resposta','Prazo de resposta (ex.: Resposta em até 2 horas úteis)','text',0,null,'full'],['horario_atendimento','Horário (ex.: Seg a sex, 9h às 19h)','text',0,null,'full'],
      ['cal_link','Link do Cal.com (ex.: maktubgo/reuniao-mensal)','text',0,null,'full'],['foto_url','Foto (link https da imagem)','text',0,null,'full'],['ativo','Ativo','bool']];
    m.innerHTML = header('Operação', 'Gestores', 'Aparecem no painel do cliente com foto, canal e prazo de resposta.', '<button class="btn pri" id="novoG">+ Novo gestor</button>') +
      `<div class="tblw"><table><thead><tr><th>Nome</th><th>WhatsApp</th><th>Cal.com</th><th>Clientes</th><th></th></tr></thead><tbody>
      ${GESTORES.length ? GESTORES.map(g => `<tr><td>${esc(g.nome)}<div class="muted">${esc(g.cargo || '')}</div></td><td>${esc(g.whatsapp || '')}</td><td>${esc(g.cal_link || '')}</td>
        <td>${CLIENTES.filter(c => c.gestor_id === g.id).length}</td><td class="a"><button class="btn sm" data-g="${g.id}">Editar</button></td></tr>`).join('') : '<tr><td colspan="5" class="empty">Cadastre o primeiro gestor.</td></tr>'}
      </tbody></table></div>`;
    const open = (g) => {
      $('panel').innerHTML = `<h3>${g ? 'Editar' : 'Novo'} gestor</h3><div class="ph">Dados exibidos para os clientes.</div>
        <form id="fg"><div class="grid">${fields.map(f => inputFor(f, g ? g[f[0]] : (f[0] === 'ativo' ? true : f[0] === 'cargo' ? 'Gestor de Milhas' : null))).join('')}</div>
        <div class="pbar"><button type="button" class="btn" id="cx">Cancelar</button><button class="btn pri">Salvar</button></div><div id="mx"></div></form>`;
      $('drawer').hidden = false; $('cx').onclick = closeDrawer;
      $('fg').onsubmit = async (e) => {
        e.preventDefault();
        const row = readForm(e.target, fields);
        if (!row.nome) { $('mx').className = 'msg err'; $('mx').textContent = 'Informe o nome.'; return; }
        if (row.foto_url && !/^https:\/\//.test(row.foto_url)) { $('mx').className = 'msg err'; $('mx').textContent = 'A foto precisa ser um link https.'; return; }
        if (row.whatsapp) row.whatsapp = row.whatsapp.replace(/\D/g, '');
        if (row.cal_link) row.cal_link = row.cal_link.replace(/^https?:\/\/(app\.)?cal\.com\//, '').replace(/^\/+|\/+$/g, '');
        const { error: er } = g ? await sb.from('gestores').update(row).eq('id', g.id) : await sb.from('gestores').insert(row);
        if (er) { $('mx').className = 'msg err'; $('mx').textContent = errMsg(er); return; }
        closeDrawer(); toast('Gestor salvo.'); await loadBase(); render();
      };
    };
    $('novoG').onclick = () => open(null);
    m.querySelectorAll('[data-g]').forEach(b => b.onclick = () => open(GESTORES.find(x => x.id === b.dataset.g)));
  }
</script>
