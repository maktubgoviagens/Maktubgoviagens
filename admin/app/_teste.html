<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{
  --verde:#1a3826;--verde-2:#234832;--dourado:#8a6520;--dourado-claro:#c9a96e;
  --creme:#f9f6f1;--creme-2:#f2ece1;--branco:#fff;
  --tinta:#2b2b26;--tinta-2:#5c5c55;--tinta-3:#6b6b62;
  --linha:rgba(26,56,38,.12);
  --alerta:#a0561f;--ok:#2f6b4a;
  --barra-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--creme);color:var(--tinta);font-family:'Jost',-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5}
a{color:inherit}
button,select,textarea,input{font-family:inherit;font-size:15px;color:inherit}
button:not([class]){-webkit-appearance:none;appearance:none;background:none;border:0;padding:0;color:inherit;cursor:pointer}
@media (max-width:760px){input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:16px!important}}

/* topo */
.topo{position:sticky;top:0;z-index:30;background:var(--verde);color:var(--creme);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.topo img{width:26px}
.topo .n{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;line-height:1.2}
.topo .s{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dourado-claro)}
.topo .acoes{margin-left:auto;display:flex;gap:6px}
.icone{background:none;border:1px solid rgba(201,169,110,.35);color:var(--creme);width:38px;height:38px;display:grid;place-items:center;cursor:pointer;text-decoration:none}
.icone svg{width:18px;height:18px}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--branco);border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;height:var(--barra-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;letter-spacing:.06em;color:var(--tinta-3);cursor:pointer;position:relative}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--verde);font-weight:600}
.nav button.on::before{content:'';position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--dourado)}
.nav .bola{position:absolute;top:9px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--alerta);color:#fff;font-size:10px;line-height:17px;text-align:center;padding:0 4px;font-weight:600}

.pagina{max-width:760px;margin:0 auto;padding:18px 16px calc(var(--barra-h) + 36px + env(safe-area-inset-bottom))}
body.com-fab .pagina{padding-bottom:calc(var(--barra-h) + 100px + env(safe-area-inset-bottom))}
.titulo{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;color:var(--verde);line-height:1.1}
.titulo em{color:var(--dourado)}
.sub{font-size:12.5px;color:var(--tinta-3);margin-top:4px}
.secao{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dourado);font-weight:600;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
.secao a,.secao button{font-size:11px;letter-spacing:.06em;text-transform:none;color:var(--tinta-2);background:none;border:0;cursor:pointer;font-weight:400;padding:12px 0 12px 14px;margin:-12px 0}

/* números */
.numeros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{background:var(--branco);border:1px solid var(--linha);padding:14px 14px 12px}
.num .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-2);font-weight:500}
.num .v{white-space:nowrap;font-family:'Cormorant Garamond',serif;font-size:clamp(25px,7.2vw,32px);color:var(--verde);line-height:1.05;margin-top:4px;font-variant-numeric:lining-nums}
.num .d{font-size:12px;color:var(--tinta-3)}
.num.destaque{border-left:3px solid var(--dourado)}
.num.alerta .v{color:var(--alerta)}

/* lista de pendências */
.pend{background:var(--branco);border:1px solid var(--linha)}
.pend button{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--linha);padding:13px 14px;cursor:pointer;font-size:14.5px}
.pend button:first-child{border-top:0}
.pend b{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;color:var(--tinta-3);line-height:1;min-width:24px;text-align:right}
.pend b.tem{color:var(--alerta)}
.pend .seta{color:var(--tinta-3);margin-left:10px}

/* blocos */
.bloco{background:var(--branco);border:1px solid var(--linha);padding:16px;margin-top:10px}
.bloco h2{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dourado);font-weight:600;margin-bottom:12px}
.barra{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:10px;padding:5px 0}
.barra .r{font-size:13px;color:var(--tinta-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .t{height:14px;background:var(--creme-2);position:relative}
.barra .t i{position:absolute;inset:0 auto 0 0;background:var(--verde);border-radius:0 4px 4px 0;min-width:2px}
.barra .t i.ouro{background:var(--dourado)}
.barra .q{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.vazio{color:var(--tinta-3);font-size:13.5px;padding:10px 0}

/* chips / abas internas */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fotosG{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -2px 10px;scrollbar-width:none}.fotosG::-webkit-scrollbar{display:none}.fotosG:empty{display:none}.fotosG figure{margin:0;flex:0 0 82%;scroll-snap-align:start}.fotosG img{width:100%;height:190px;object-fit:cover;display:block;background:var(--linha)}.fotosG figcaption{font-size:11px;color:var(--tinta-3);margin-top:3px}.fotosG figcaption a{color:inherit}
.chips button{white-space:nowrap;background:var(--branco);border:1px solid var(--linha);padding:8px 13px;font-size:12.5px;cursor:pointer;color:var(--tinta-2);border-radius:20px}
.chips button.on{border-color:var(--verde);background:var(--verde);color:var(--creme)}
.lt-i{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--linha);font-size:13.5px;line-height:1.35}.lt-i:first-of-type{border-top:0}.lt-i .q{color:var(--tinta-3);font-size:12px;font-variant-numeric:tabular-nums}.lt-i b{font-weight:600;color:var(--verde)}.lt-i .d{color:var(--tinta-2)}
.gsec{background:var(--branco);border:1px solid var(--linha);padding:0 14px;margin-top:10px}.gsec>summary{padding:13px 0;cursor:pointer;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}.gsec>summary::-webkit-details-marker{display:none}.gsec>summary::after{content:'›';color:var(--tinta-3);transition:transform .15s}.gsec[open]>summary::after{transform:rotate(90deg)}.gsec[open]{padding-bottom:14px}.gsec>summary small{display:block;font-size:12px;color:var(--tinta-3)}.gsec .bloco{border:0;padding:0;margin-top:0}
.gtr{background:var(--branco);border:1px solid var(--linha);padding:14px 10px 12px;margin-top:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:14px}.gtr div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}.gtr i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:#efe9dc;color:var(--tinta-3)}.gtr i.f{background:var(--dourado);color:#fff}.gtr i.f.pv{background:var(--verde)}.gtr i.a{background:#fff;color:var(--dourado);box-shadow:0 0 0 2px var(--dourado)}.gtr i.a.pv{color:var(--verde);box-shadow:0 0 0 2px var(--verde)}.gtr i.x{background:var(--alerta);color:#fff}.gtr span{font-size:11.5px;line-height:1.2;color:var(--tinta-3)}.gtr span.on{color:var(--tinta);font-weight:500}.gtr small{font-size:10.5px;color:var(--tinta-3);line-height:1.2;min-height:12px}
.gagora{background:var(--verde);color:var(--creme);padding:16px;margin-top:10px;display:flex;flex-direction:column;gap:8px}.gagora .r{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dourado-claro);font-weight:600}.gagora .t{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1.15}.gagora .d{font-size:13px;color:rgba(249,246,241,.85)}.gagora .b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}.gagora .b>*{display:block;text-align:center;text-decoration:none;font:inherit;font-size:13.5px;padding:12px 8px;cursor:pointer}.gagora .b .p{background:var(--dourado);color:#fff;border:0;font-weight:600}.gagora .b .s{background:transparent;color:var(--creme);border:1px solid rgba(201,169,110,.6)}.gagora .b>*:only-child{grid-column:1/-1}
.glib{display:flex;flex-direction:column;margin-top:2px}.glib>div{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(201,169,110,.3)}.glib>div:first-child{border-top:0;padding-top:4px}.glib i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(201,169,110,.7);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:var(--dourado-claro)}.glib i.ok{background:var(--dourado);border-color:var(--dourado);color:#fff}.glib .x{flex:1;min-width:0}.glib b{display:block;font-weight:600;font-size:14px;color:var(--creme)}.glib small{display:block;font-size:12.5px;color:rgba(249,246,241,.8);margin-top:2px}.glib .ac{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.glib .ac button,.glib .ac a{font:inherit;font-size:12.5px;padding:8px 10px;cursor:pointer;background:transparent;color:var(--creme);border:1px solid rgba(201,169,110,.6);text-decoration:none}.glib .ac .p{background:var(--dourado);border-color:var(--dourado);color:#fff;font-weight:600}.glib input{width:100%;margin-top:6px;padding:9px 10px;font:inherit;font-size:14px;border:1px solid rgba(201,169,110,.6);background:rgba(255,255,255,.95);color:var(--tinta)}.pular{display:block;width:100%;margin-top:14px;-webkit-appearance:none;appearance:none;-webkit-user-select:none;user-select:none;background:transparent;border:1px solid rgba(249,246,241,.55);border-radius:0;color:var(--creme);font:inherit;font-size:13px;line-height:1.35;padding:11px 14px;cursor:pointer;text-align:center}
.gt .dono{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3);margin-left:30px;margin-top:2px}.gt details.rot{margin:6px 0 0 30px}.gt details.rot summary{font-size:12.5px;color:var(--dourado);cursor:pointer}.gt details.rot div{font-size:13px;line-height:1.5;color:var(--tinta-2);white-space:pre-line;margin-top:6px}
.gjseg{display:flex;border:1px solid var(--linha);background:var(--branco);margin-top:12px}.gjseg button{flex:1;background:none;border:0;padding:10px 4px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--tinta-2)}.gjseg button.on{background:var(--verde);color:var(--creme)}
.gjres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.gjres button{background:var(--branco);border:1px solid var(--linha);padding:10px 12px;text-align:left;cursor:pointer;font:inherit}.gjres .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}.gjres .bs{display:flex;gap:3px;margin-top:8px}.gjres .bs i{flex:1;height:8px;background:#efe9dc}.gjres .d{font-size:12.5px;color:var(--tinta-2);margin-top:6px}
.gjchips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.gjchips::-webkit-scrollbar{display:none}.gjchips button{white-space:nowrap;border-radius:20px;padding:8px 12px;font-size:12.5px;background:var(--branco);color:var(--tinta-2);border:1px solid var(--linha);cursor:pointer}.gjchips button b{font-weight:600;margin-left:3px}
.gj{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity;scroll-padding-left:16px;align-items:flex-start}.gj::-webkit-scrollbar{height:5px}.gj::-webkit-scrollbar-thumb{background:var(--dourado);border-radius:3px}.gjc{flex:0 0 236px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}.gjc h3{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;padding:0 2px;margin:0}.gjc h3 small{font-size:12px;letter-spacing:0;color:var(--tinta-3);font-weight:400}.gjc .ln{height:3px}.gjk{background:var(--branco);border:1px solid var(--linha);padding:11px 12px;display:flex;flex-direction:column;gap:5px;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}.gjk .n{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--verde);line-height:1.15}.gjk .s{align-self:flex-start;font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:10px;background:#f2ece1;color:#6b5320}.gjk .s.al{background:#f6e7dc;color:var(--alerta)}.gjk .s.ok{background:#e3ece5;color:var(--verde)}.gjk .p{font-size:12.5px;color:var(--tinta-2)}.gjk .q{font-size:11.5px;color:var(--tinta-3);border-top:1px solid var(--linha);padding-top:5px}
.pia h4{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dourado);font-weight:600;margin:14px 0 6px}.pia ul{margin:0;padding-left:18px}.pia li{margin:3px 0;font-size:14px}.pia p{margin:4px 0;font-size:14px}.pia .ob{border-top:1px solid var(--linha);padding:6px 0;font-size:14px}.pia .ob b{color:var(--verde);font-weight:600}.pia .acs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pia .acs>*{flex:1;min-width:140px}
.lint{margin-top:12px}.lint .l{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-2);font-weight:500;margin-bottom:2px}.lint .l b{color:var(--alerta);font-weight:600}.lint .chips{flex-wrap:wrap;overflow:visible}.lint .chips button{padding:7px 11px}
.seg{display:flex;border:1px solid var(--linha);background:var(--branco);margin:14px 0 4px}
.seg button{flex:1;background:none;border:0;padding:var(--seg-pad,10px 4px);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--tinta-2)}
.seg button.on{background:var(--verde);color:var(--creme)}
.busca{width:100%;padding:12px 14px;border:1px solid var(--linha);background:var(--branco);font-size:16px;margin-top:14px}

/* cartões */
.lista{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.card{background:var(--branco);border:1px solid var(--linha);padding:14px}
.card.novo{border-left:3px solid var(--alerta)}
.card .cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .nome{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--verde);line-height:1.15}
.card .quando{font-size:12px;color:var(--tinta-3);white-space:nowrap}
.tag{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--linha);color:var(--tinta-2);margin-top:4px}
.tag.ouro{border-color:rgba(138,101,32,.4);color:var(--dourado)}
.prio{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;margin-right:6px;font:600 13px/1 'Jost',sans-serif;border:1px solid var(--linha);color:var(--tinta-2);vertical-align:1px;border-radius:4px}
.prio.pA{background:var(--verde);border-color:var(--verde);color:var(--creme)}.prio.pB{border-color:var(--dourado);color:var(--dourado)}
.tag.ok{border-color:rgba(27,67,50,.35);color:var(--verde);background:rgba(27,67,50,.06)}
.ciclo{display:block;width:100%;text-align:left;background:var(--branco);border:1px solid var(--linha);border-left:3px solid var(--dourado);padding:14px;margin-top:14px;cursor:pointer;font:inherit;color:inherit}
.ciclo .top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--verde)}
.ciclo .top b{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500}
.ciclo small{display:block;margin-top:8px;font-size:12.5px;color:var(--tinta-3);line-height:1.45}
/* base do mês */
.kbase{margin-top:8px;background:var(--branco);border:1px solid var(--linha);border-left:3px solid var(--dourado);padding:12px 14px}
.kbase.al{border-left-color:var(--alerta)}.kbase.ok{border-left-color:var(--ok)}
.kbase .kbt{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}.kbase .kbt b{font-size:16px;font-weight:500;color:var(--verde)}.kbase.al .kbt b{color:var(--alerta)}
.kbase .kbt span{font-size:13px;color:var(--tinta-3)}
.kbase .kbl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--linha);font-size:14px}
.kbase .kbl small{font-size:13px;color:var(--tinta-3)}
.kbase .kfal{font-size:13px;color:var(--tinta-2);padding:6px 0 2px;border-top:1px solid var(--linha)}.kbase .kfal + .kbl{border-top:0}
.kbase .kbl button{flex:0 0 auto;min-width:0;padding:7px 12px;font-size:13px;letter-spacing:.04em;text-transform:none;white-space:nowrap;width:auto}.kbase .kbl .q{font-size:13px;color:var(--tinta-3);white-space:nowrap}
.kbase .kmais summary{list-style:none;color:var(--dourado)}.kbase .kmais summary::-webkit-details-marker{display:none}
.kbase .kmais .f,.kbase .kmais[open] .a{display:none}.kbase .kmais[open] .f{display:inline}
.kbase summary{cursor:pointer;font-size:13px;color:var(--tinta-2);padding:8px 0 2px;border-top:1px solid var(--linha)}
/* KPIs da Gestão */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--branco);border:1px solid var(--linha);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;color:inherit;min-width:0}
button.kpi{cursor:pointer;border-left:3px solid var(--dourado)}
.kpi .l{font-size:13px;color:var(--tinta-2);font-weight:500;line-height:1.3}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--verde);line-height:1.1;font-variant-numeric:lining-nums;white-space:nowrap}
.kpi .d{font-size:13px;color:var(--tinta-3);line-height:1.35}
.kpi .kb{height:6px;background:var(--creme-2);margin-top:6px;position:relative}.kpi .kb i{position:absolute;inset:0 auto 0 0;background:var(--verde)}
.kalerta{margin-top:8px;border:1px solid var(--linha);border-left:3px solid var(--ok);background:var(--branco);padding:10px 14px;font-size:13px;color:var(--tinta-2)}
.kalerta summary{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;list-style:none}.kalerta summary::-webkit-details-marker{display:none}
.kalerta b{font-size:16px;color:var(--ok)}
.kalerta.al{border-left-color:var(--alerta)}.kalerta.al b{color:var(--alerta)}
.kalerta .lin{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--linha);font-size:13px}
.khist{background:var(--branco);border:1px solid var(--linha);padding:4px 14px}
.khist .m{display:grid;grid-template-columns:76px 1fr 64px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--linha);font-size:13px}.khist .m:first-child{border-top:0}
.khist .m .kb{height:8px;background:var(--creme-2);position:relative}.khist .m .kb i{position:absolute;inset:0 auto 0 0;background:var(--verde)}
.khist .m b{text-align:right;color:var(--verde);font-variant-numeric:tabular-nums}
.fseg{overflow-x:auto;scrollbar-width:none}.fseg::-webkit-scrollbar{display:none}.fseg button{font-size:10px;letter-spacing:.02em;padding:11px 5px;flex:1 0 auto;white-space:nowrap}
.botoes4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.botoes4 .zap,.botoes4 .sec{min-width:0;padding:12px 6px;font-size:11px}
.lanc{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--linha);font-size:14px}
.lanc:first-child{border-top:0}
.lanc b{font-weight:600;color:var(--verde)}
