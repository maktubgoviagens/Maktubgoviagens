<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a3826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maktub Op">
<title>Operação | Maktub Go</title>
<link rel="manifest" href="/admin/app/manifest.webmanifest">
<link rel="icon" href="/ativos/app-icon-192.png">
<link rel="apple-touch-icon" href="/ativos/app-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1a3826;--verde-2:#234832;--dourado:#8a6520;--dourado-claro:#c9a96e;
  --creme:#f9f6f1;--creme-2:#f2ece1;--branco:#fff;
  --tinta:#2b2b26;--tinta-2:#5c5c55;--tinta-3:#86867c;
  --linha:rgba(26,56,38,.12);
  --alerta:#a0561f;--ok:#2f6b4a;
  --barra-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--creme);color:var(--tinta);font-family:'Jost',-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5}
a{color:inherit}
button,select,textarea,input{font-family:inherit;font-size:15px;color:inherit}

/* topo */
.topo{position:sticky;top:0;z-index:30;background:var(--verde);color:var(--creme);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.topo img{width:26px}
.topo .n{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;line-height:1.2}
.topo .s{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dourado-claro)}
.topo .acoes{margin-left:auto;display:flex;gap:6px}
.icone{background:none;border:1px solid rgba(201,169,110,.35);color:var(--creme);width:38px;height:38px;display:grid;place-items:center;cursor:pointer;text-decoration:none}
.icone svg{width:18px;height:18px}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--branco);border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;height:var(--barra-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;letter-spacing:.06em;color:var(--tinta-3);cursor:pointer;position:relative}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--verde);font-weight:600}
.nav button.on::before{content:'';position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--dourado)}
.nav .bola{position:absolute;top:9px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--alerta);color:#fff;font-size:10px;line-height:17px;text-align:center;padding:0 4px;font-weight:600}

.pagina{max-width:760px;margin:0 auto;padding:18px 16px calc(var(--barra-h) + 36px + env(safe-area-inset-bottom))}
.titulo{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;color:var(--verde);line-height:1.1}
.titulo em{color:var(--dourado)}
.sub{font-size:12.5px;color:var(--tinta-3);margin-top:4px}
.secao{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dourado);font-weight:600;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
.secao a,.secao button{font-size:11px;letter-spacing:.06em;text-transform:none;color:var(--tinta-2);background:none;border:0;cursor:pointer;font-weight:400}

/* números */
.numeros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{background:var(--branco);border:1px solid var(--linha);padding:14px 14px 12px}
.num .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-2);font-weight:500}
.num .v{white-space:nowrap;font-family:'Cormorant Garamond',serif;font-size:clamp(25px,7.2vw,32px);color:var(--verde);line-height:1.05;margin-top:4px;font-variant-numeric:lining-nums}
.num .d{font-size:12px;color:var(--tinta-3)}
.num.destaque{border-left:3px solid var(--dourado)}
.num.alerta .v{color:var(--alerta)}

/* lista de pendências */
.pend{background:var(--branco);border:1px solid var(--linha)}
.pend button{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--linha);padding:13px 14px;cursor:pointer;font-size:14.5px}
.pend button:first-child{border-top:0}
.pend b{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;color:var(--tinta-3);line-height:1;min-width:24px;text-align:right}
.pend b.tem{color:var(--alerta)}
.pend .seta{color:var(--tinta-3);margin-left:10px}

/* blocos */
.bloco{background:var(--branco);border:1px solid var(--linha);padding:16px;margin-top:10px}
.bloco h2{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dourado);font-weight:600;margin-bottom:12px}
.barra{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:10px;padding:5px 0}
.barra .r{font-size:13px;color:var(--tinta-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .t{height:14px;background:var(--creme-2);position:relative}
.barra .t i{position:absolute;inset:0 auto 0 0;background:var(--verde);border-radius:0 4px 4px 0;min-width:2px}
.barra .t i.ouro{background:var(--dourado)}
.barra .q{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.vazio{color:var(--tinta-3);font-size:13.5px;padding:10px 0}

/* chips / abas internas */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;background:var(--branco);border:1px solid var(--linha);padding:8px 13px;font-size:12.5px;cursor:pointer;color:var(--tinta-2);border-radius:20px}
.chips button.on{border-color:var(--verde);background:var(--verde);color:var(--creme)}
.seg{display:flex;border:1px solid var(--linha);background:var(--branco);margin:14px 0 4px}
.seg button{flex:1;background:none;border:0;padding:10px 4px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--tinta-2)}
.seg button.on{background:var(--verde);color:var(--creme)}
.busca{width:100%;padding:12px 14px;border:1px solid var(--linha);background:var(--branco);font-size:16px;margin-top:14px}

/* cartões */
.lista{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.card{background:var(--branco);border:1px solid var(--linha);padding:14px}
.card.novo{border-left:3px solid var(--alerta)}
.card .cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .nome{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--verde);line-height:1.15}
.card .quando{font-size:12px;color:var(--tinta-3);white-space:nowrap}
.tag{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--linha);color:var(--tinta-2);margin-top:4px}
.tag.ouro{border-color:rgba(138,101,32,.4);color:var(--dourado)}
.tag.alerta{border-color:rgba(160,86,31,.45);color:var(--alerta)}
.info{margin-top:10px;display:grid;gap:3px;font-size:14px}
.info span{color:var(--tinta-3)}
.card .acoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.zap{flex:1;min-width:130px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--verde);color:var(--creme);text-decoration:none;padding:11px 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:0;cursor:pointer}
.zap svg{width:16px;height:16px;fill:currentColor}
.sec{display:flex;align-items:center;justify-content:center;border:1px solid var(--linha);background:var(--branco);padding:10px 14px;text-decoration:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2);cursor:pointer}
.card select{flex:1;min-width:150px;padding:10px;border:1px solid var(--linha);background:var(--creme);border-radius:0}
.obs{margin-top:10px}
.obs summary{font-size:12.5px;color:var(--dourado);cursor:pointer}
.obs textarea{width:100%;margin-top:8px;min-height:76px;border:1px solid var(--linha);padding:10px;background:var(--creme);resize:vertical;font-size:16px}
.obs button{margin-top:6px;background:var(--verde);color:var(--creme);border:0;padding:9px 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.obs .salvo{font-size:12px;color:var(--tinta-3);margin-left:8px}

/* clientes */
.cli{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--branco);border:1px solid var(--linha);padding:14px;cursor:pointer}
.cli .nome{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--verde);line-height:1.15}
.cli .meta{font-size:12.5px;color:var(--tinta-3);margin-top:2px}
.cli .val{text-align:right;flex-shrink:0}
.cli .val b{display:block;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--verde)}
.cli .val span{font-size:11.5px;color:var(--tinta-3)}
.prog{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--linha)}
.prog:first-of-type{border-top:0}
.prog .p{font-size:15px;color:var(--verde)}
.prog .s{font-size:12.5px;color:var(--tinta-3)}
.prog .v{text-align:right;font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--verde)}
.prog .venc{grid-column:1/-1;font-size:12px;color:var(--alerta)}
.voltar{background:none;border:0;color:var(--tinta-2);font-size:13px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px}

/* agenda */
.dia{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-2);font-weight:600;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.dia::after{content:'';flex:1;height:1px;background:var(--linha)}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;background:var(--branco);border:1px solid var(--linha);padding:12px 12px 12px 10px;margin-bottom:6px;text-decoration:none}
.ev .h{font-variant-numeric:tabular-nums;font-size:13px;color:var(--tinta-2);text-align:center;padding-top:2px}
.ev .h svg{width:18px;height:18px;display:block;margin:0 auto 3px;color:var(--dourado)}
.ev .t{font-size:15px;color:var(--verde);line-height:1.3}
.ev .d{font-size:12.5px;color:var(--tinta-3);margin-top:2px}
.ev.alerta{border-left:3px solid var(--alerta)}

/* site */
.lin{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--linha);font-size:14px}
.lin:first-of-type{border-top:0}
.lin span:last-child{color:var(--tinta-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.config{background:var(--creme-2);border-left:3px solid var(--dourado);padding:14px;font-size:14px;color:var(--tinta-2)}
.config b{color:var(--verde)}

/* portão, aviso */
.portao{min-height:80vh;display:grid;place-items:center;text-align:center;padding:24px}
.portao h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;color:var(--verde);margin:12px 0 8px}
.portao p{color:var(--tinta-2);margin-bottom:16px}
.btn{display:inline-block;background:var(--verde);color:var(--creme);text-decoration:none;padding:12px 18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.aviso{position:fixed;left:50%;bottom:calc(var(--barra-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--verde);color:var(--creme);padding:11px 18px;font-size:13px;z-index:50;max-width:90vw;text-align:center}
.carregando{opacity:.55;pointer-events:none}

/* operação */
.zap.grande,.sec.grande{width:100%;padding:14px;font-size:12.5px}
.mesnav{display:flex;align-items:center;justify-content:space-between;background:var(--branco);border:1px solid var(--linha);margin-top:12px}
.mesnav button{background:none;border:0;width:48px;height:44px;font-size:22px;color:var(--verde);cursor:pointer}
.mesnav span{font-size:14px;color:var(--verde);font-weight:500}
.mesnav .tag{font-style:normal;margin:0 0 0 6px}
button.card.em{text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.form .grupo{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dourado);font-weight:600;margin:20px 0 6px}
.fl{display:block;margin-top:10px}
.fl span{display:block;font-size:12px;color:var(--tinta-2);margin-bottom:4px}
.fl input,.fl select,.fl textarea{width:100%;padding:11px 12px;border:1px solid var(--linha);background:var(--branco);font-size:16px;border-radius:0}
.fl input:disabled,.fl select:disabled{background:var(--creme-2);color:var(--tinta-3)}
.duas-col{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.caixas{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.fc{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px;cursor:pointer}
.fc input{width:20px;height:20px;accent-color:var(--verde)}
.toque{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dourado);margin-top:6px}
.ajuste{background:var(--branco);border:1px solid rgba(138,101,32,.45);padding:4px 14px 14px;margin-top:14px}
.ajuste .grupo{margin-top:12px}
.fl small{display:block;font-size:11.5px;color:var(--tinta-3);margin-top:4px}
button.lin{width:100%;background:none;border:0;border-top:1px solid var(--linha);font:inherit;color:inherit;cursor:pointer;text-align:left}
button.lin:first-of-type{border-top:0}
button.lin .seta{color:var(--dourado);margin-left:6px}
.icone{position:relative}
.icone .bola{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;border-radius:9px;background:var(--alerta);color:#fff;font-size:10px;line-height:17px;text-align:center;padding:0 4px;font-weight:600;font-family:Montserrat,sans-serif}
.nav.seis button{font-size:9.5px;letter-spacing:.03em}
.av{display:grid;grid-template-columns:30px 1fr;gap:10px;background:var(--branco);border:1px solid var(--linha);padding:12px;margin-bottom:6px;text-decoration:none;color:inherit;width:100%;text-align:left;font:inherit;cursor:pointer}
.av.novo{border-left:3px solid var(--dourado)}
.av .ic{width:30px;height:30px;border-radius:50%;background:var(--creme-2);display:grid;place-items:center;color:var(--dourado);font-size:13px}
.av .ic svg{width:16px;height:16px}
.av .t{font-size:14.5px;color:var(--verde);line-height:1.3}
.av .d{font-size:12.5px;color:var(--tinta-3);margin-top:2px;white-space:pre-line}
.av .q{font-size:11px;color:var(--tinta-3);margin-top:4px}
.canal{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--linha);font-size:14px}
.canal:first-of-type{border-top:0}
.canal small{display:block;font-size:12px;color:var(--tinta-3);margin-top:2px}
.canal .ok{color:var(--ok);font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.canal .sec,.canal .zap{flex:0 0 auto;min-width:0;padding:8px 12px;font-size:11px}
.conv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--linha);font-size:14px}
.conv:first-of-type{border-top:0}
.conv .m{grid-column:1/-1;height:6px;background:var(--creme-2);position:relative;margin-top:4px}
.conv .m i{position:absolute;inset:0 auto 0 0;background:var(--verde)}
.conv b{font-weight:600;color:var(--verde);font-variant-numeric:tabular-nums}
.conv small{grid-column:1/-1;font-size:12px;color:var(--tinta-3)}
.resq{display:flex;gap:6px;margin-top:10px}
.resq button{flex:1;padding:9px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--linha);background:var(--branco);cursor:pointer;color:var(--tinta-2)}
.resq button.f{border-color:var(--ok);color:var(--ok)}
.resq button.n{border-color:rgba(160,86,31,.45);color:var(--alerta)}
.tag.ok{border-color:rgba(47,107,74,.45);color:var(--ok)}
.kanban{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:16px;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none}
.kanban::-webkit-scrollbar{display:none}
.kcol{flex:0 0 80%;max-width:330px;scroll-snap-align:start;background:var(--creme-2);padding:10px;min-height:120px}
.kcol h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--verde);font-weight:600;display:flex;justify-content:space-between;margin:2px 2px 8px}
.kcol h3 small{font-size:10px;color:var(--tinta-3);letter-spacing:.06em}
.kc{background:var(--branco);border:1px solid var(--linha);padding:10px;margin-bottom:8px}
.kc.atr{border-left:3px solid var(--alerta)}
.kc .n{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--verde);line-height:1.15;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.kc .i{font-size:12.5px;color:var(--tinta-2);margin-top:3px}
.kc .t{font-size:11.5px;color:var(--tinta-3);margin-top:4px}
.kc .t.alerta{color:var(--alerta)}
.kc .mv{display:flex;gap:6px;margin-top:8px}
.kc .mv button{flex:1;padding:7px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--linha);background:var(--branco);cursor:pointer;color:var(--tinta-2)}
.kc .mv button.av{border-color:var(--verde);color:var(--verde);flex:4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:.02em;font-size:12.5px}
.kc .mv button.vt{flex:0 0 40px}
.kc .mv button.fe{border-color:rgba(47,107,74,.45);color:var(--ok)}
.kc .mv button.nf{border-color:rgba(160,86,31,.45);color:var(--alerta)}
.kc .mv:empty{display:none}
.kdica{font-size:11.5px;color:var(--tinta-3);margin-top:-4px}
.meta{margin-top:10px}
.meta .top{display:flex;justify-content:space-between;font-size:13.5px}
.meta .top b{color:var(--verde);font-variant-numeric:tabular-nums}
.meta .barra2{height:8px;background:var(--creme-2);margin-top:5px;position:relative}
.meta .barra2 i{position:absolute;inset:0 auto 0 0;background:var(--verde)}
.meta .barra2 i.ok{background:var(--dourado)}
.meta small{display:block;font-size:12px;color:var(--tinta-3);margin-top:3px}
.etapas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.etapas button{padding:8px 10px;font-size:12px;border:1px solid var(--linha);background:var(--branco);cursor:pointer;color:var(--tinta-2);border-radius:18px}
.etapas button.on{background:var(--verde);border-color:var(--verde);color:var(--creme)}
#calInline{min-height:620px;width:100%;overflow:auto;background:var(--branco);border:1px solid var(--linha);margin-top:10px}
.copiar{display:flex;gap:6px;align-items:center;margin-top:6px}
.copiar code{flex:1;font-size:11.5px;background:var(--creme-2);padding:8px;overflow-x:auto;white-space:nowrap}
.resumo{background:var(--creme-2);border-left:3px solid var(--dourado);padding:10px 14px;margin-top:16px}
.resumo .lin{border-top-color:rgba(26,56,38,.08)}
.lin.forte span{color:var(--verde);font-weight:600}
.mini{background:none;border:1px solid var(--linha);padding:3px 8px;font-size:11px;margin-left:6px;cursor:pointer;color:var(--tinta-2)}
.ev .ck{grid-column:2;justify-self:start;margin-top:8px;background:var(--branco);border:1px solid var(--linha);padding:7px 12px;font-size:12px;cursor:pointer;color:var(--tinta-2)}
.ev .ck.feito{background:var(--verde);border-color:var(--verde);color:var(--creme)}
@media (min-width:640px){
  .numeros{grid-template-columns:repeat(4,1fr)}
  .duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
}
</style>
</head>
<body>

<div class="portao" id="portao">
  <div>
    <img src="/ativos/simbolo-verde.png" alt="" width="44">

/* cálculo igual ao do banco (método 1 por padrão) */
const temManual = (x) => x != null && x !== '';
const pctPadraoVend = (id) => +((D.equipe.find(x => x.user_id === id) || {}).comissao_pct || 0);
const pctPadraoParc = (id) => +((D.parceirosAdm.find(x => x.id === id) || {}).pct || 0);
const nomeParc = (id) => ((D.parceirosAdm.find(x => x.id === id) || D.parc.find(x => x.id === id) || {}).nome || '');
function calcular(v) {
  const t = Number((D.cfg && D.cfg.imposto_pct) ?? 6) / 100;
  const custo = Math.round(((+v.milhas || 0) * (+v.milheiro || 0) / 1000 + (+v.taxas || 0)) * 100) / 100;
  const m = (+v.valor_receber || 0) - custo;
  const cp = (+v.comissao_pct || 0) / 100, pp = (+v.parceiro_pct || 0) / 100;
  const r2 = (x) => Math.round(x * 100) / 100;
  let imposto, comissao, repasse;
  if (D.cfg && D.cfg.comissao_desconta_imposto) {
    const iref = Math.max(m, 0) * t;
    comissao = r2(temManual(v.comissao_manual) && !v.pct_app ? +v.comissao_manual : Math.max(m - iref, 0) * cp);
    repasse = r2(temManual(v.repasse_manual) && !v.ppct_app ? +v.repasse_manual : Math.max(m - iref - comissao, 0) * pp);
    imposto = r2(Math.max(m - comissao - repasse, 0) * t);
  } else {
    imposto = r2(Math.max(m, 0) * t);
    comissao = r2(temManual(v.comissao_manual) && !v.pct_app ? +v.comissao_manual : Math.max(m - imposto, 0) * cp);
    repasse = r2(temManual(v.repasse_manual) && !v.ppct_app ? +v.repasse_manual : Math.max(m - imposto - comissao, 0) * pp);
  }
  return { custo, lucro_bruto: r2(m), imposto, comissao, repasse, lucro_liquido: r2(m - imposto - comissao - repasse) };
}

function caixa(nome, rotulo, valor) { return `<label class="fc"><input type="checkbox" name="${nome}" ${valor ? 'checked' : ''}><span>${rotulo}</span></label>`; }

  if (daPlanilha && ADMIN) ligarAjuste(e, travado);
  if (travado || !podeEditar) financeiros.forEach(n => { if (f.elements[n]) f.elements[n].disabled = true; });
  const MARCAS = ['pago', 'nota_gerada', 'checkin_ida', 'checkin_volta', 'monitorado', 'voado', 'feito_pos'];
  const podeMarcar = daPlanilha && (ADMIN || e.vendedor_id === D.meuId);
  if (!podeEditar) [...f.elements].forEach(x => { if (!(daPlanilha && (/^checkin_/.test(x.name) || (podeMarcar && MARCAS.includes(x.name))))) x.disabled = true; });
  if (daPlanilha) MARCAS.forEach(n => {
    const cx = f.elements[n]; if (!cx || cx.disabled) return;
    cx.onchange = async () => {
      const ck = /^checkin_/.test(n);
      const { error } = ck ? await sb.rpc('marcar_checkin', { p_id: e.id, p_trecho: n.slice(8), p_feito: cx.checked })
                           : await sb.from('emissoes').update({ [n]: cx.checked }).eq('id', e.id);
      if (error) { cx.checked = !cx.checked; aviso('Não salvou: ' + error.message); return; }
      e[n] = cx.checked; const v = D.voosEm.find(x => x.id === e.id); if (v && ck) v[n] = cx.checked;
      const nome = { pago: 'Pagamento', nota_gerada: 'Nota fiscal', checkin_ida: 'Check-in da ida', checkin_volta: 'Check-in da volta', monitorado: 'Monitoramento', voado: 'Voado', feito_pos: 'Pós-venda' }[n];
      aviso(cx.checked ? `${nome} marcado. Vai para a planilha em até 5 minutos.` : `${nome} desmarcado no app. Desmarque também na planilha.`);
    };
  });
  const lerValores = () => {
    const g = (n) => f.elements[n] ? f.elements[n].value : undefined;
    const serv = g('servico');
    const v = { milhas: ehMilhas(serv) ? g('milhas') : 0, milheiro: ehMilhas(serv) ? g('milheiro') : 0, taxas: ehMilhas(serv) ? g('taxas') : g('custo_direto'), valor_receber: g('valor_receber'), comissao_manual: g('comissao_manual'), repasse_manual: g('repasse_manual') };
    const vend = ADMIN ? g('vendedor_id') : D.meuId;
    v.comissao_pct = (!nova && vend === e.vendedor_id && e.comissao_pct_app == null) ? e.comissao_pct : (ADMIN ? pctPadraoVend(vend) : D.perfil.comissao_pct);
    const parc = g('parceiro_id');
    v.parceiro_pct = (!nova && parc === (e.parceiro_id || '') && e.parceiro_pct_app == null) ? e.parceiro_pct : (ADMIN ? pctPadraoParc(parc) : 0);
    const cpa = g('comissao_pct_app'), ppa = g('parceiro_pct_app');
    if (temManual(cpa)) { v.comissao_pct = +String(cpa).replace(',', '.'); v.pct_app = true; }
    if (temManual(ppa)) { v.parceiro_pct = +String(ppa).replace(',', '.'); v.ppct_app = true; }
    return v;
  };
  const atualizar = () => {
    const serv = f.elements.servico.value;
    $('blocoMilhas').hidden = !ehMilhas(serv); $('blocoCusto').hidden = ehMilhas(serv);
    if (daPlanilha) return;
    const r = calcular(lerValores());
    $('resumo').innerHTML = ADMIN
      ? `<div class="lin"><span>Custo</span><span>${brl2(r.custo)}</span></div><div class="lin"><span>Lucro bruto</span><span>${brl2(r.lucro_bruto)}</span></div><div class="lin"><span>Imposto</span><span>− ${brl2(r.imposto)}</span></div><div class="lin"><span>Comissão do vendedor</span><span>− ${brl2(r.comissao)}</span></div><div class="lin"><span>Parceiro</span><span>− ${brl2(r.repasse)}</span></div><div class="lin forte"><span>Lucro líquido da Maktub</span><span>${brl2(r.lucro_liquido)}</span></div>`
      : `<div class="lin"><span>Lucro da venda</span><span>${brl2(r.lucro_bruto)}</span></div><div class="lin forte"><span>Sua comissão estimada</span><span>${brl2(r.comissao)}</span></div>`;
  };
  f.oninput = atualizar; atualizar();
  $('voltar').onclick = () => history.back();
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const g = (n) => f.elements[n] ? f.elements[n].value.trim() : undefined;
    const numOuNulo = (x) => x === '' || x === undefined ? null : Number(String(x).replace(',', '.'));
    const serv = g('servico');
    if (!g('comprador')) { $('msgEm').textContent = 'Informe o comprador.'; return; }
    if (g('valor_receber') === '') { $('msgEm').textContent = 'Informe o valor a receber.'; return; }
    const row = {
      servico: serv, data_negociacao: g('data_negociacao') || null, comprador: g('comprador'), sobrenome: g('sobrenome') || null,
      passageiros: numOuNulo(g('passageiros')), contato: g('contato') || null, cpf_nf: g('cpf_nf') || null,
      parceiro_id: g('parceiro_id') || null, origem: (g('origem') || '').toUpperCase() || null, destino: (g('destino') || '').toUpperCase() || null,
      cia: g('cia') || null, localizador: (g('localizador') || '').toUpperCase() || null, data_ida: g('data_ida') || null, data_volta: g('data_volta') || null,
      produto: g('produto') || null, milhas: ehMilhas(serv) ? (numOuNulo(g('milhas')) || 0) : 0, milheiro: ehMilhas(serv) ? (numOuNulo(g('milheiro')) || 0) : 0,
      taxas: ehMilhas(serv) ? (numOuNulo(g('taxas')) || 0) : (numOuNulo(g('custo_direto')) || 0), valor_receber: numOuNulo(g('valor_receber')) || 0,
      fornecedor: g('fornecedor') || null, conta: g('conta') || null, forma_pagamento: g('forma_pagamento') || null, parcelas: numOuNulo(g('parcelas')),
      observacoes: g('observacoes') || null
    };
    ['pago', 'nota_gerada', 'checkin_ida', 'checkin_volta', 'monitorado', 'voado', 'feito_pos'].forEach(n => row[n] = f.elements[n].checked);
    if (ADMIN) { row.vendedor_id = g('vendedor_id') || null; row.comissao_manual = numOuNulo(g('comissao_manual')); row.repasse_manual = numOuNulo(g('repasse_manual')); row.comissao_pct_app = numOuNulo(g('comissao_pct_app')); row.parceiro_pct_app = numOuNulo(g('parceiro_pct_app')); }
    else if (nova) row.vendedor_id = D.meuId;
    if (travado) financeiros.forEach(n => delete row[n]);
  if (!ADMIN) { delete row.comissao_pct_app; delete row.parceiro_pct_app; }
    $('salvar').disabled = true; $('msgEm').textContent = 'Salvando...';
    const q = nova ? sb.from('emissoes').insert(row).select().single() : sb.from('emissoes').update(row).eq('id', e.id).select().single();
    const { data, error } = await q;
    $('salvar').disabled = false;
    if (error) { $('msgEm').textContent = 'Não salvou: ' + error.message; return; }
    const i = D.emissoes.findIndex(x => x.id === data.id); if (i >= 0) D.emissoes[i] = data; else D.emissoes.unshift(data);
    aviso(nova ? `Emissão registrada. Comissão: ${brl2(data.comissao)}.` : 'Emissão atualizada.');
    EM_MES = String(data.data_negociacao).slice(0, 7);
    carregarAgendaEm().then(() => {});
    history.back();
  };
  if ($('excluir')) $('excluir').onclick = async () => {
    if (CONFIRMA !== e.id) { CONFIRMA = e.id; $('excluir').textContent = 'Toque de novo para confirmar a exclusão'; return; }
    const { error } = await sb.from('emissoes').delete().eq('id', e.id);
    if (error) { aviso('Não excluiu: ' + error.message); return; }
    D.emissoes = D.emissoes.filter(x => x.id !== e.id); CONFIRMA = null; aviso('Emissão excluída.'); history.back();
  };
}

/* ---------- ajuste do administrador nas emissões da planilha ---------- */
function blocoAjuste(e, travado) {
  if (!ADMIN) return '';
  const vPlan = e.vendedor_app ? '' : e.vendedor_id;
  return `<form class="ajuste form" id="fAj" autocomplete="off">
    <div class="grupo">Comissão e parceiro desta venda</div>
    <label class="fl"><span>Vendedor</span><select name="vendedor_app">
      <option value="">${e.vendedor_app ? 'Usar o da planilha' : `Da planilha: ${esc(nomeTime(vPlan) || 'sem vendedor')}`}</option>
      ${D.time.map(t => `<option value="${t.user_id}" ${t.user_id === e.vendedor_app ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></label>
    <label class="fl"><span>Comissão do vendedor (%)</span><input name="comissao_pct_app" type="number" step="any" min="0" max="100" inputmode="decimal" value="${e.comissao_pct_app ?? ''}"><small id="ajVendDica"></small></label>
    <label class="fl"><span>Parceiro que indicou</span><select name="parceiro_app">
      <option value="">${e.parceiro_app ? 'Usar o da planilha' : (e.parceiro_id ? `Da planilha: ${esc(nomeParc(e.parceiro_id))}` : 'Sem parceiro')}</option>
      ${D.parceirosAdm.filter(p => p.ativo || p.id === e.parceiro_app).map(p => `<option value="${p.id}" ${p.id === e.parceiro_app ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></label>
    <label class="fl"><span>Remuneração do parceiro (%)</span><input name="parceiro_pct_app" type="number" step="any" min="0" max="100" inputmode="decimal" value="${e.parceiro_pct_app ?? ''}"><small id="ajParcDica"></small></label>
    <label class="fl"><span>Tipo de serviço</span><select name="servico_app">
      <option value="">${e.servico_app ? 'Usar o da planilha' : `Da planilha: ${esc(e.servico || '-')}`}</option>
      ${SERVICOS.map(x => `<option ${x === e.servico_app ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    <div class="resumo" id="resumoAj"></div>
    <button class="zap grande" type="submit" id="salvarAj" style="margin-top:12px;width:100%">Salvar comissão e parceiro</button>
    ${travado ? '<div class="sub">Mês fechado: vendedor, percentuais e parceiro estão travados. O tipo de serviço continua editável.</div>' : '<div class="sub">Deixe um percentual em branco para usar o padrão. O que você definir aqui vale só para esta venda e a planilha não apaga.</div>'}
    <div class="sub" id="msgAj"></div>
  </form>`;
}
function ligarAjuste(e, travado) {
  const f = $('fAj'); if (!f) return;
  if (travado) ['vendedor_app', 'comissao_pct_app', 'parceiro_app', 'parceiro_pct_app'].forEach(n => f.elements[n].disabled = true);
  const g = (n) => f.elements[n].value.trim();
  const valores = () => {
    const vendApp = g('vendedor_app'), parcApp = g('parceiro_app');
    const vend = vendApp || (e.vendedor_app ? null : e.vendedor_id);
    const parc = parcApp || (e.parceiro_app ? null : e.parceiro_id);
    const padraoV = vend === e.vendedor_id && e.comissao_pct_app == null ? +e.comissao_pct : pctPadraoVend(vend);
    const padraoP = parc === e.parceiro_id && e.parceiro_pct_app == null ? +e.parceiro_pct : pctPadraoParc(parc);
    const cpa = g('comissao_pct_app'), ppa = g('parceiro_pct_app');
    const v = { milhas: e.milhas, milheiro: e.milheiro, taxas: e.taxas, valor_receber: e.valor_receber,
      comissao_manual: e.comissao_manual, repasse_manual: e.repasse_manual,
      comissao_pct: temManual(cpa) ? +cpa.replace(',', '.') : padraoV, pct_app: temManual(cpa),
      parceiro_pct: parc ? (temManual(ppa) ? +ppa.replace(',', '.') : padraoP) : 0, ppct_app: temManual(ppa) };
    return { v, vend, parc, padraoV, padraoP };
  };
  const atualizar = () => {
    const { v, vend, parc, padraoV, padraoP } = valores(), r = calcular(v);
    $('ajVendDica').textContent = vend ? `Em branco = ${pct(padraoV)}${temManual(e.comissao_manual) && !v.pct_app ? `, mas a planilha tem ${brl2(e.comissao_manual)} fixos na coluna Comissão` : ''}` : 'Escolha o vendedor para calcular a comissão';
    $('ajParcDica').textContent = parc ? `Em branco = ${pct(padraoP)} (padrão do parceiro)` : 'Sem parceiro nesta venda';
    f.elements.parceiro_pct_app.disabled = travado || !parc;
    $('resumoAj').innerHTML = `<div class="lin"><span>Valor da venda</span><span>${brl2(e.valor_receber)}</span></div><div class="lin"><span>Custo</span><span>− ${brl2(r.custo)}</span></div><div class="lin"><span>Imposto (${pct(D.cfg ? D.cfg.imposto_pct : 6)})</span><span>− ${brl2(r.imposto)}</span></div><div class="lin"><span>Comissão ${vend ? esc(nomeTime(vend)) : ''} (${pct(v.comissao_pct)})</span><span>− ${brl2(r.comissao)}</span></div><div class="lin"><span>Parceiro ${parc ? esc(nomeParc(parc)) + ` (${pct(v.parceiro_pct)})` : ''}</span><span>− ${brl2(r.repasse)}</span></div><div class="lin forte"><span>Lucro líquido da Maktub</span><span>${brl2(r.lucro_liquido)}</span></div>`;
  };
  f.oninput = atualizar; f.onchange = atualizar; atualizar();
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const num = (x) => x === '' ? null : Number(x.replace(',', '.'));
    const cpa = num(g('comissao_pct_app')), ppa = num(g('parceiro_pct_app'));
    if ([cpa, ppa].some(x => x != null && (isNaN(x) || x < 0 || x > 100))) { $('msgAj').textContent = 'Os percentuais precisam estar entre 0 e 100.'; return; }
    const row = { servico_app: g('servico_app') || null };
    if (!travado) Object.assign(row, { vendedor_app: g('vendedor_app') || null, parceiro_app: g('parceiro_app') || null, comissao_pct_app: cpa, parceiro_pct_app: ppa });
    $('salvarAj').disabled = true; $('msgAj').textContent = 'Salvando...';
    const { data, error } = await sb.from('emissoes').update(row).eq('id', e.id).select().single();
    $('salvarAj').disabled = false;
    if (error) { $('msgAj').textContent = 'Não salvou: ' + error.message; return; }
    const i = D.emissoes.findIndex(x => x.id === data.id); if (i >= 0) D.emissoes[i] = data;
    aviso(`Salvo. Comissão: ${brl2(data.comissao)} · parceiro: ${brl2(data.repasse)} · líquido: ${brl2(data.lucro_liquido)}.`);
    telaFormEmissao($('pagina'));
  };
}

      <div class="num destaque"><div class="l">Lucro líquido</div><div class="v">${brlC(liq)}</div><div class="d">margem de ${vendas ? pct(liq / vendas * 100) : '0%'} sobre vendas</div></div>

      <div class="num"><div class="l">Lucro bruto</div><div class="v">${brlC(soma(L, 'lucro_bruto'))}</div><div class="d">custo ${brlC(soma(L, 'custo'))}</div></div>
      <div class="num"><div class="l">Imposto</div><div class="v">${brlC(soma(L, 'imposto'))}</div><div class="d">${pct(D.cfg ? D.cfg.imposto_pct : 6)} sobre o lucro</div></div>
      <div class="num"><div class="l">Comissões</div><div class="v">${brlC(soma(L, 'comissao'))}</div><div class="d">a pagar ao time</div></div>

    </div>
    ${meses}
    <section class="bloco"><h2>Lucro líquido por serviço</h2>${barras(Object.entries(porServ).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, Math.round(v)]), 'ouro')}</section>
    <section class="bloco"><h2>Por vendedor</h2>${Object.keys(porVend).length ? Object.entries(porVend).sort((a, b) => b[1].c - a[1].c).map(([k, x]) => `<button class="lin" data-vend="${k || 'sem'}"><span>${esc(nomeTime(k) || 'Sem vendedor')} · ${x.n} emiss${x.n === 1 ? 'ão' : 'ões'}</span><span>${brl2(x.c)}<b class="seta">›</b></span></button>`).join('') : '<div class="vazio">Sem emissões.</div>'}<div class="sub">Valor à direita: comissão a pagar. Toque para ver as vendas.</div></section>
    <section class="bloco"><h2>Por serviço</h2>${Object.keys(porServ).length ? Object.entries(porServ).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<button class="lin" data-serv="${esc(k)}"><span>${esc(k)} · ${L.filter(e => e.servico === k).length}</span><span>${brl2(v)}<b class="seta">›</b></span></button>`).join('') : '<div class="vazio">Sem emissões.</div>'}<div class="sub">Valor à direita: lucro líquido. Toque para ver as vendas.</div></section>

  P.querySelectorAll('[data-serv]').forEach(b => b.onclick = () => { EM_SERV = b.dataset.serv; EM_VEND = 'todos'; ir('emissoes'); });

    const f = await sb.from('fechamentos').select('*'); D.fech = f.data || [];

async function carregarEquipe() {

async function carregarAgendaEm() {
  const iso = (d) => d.toISOString().slice(0, 10);
  const r = await sb.rpc('agenda_voos', { p_de: iso(new Date(+HOJE() - 864e5)), p_ate: iso(new Date(+HOJE() + 120 * 864e5)) });
  D.voosEm = r.data || [];
}

/* trechos de voo das emissões (todo o time vê) */
function trechosEm() {
  const T = [];
  D.voosEm.forEach(v => {
    [['ida', v.data_ida, v.checkin_ida, v.origem, v.destino], ['volta', v.data_volta, v.checkin_volta, v.destino, v.origem]].forEach(([tr, data, feito, de, para]) => {
      if (!data) return;
      const d = dia(data), k = difDias(d);
      if (k < -1) return;
      T.push({ id: v.id, tr, d, feito, pendente: !feito && k >= 0 && k <= 2, de, para, v });
    });
  });
  return T;
}
const checkinsEm = () => trechosEm().filter(t => t.pendente);

/* ---------- leads ---------- */
const noPeriodo = (arr) => DIAS ? arr.filter(r => Date.now() - new Date(r.created_at) <= DIAS * 864e5) : arr;
const origemDe = (o) => {
  const v = String(o || '').trim().toLowerCase();
  if (!v || v === 'direto') return 'Direto';
  if (/google/.test(v)) return 'Google';
  if (/instagram|\big\b/.test(v)) return 'Instagram';
  if (/facebook|\bfb\b/.test(v)) return 'Facebook';
  if (/whatsapp|wa\.me/.test(v)) return 'WhatsApp';
  if (/bing/.test(v)) return 'Bing';
  if (/linkedin/.test(v)) return 'LinkedIn';
  if (/maktubgo\.com\.br/.test(v)) return 'Direto';
  try { return new URL(v).hostname.replace(/^www\./, ''); } catch (_) { return v.slice(0, 24); }
};
const semDado = (x) => !x || /^\((not set|not provided|other)\)$/i.test(String(x).trim()) ? 'Não identificado' : x;

        <div class="acoes">${r.whatsapp ? `<a class="zap" href="${zapLink(r.whatsapp, r.nome, `Olá, ${String(r.nome || '').split(' ')[0]}! Aqui é da Maktub Go. Recebemos a sua solicitação de convite para a Gestão de Milhas Concierge e quero agendar o seu diagnóstico.`)}" target="_blank" rel="noopener">${ZAP} WhatsApp</a>` : ''}${r.email ? `<a class="sec" href="mailto:${esc(r.email)}">E-mail</a>` : ''}${selStatus('solicitacoes_acesso', r.id, r.status, ST_SOL)}</div>
        <div class="acoes"><button class="sec" data-reu="${esc(JSON.stringify({ cliente: r.nome || '', contato: r.whatsapp || r.email || '', origem: r.indicado_por ? 'Indicação de cliente' : 'Site', produto: 'Gestão de Milhas', tipo: 'Diagnóstico da Gestão de Milhas' }))}">Registrar diagnóstico</button></div>
      </article>`).join('') : '<div class="vazio">Nenhuma solicitação com esse filtro.</div>';

        <div class="cab"><div><div class="nome">${esc(r.nome)}</div>${r.area ? `<span class="tag">${esc(r.area)}</span>` : ''}</div><span class="quando">${quando(r.created_at)}</span></div>

        <div class="acoes">${r.whatsapp ? `<a class="zap" href="https://wa.me/${zapNum(r.whatsapp)}" target="_blank" rel="noopener">${ZAP} WhatsApp</a>` : ''}${r.email ? `<a class="sec" href="mailto:${esc(r.email)}">E-mail</a>` : ''}</div>

  el.querySelectorAll('[data-reu]').forEach(b => b.onclick = () => { const pre = JSON.parse(b.dataset.reu); ir('reunioes', () => { RE_ED = 'nova'; RE_PRE = pre; }); });

    if (error) { aviso('Não salvou: ' + error.message); return; }

}

/* ---------- clientes ---------- */
function telaClientes(P) {

  const lista = ordem.filter(c => !BUSCA || String(c.nome_completo || '').toLowerCase().includes(BUSCA.toLowerCase()))
    .map(c => ({ c, pat: patrimonio(c.id), mi: milhas(c.id), v: progsDe(c.id).filter(p => p.vencimento_data && Number(p.vencimento_quantidade) > 0).map(p => dia(p.vencimento_data)).filter(d => difDias(d) >= 0).sort((a, b) => a - b)[0] }))
    .sort((a, b) => FILTRO === 'renovar' ? String(a.c.gestao_vencimento).localeCompare(String(b.c.gestao_vencimento)) : b.pat - a.pat);

    <div class="sub">${D.clientes.length} clientes · ${brlC(totPat)} sob gestão · ${brlC(economiaAno())} de economia em ${new Date().getFullYear()}</div>
    <input class="busca" id="busca" type="search" placeholder="Buscar cliente" value="${esc(BUSCA)}">
    <div class="chips" style="margin-top:10px"><button data-f="todos" class="${!['atrasados', 'renovar', 'semcontrato'].includes(FILTRO) ? 'on' : ''}">Todos</button><button data-f="atrasados" class="${FILTRO === 'atrasados' ? 'on' : ''}">Sem atualização há 30+ dias (${semAtualizacao().length})</button><button data-f="renovar" class="${FILTRO === 'renovar' ? 'on' : ''}">Renovação em 90 dias (${renovacoes(90).length})</button><button data-f="semcontrato" class="${FILTRO === 'semcontrato' ? 'on' : ''}">Sem data de entrada (${semContrato().length})</button></div>
    <div class="lista">${lista.length ? lista.map(({ c, pat, mi, v }) => {
      const g = D.gestores.find(x => x.id === c.gestor_id);
      const dias = c.ultima_atualizacao ? Math.floor((Date.now() - new Date(c.ultima_atualizacao)) / 864e5) : null;
      const dv = diasPara(c.gestao_vencimento);

      return `<button class="cli" data-c="${c.id}"><div><div class="nome">${esc(c.nome_completo)}</div><div class="meta">${contrato}${g ? esc(g.nome) + ' · ' : ''}${dias === null ? 'painel nunca atualizado' : dias === 0 ? 'atualizado hoje' : `atualizado há ${dias} dia${dias === 1 ? '' : 's'}`}${v && difDias(v) <= 60 ? ` · <span style="color:var(--alerta)">vencimento em ${dataCurta(v)}</span>` : ''}</div></div><div class="val"><b>${brlC(pat)}</b><span>${milC(mi)} milhas</span></div></button>`;
    }).join('') : '<div class="vazio">Nenhum cliente encontrado.</div>'}</div>`;
  $('busca').oninput = (e) => { BUSCA = e.target.value; const pos = e.target.selectionStart; telaClientes(P); $('busca').focus(); $('busca').setSelectionRange(pos, pos); };
  P.querySelectorAll('.chips button').forEach(b => b.onclick = () => { FILTRO = b.dataset.f; telaClientes(P); });
  P.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { CLI = b.dataset.c; history.pushState(null, '', '#clientes/' + CLI); telaFicha(P, CLI); scrollTo(0, 0); });

    <div class="secao">Próximos compromissos</div>

/* ---------- contrato e reuniões do cliente da Gestão ---------- */
function htmlContrato(c) {
  if (!('gestao_inicio' in c)) return '<div class="vazio">O contrato é ativado pelo 10-contrato-gestao.sql.</div>';
  if (!c.gestao_inicio) return `<div class="vazio" style="color:var(--alerta)">Data de entrada ainda não definida.</div>
    ${campo('ct_inicio', 'Data de entrada (assinatura)', '', 'date')}<button class="zap" id="ctSalvar" style="margin-top:8px;width:100%">Salvar e calcular o vencimento</button>`;
  const dv = diasPara(c.gestao_vencimento), total = 365, passados = Math.min(Math.max(total - dv, 0), total);
  return `<div class="lin"><span>Entrada</span><span>${dataBR(c.gestao_inicio)}</span></div>
    <div class="lin"><span>Vencimento</span><span style="${dv <= 30 ? 'color:var(--alerta)' : ''}">${dataBR(c.gestao_vencimento)}</span></div>
    <div class="meta"><div class="top"><span>${dv < 0 ? 'Vencido há ' + plural(-dv, 'dia', 'dias') : dv === 0 ? 'Vence hoje' : 'Faltam ' + plural(dv, 'dia', 'dias')}</span><b>${pct(passados / total * 100)}</b></div><div class="barra2"><i class="${dv <= 90 ? 'ok' : ''}" style="width:${passados / total * 100}%"></i></div><small>${dv <= 90 ? 'Período de renovação: agende a reunião com o cliente.' : 'do ciclo de 12 meses já cumprido'}</small></div>
    <div id="ctCiclos"></div>
    <div style="display:flex;gap:8px;margin-top:12px">${dv <= 90 ? '<button class="zap" id="ctRenovar" style="flex:1">Renovar por mais 12 meses</button>' : ''}<button class="sec" id="ctEditar" style="flex:1">Corrigir data de entrada</button></div>
    <div id="ctEdit" hidden>${campo('ct_inicio', 'Data de entrada (assinatura)', c.gestao_inicio, 'date')}<button class="zap" id="ctSalvar" style="margin-top:8px;width:100%">Salvar</button></div>`;
}
function ligarContrato(c) {
  const B = $('blContrato'); if (!B) return;
  const atualiza = (d) => { Object.assign(c, d); B.innerHTML = htmlContrato(c); ligarContrato(c); };
  if ($('ctEditar')) $('ctEditar').onclick = () => { $('ctEdit').hidden = !$('ctEdit').hidden; };
  if ($('ctSalvar')) $('ctSalvar').onclick = async () => {
    const v = B.querySelector('[name=ct_inicio]').value; if (!v) { aviso('Escolha a data de entrada.'); return; }
    const { data, error } = await sb.rpc('gestao_definir_inicio', { p_cliente: c.id, p_inicio: v });
    if (error) { aviso('Não salvou: ' + error.message); return; }
    atualiza(data); aviso(`Contrato até ${dataBR(data.gestao_vencimento)}.`);
  };
  if ($('ctRenovar')) $('ctRenovar').onclick = async () => {
    if (CONFIRMA !== 'renov' + c.id) { CONFIRMA = 'renov' + c.id; $('ctRenovar').textContent = 'Toque de novo para confirmar a renovação'; return; }
    CONFIRMA = null;
    const { data, error } = await sb.rpc('gestao_renovar', { p_cliente: c.id });
    if (error) { aviso('Não renovou: ' + error.message); return; }
    atualiza(data); aviso(`Renovado até ${dataBR(data.gestao_vencimento)}.`);
  };
  if (c.gestao_inicio) sb.from('gestao_ciclos').select('*').eq('cliente_id', c.id).order('inicio', { ascending: false }).then(({ data }) => {
    if (data && data.length && $('ctCiclos')) $('ctCiclos').innerHTML = `<div class="sub" style="margin-top:8px">Ciclos anteriores: ${data.map(x => dataBR(x.inicio) + ' a ' + dataBR(x.vencimento)).join(' · ')}</div>`;
  });
}
async function carregarReunioesCliente(c) {
  const [r, n] = await Promise.all([
    sb.from('reunioes').select('*').eq('cliente_id', c.id).order('data_reuniao', { ascending: false }).limit(50),
    sb.from('reunioes_internas').select('*')
  ]);
  const el = $('reuCli'); if (!el || CLI !== c.id) return;
  if (r.error) { el.innerHTML = '<div class="vazio">Não foi possível carregar as reuniões.</div>'; return; }
  const notas = n.error ? null : Object.fromEntries((n.data || []).map(x => [String(x.reuniao_id), x.texto]));
  c._reu = r.data || []; c._notas = notas;
  el.innerHTML = c._reu.length ? c._reu.map(x => `<button class="av" data-reu-cli="${x.id}"><span class="ic">•</span><span><span class="t" style="display:block">${esc(x.titulo || 'Reunião')}</span><span class="q" style="display:block">${x.data_reuniao ? dataBR(x.data_reuniao) : ''} · visível para o cliente</span>${x.resumo ? `<span class="d" style="display:block">${esc(x.resumo)}</span>` : ''}${notas && notas[String(x.id)] ? `<span class="d" style="display:block;margin-top:4px"><b style="font-weight:600">Interno:</b> ${esc(notas[String(x.id)])}</span>` : ''}</span></button>`).join('') : '<div class="vazio">Nenhuma reunião registrada com este cliente.</div>';
  el.querySelectorAll('[data-reu-cli]').forEach(b => b.onclick = () => formReuniaoCliente(c, c._reu.find(x => String(x.id) === b.dataset.reuCli)));
}
function formReuniaoCliente(c, x) {
  const el = $('reuCli'); if (!el) return;
  const nota = x && c._notas ? (c._notas[String(x.id)] || '') : '';
  el.innerHTML = `<form class="bloco form" id="fReuCli" style="margin-top:0">
    <h2>${x ? 'Editar reunião' : 'Nova reunião'}</h2>
    ${campo('titulo', 'Assunto da reunião', x ? x.titulo : '', 'text', 'required placeholder="Ex.: reunião mensal, reunião de renovação"')}
    ${campo('data_reuniao', 'Data', x ? x.data_reuniao : hojeISO(), 'date', 'required')}
    <label class="fl"><span>Resumo da reunião (o cliente vê no painel e no relatório)</span><textarea name="resumo" rows="4" placeholder="O que foi apresentado e o que ficou combinado.">${esc(x ? x.resumo || '' : '')}</textarea></label>
    <label class="fl"><span>Anotação interna (só a equipe vê)</span><textarea name="interno" rows="3" placeholder="Percepções, objeções, sinais de renovação ou de saída.">${esc(nota)}</textarea></label>
    ${c._notas === null ? '<div class="sub">A anotação interna é ativada pelo 10-contrato-gestao.sql.</div>' : ''}
    <div style="display:flex;gap:8px;margin-top:10px"><button class="zap" type="submit" style="flex:2">Salvar reunião</button><button class="sec" type="button" id="cancReuCli" style="flex:1">Cancelar</button></div>
  </form>`;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('cancReuCli').onclick = () => carregarReunioesCliente(c);
  $('fReuCli').onsubmit = async (ev) => {
    ev.preventDefault(); const f = ev.target;
    const row = { titulo: f.elements.titulo.value.trim(), data_reuniao: f.elements.data_reuniao.value, resumo: f.elements.resumo.value.trim() || null };
    const q = x ? sb.from('reunioes').update(row).eq('id', x.id).select().single() : sb.from('reunioes').insert({ ...row, cliente_id: c.id }).select().single();
    const { data, error } = await q;
    if (error) { aviso('Não salvou: ' + error.message); return; }
    const interno = f.elements.interno.value.trim();
    if (c._notas !== null && (interno || nota)) {
      const r2 = interno ? await sb.from('reunioes_internas').upsert({ reuniao_id: String(data.id), texto: interno, atualizado_em: new Date().toISOString() })
                         : await sb.from('reunioes_internas').delete().eq('reuniao_id', String(data.id));
      if (r2.error) aviso('A reunião foi salva, mas a anotação interna não: ' + r2.error.message);
    }
    aviso('Reunião salva.'); carregarReunioesCliente(c);
  };
}

      <input type="hidden" name="status" value="${esc(x.status)}">
      <div id="agResumo">
        <label class="fl"><span>Resumo da reunião</span><textarea name="resumo" rows="9" placeholder="Cole aqui o resumo do Granola: o que foi apresentado, o que o cliente disse e o que ficou combinado.">${esc(x.resumo || '')}</textarea></label>
        <label class="fc" id="agPub"><input type="checkbox" name="publicar_no_painel" ${x.publicar_no_painel ? 'checked' : ''}><span>Publicar o resumo no painel do cliente da Gestão</span></label>
      </div>
      <button class="zap grande" type="submit" id="salvarAg" style="margin-top:14px;width:100%">${nova ? 'Agendar' : 'Salvar'}</button>
      ${!nova && (ADMIN || x.created_by === D.meuId) ? `<button class="sec grande" type="button" id="excluirAg" style="margin-top:8px;width:100%">${base.status === 'Agendada' ? 'Cancelar reunião' : 'Excluir registro'}</button>` : ''}
      <div class="sub" id="msgAg">${D.tt && D.tt.conectado ? 'Ao agendar, a reunião vai para o TickTick dos participantes conectados.' : 'Conecte o TickTick na tela de Reuniões para a reunião ir para a sua agenda.'}</div>
    </form>`;
  const f = $('fAg');
  const mostrar = () => { const st = f.elements.status.value; $('agResumo').hidden = st !== 'Realizada'; $('agPub').hidden = !(f.elements.cliente_id && f.elements.cliente_id.value); $('salvarAg').textContent = nova ? (st === 'Agendada' ? 'Agendar' : 'Registrar') : 'Salvar'; };
  $('agSt').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; f.elements.status.value = b.dataset.v; [...$('agSt').children].forEach(y => y.classList.toggle('on', y === b)); mostrar(); };
  f.onchange = mostrar; mostrar();
  $('voltar').onclick = () => history.back();
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const g = (n) => f.elements[n] ? f.elements[n].value.trim() : '';
    const parts = [...f.querySelectorAll('[name=part]:checked')].map(c => c.value);
    if (!parts.length) { $('msgAg').textContent = 'Marque pelo menos um participante da Maktub.'; return; }
    const row = { titulo: g('titulo'), tipo: g('tipo'), data: new Date(g('data')).toISOString(), duracao_min: Number(g('duracao_min') || 60), link: g('link') || null,
      cliente_id: g('cliente_id') || null, atendimento_id: g('atendimento_id') || null, cliente: g('cliente') || null, participantes: parts,
      status: g('status'), resumo: g('status') === 'Realizada' ? (g('resumo') || null) : (x.resumo || null), publicar_no_painel: !!(f.elements.publicar_no_painel && f.elements.publicar_no_painel.checked && g('cliente_id')) };
    if (nova && x.agendamento_id) row.agendamento_id = x.agendamento_id;
    $('salvarAg').disabled = true; $('msgAg').textContent = 'Salvando...';
    const q = nova ? sb.from('agenda_reunioes').insert(row).select().single() : sb.from('agenda_reunioes').update(row).eq('id', base.id).select().single();
    const { data, error } = await q;
    $('salvarAg').disabled = false;
    if (error) { $('msgAg').textContent = 'Não salvou: ' + error.message; return; }
    const i = D.agenda.findIndex(y => y.id === data.id); if (i >= 0) D.agenda[i] = data; else D.agenda.unshift(data);
    if (row.agendamento_id) { const a = D.ags.find(y => String(y.id) === row.agendamento_id); if (a) a.status = 'confirmada'; }
    aviso(row.status === 'Agendada' ? (D.tt && D.tt.conectado ? 'Reunião agendada e enviada para o TickTick.' : 'Reunião agendada.') : row.status === 'Realizada' && !row.resumo ? 'Registrada. Falta colar o resumo.' : 'Reunião salva.');
    AG_ED = null; AG_VISTA = 'reunioes'; history.replaceState(null, '', '#agenda'); telaAgenda(P); scrollTo(0, 0);
  };
  if ($('excluirAg')) $('excluirAg').onclick = async () => {
    const cancelar = base.status === 'Agendada';
    if (CONFIRMA !== 'ag' + base.id) { CONFIRMA = 'ag' + base.id; $('excluirAg').textContent = cancelar ? 'Toque de novo para cancelar' : 'Toque de novo para excluir'; return; }
    CONFIRMA = null;
    const r2 = cancelar ? await sb.from('agenda_reunioes').update({ status: 'Cancelada' }).eq('id', base.id).select().single() : await sb.from('agenda_reunioes').delete().eq('id', base.id);
    if (r2.error) { aviso('Não foi possível: ' + r2.error.message); return; }
    if (cancelar) Object.assign(base, r2.data); else D.agenda = D.agenda.filter(y => y.id !== base.id);
    aviso(cancelar ? 'Reunião cancelada. Ela sai do TickTick.' : 'Registro excluído.'); AG_ED = null; history.replaceState(null, '', '#agenda'); telaAgenda(P);
  };

}

/* ---------- site ---------- */
async function carregarSite() {
  if (SITE && SITE.dias === SITE_DIAS) return SITE;
  try {
    const { data, error } = await sb.functions.invoke('metricas-site', { body: { dias: SITE_DIAS } });
    SITE = error || !data || !data.ok ? { ok: false, erro: (error && error.message) || (data && data.erro) || '', dias: SITE_DIAS } : { ...data, dias: SITE_DIAS };
  } catch (e) { SITE = { ok: false, erro: String(e), dias: SITE_DIAS }; }
  return SITE;
}
async function telaSite(P) {
  P.innerHTML = `<h1 class="titulo">Números do <em>site</em></h1><div class="seg" id="sdias">${[[7, '7 dias'], [28, '28 dias'], [90, '90 dias']].map(([d, l]) => `<button data-d="${d}" class="${d === SITE_DIAS ? 'on' : ''}">${l}</button>`).join('')}</div><div id="sconteudo"><div class="vazio">Carregando...</div></div>`;
  $('sdias').onclick = (e) => { const b = e.target.closest('button'); if (b) { SITE_DIAS = +b.dataset.d; telaSite(P); } };
  const [, cl] = await Promise.all([carregarSite(), sb.from('clarity_dias').select('*').order('dia', { ascending: false }).limit(90)]);
  const el = $('sconteudo'); if (!el || ABA !== 'site') return;
  const blClarity = htmlClarity(cl.error ? null : cl.data || []);
  if (!SITE.ok) {
    el.innerHTML = `<div class="config" style="margin-top:12px"><b>Ainda não conectado.</b><br>Os números do Google Analytics e do Search Console aparecem aqui depois da configuração da função <b>metricas-site</b> no Supabase, com uma conta de serviço do Google. O passo a passo está no guia de configuração do app.${SITE.erro ? `<div style="margin-top:8px;font-size:12px;color:var(--tinta-3)">Detalhe técnico: ${esc(SITE.erro)}</div>` : ''}</div>
      <div class="bloco"><h2>Enquanto isso</h2><div class="lin"><a href="https://analytics.google.com/" target="_blank" rel="noopener">Abrir Google Analytics</a><span>›</span></div><div class="lin"><a href="https://search.google.com/search-console?resource_id=sc-domain%3Amaktubgo.com.br" target="_blank" rel="noopener">Abrir Search Console</a><span>›</span></div></div>` + blClarity;
    return;
  }
  const ga = SITE.ga, sc = SITE.sc;
  el.innerHTML = `
    <div class="secao">Visitas (Google Analytics)</div>
    <div class="numeros">
      <div class="num destaque"><div class="l">Visitas</div><div class="v">${num(ga.sessoes)}</div><div class="d">${num(ga.usuarios)} pessoas</div></div>
      <div class="num"><div class="l">Cliques no WhatsApp</div><div class="v">${num(ga.whatsapp)}</div></div>
      <div class="num"><div class="l">Formulários</div><div class="v">${num(ga.formularios)}</div></div>
      <div class="num"><div class="l">Taxa de contato</div><div class="v">${ga.sessoes ? ((ga.whatsapp + ga.formularios) / ga.sessoes * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) : 0}%</div><div class="d">contatos sobre visitas</div></div>
    </div>
    <section class="bloco"><h2>Páginas mais vistas</h2>${barras((ga.paginas || []).map(p => [semDado(p.pagina), p.visitas]))}</section>
    <section class="bloco"><h2>De onde vêm as visitas</h2>${barras((ga.origens || []).map(o => [semDado(o.origem), o.visitas]), 'ouro')}${(ga.origens || []).some(o => /not set|not provided/i.test(o.origem || '')) ? '<div class="sub">Não identificado: o Google não conseguiu saber de onde a pessoa veio (link copiado e colado, aplicativo de mensagem que esconde a origem ou visita muito curta).</div>' : ''}</section>
    <div class="secao">Busca no Google (Search Console)</div>
    <div class="numeros">
      <div class="num destaque"><div class="l">Cliques</div><div class="v">${num(sc.cliques)}</div></div>
      <div class="num"><div class="l">Aparições</div><div class="v">${num(sc.impressoes)}</div></div>
      <div class="num"><div class="l">Taxa de clique</div><div class="v">${(sc.ctr * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%</div></div>
      <div class="num"><div class="l">Posição média</div><div class="v">${Number(sc.posicao || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}</div></div>
    </div>
    <section class="bloco"><h2>O que as pessoas buscaram</h2>${(sc.consultas || []).length ? sc.consultas.map(q => `<div class="lin"><span>${esc(q.termo)}</span><span>${num(q.cliques)} cliques · ${num(q.impressoes)} aparições</span></div>`).join('') : '<div class="vazio">Sem buscas registradas no período.</div>'}</section>
    <div class="sub" style="margin-top:10px">Dados do Search Console chegam com cerca de 2 dias de atraso.</div>` + blClarity;
}

/* comportamento das visitas (Microsoft Clarity): retratos diários guardados pelo banco */
function htmlClarity(dias) {
  const cab = '<div class="secao">Comportamento das visitas (Clarity) <a href="https://clarity.microsoft.com/projects/view/ypnuw0ek2m/dashboard" target="_blank" rel="noopener">Abrir ›</a></div>';
  if (dias === null) return cab + '<div class="vazio">O Clarity no app é ativado pelo 13-clarity.sql.</div>';
  const periodo = dias.filter(d => difDias(dia(d.dia)) > -SITE_DIAS);
  if (!periodo.length) return cab + '<div class="vazio">Ainda sem dados. O app busca os números do Clarity 3 vezes por dia (9h, 15h e 21h).</div>';
  const n = (v) => Number(String(v ?? '').replace(',', '.')) || 0;
  const met = (d, nome) => { const m = ((d.dados || {}).geral || []).find(x => String(x.metricName).toLowerCase() === nome.toLowerCase()); return m ? (m.information || []) : []; };
  const pri = (d, nome) => met(d, nome)[0] || {};
  let sess = 0, bots = 0, usu = 0, pps = 0, rol = 0, tTot = 0, tAt = 0, sRol = 0, sT = 0, mortos = 0, raiva = 0, rolEx = 0, volta = 0, k = 0;
  const pags = {}, disp = {};
  periodo.forEach(d => {
    const t = pri(d, 'Traffic'), s1 = n(t.totalSessionCount);
    sess += s1; bots += n(t.totalBotSessionCount); usu += n(t.distantUserCount); pps += n(t.PagesPerSessionPercentage) * s1;
    if (met(d, 'Scroll Depth').length) { rol += n(pri(d, 'Scroll Depth').averageScrollDepth) * s1; sRol += s1; }
    const e = pri(d, 'Engagement Time'); if (met(d, 'Engagement Time').length) { tTot += n(e.totalTime) * s1; tAt += n(e.activeTime) * s1; sT += s1; }
    mortos += n(pri(d, 'Dead Click Count').sessionsCount); raiva += n(pri(d, 'Rage Click Count').sessionsCount);
    rolEx += n(pri(d, 'Excessive Scroll').sessionsCount); volta += n(pri(d, 'Quickback Click').sessionsCount);
    met(d, 'Popular Pages').forEach(p => { const u = String(p.url || '').replace(/^https?:\/\/(www\.)?maktubgo\.com\.br/, '') || '/'; pags[u] = (pags[u] || 0) + n(p.visitsCount); });
    (((d.dados || {}).dispositivos || []).find(x => x.metricName === 'Traffic') || { information: [] }).information.forEach(x => { disp[x.Device || 'Outro'] = (disp[x.Device || 'Outro'] || 0) + n(x.totalSessionCount); });
    k++;
  });
  const media = (v) => sess ? v / sess : 0;
  const seg = (x) => { x = Math.round(x); return x >= 60 ? Math.floor(x / 60) + ' min ' + (x % 60 ? (x % 60) + ' s' : '') : x + ' s'; };
  const pc = (x) => sess ? (x / sess * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%' : '0%';
  const DISP = { PC: 'Computador', Mobile: 'Celular', Tablet: 'Tablet', Other: 'Outro' };
  return cab + `<div class="sub" style="margin-top:-4px">${k} dia${k === 1 ? '' : 's'} com dados no período · atualizado ${quando(periodo[0].atualizado_em)}</div>
    <div class="numeros" style="margin-top:8px">
      <div class="num destaque"><div class="l">Sessões</div><div class="v">${num(sess)}</div><div class="d">${num(bots)} de robôs excluídas</div></div>
      <div class="num"><div class="l">Páginas por sessão</div><div class="v">${media(pps).toLocaleString('pt-BR', { maximumFractionDigits: 2 })}</div></div>
      <div class="num"><div class="l">Rolagem média</div><div class="v">${(sRol ? rol / sRol : 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%</div><div class="d">da página vista</div></div>
      <div class="num"><div class="l">Tempo ativo</div><div class="v">${seg(sT ? tAt / sT : 0)}</div><div class="d">de ${seg(sT ? tTot / sT : 0)} no total</div></div>
    </div>
    <section class="bloco"><h2>Sinais de frustração</h2>
      <div class="lin"><span>Cliques mortos (clicou e nada aconteceu)</span><span>${pc(mortos)}</span></div>
      <div class="lin"><span>Cliques de raiva (vários cliques seguidos)</span><span>${pc(raiva)}</span></div>
      <div class="lin"><span>Rolagem excessiva (procurando algo)</span><span>${pc(rolEx)}</span></div>
      <div class="lin"><span>Voltou rápido para a página anterior</span><span>${pc(volta)}</span></div>
      <div class="sub">Porcentagem das sessões. As gravações dessas visitas ficam no Clarity.</div></section>
    ${Object.keys(disp).length ? `<section class="bloco"><h2>Aparelho</h2>${barras(Object.entries(disp).sort((a, b) => b[1] - a[1]).map(([kk, v]) => [DISP[kk] || kk, v]), 'ouro')}</section>` : ''}
    ${Object.keys(pags).length ? `<section class="bloco"><h2>Páginas mais visitadas (Clarity)</h2>${barras(Object.entries(pags).sort((a, b) => b[1] - a[1]).slice(0, 8))}</section>` : ''}`;
}
</script>
