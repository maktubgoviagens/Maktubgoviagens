.fotosG{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -2px 10px;scrollbar-width:none}.fotosG::-webkit-scrollbar{display:none}.fotosG:empty{display:none}.fotosG figure{margin:0;flex:0 0 82%;scroll-snap-align:start}.fotosG img{width:100%;height:190px;object-fit:cover;display:block;background:var(--linha)}.fotosG figcaption{font-size:11px;color:var(--tinta-3);margin-top:3px}.fotosG figcaption a{color:inherit}

.lt-i{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--linha);font-size:13.5px;line-height:1.35}.lt-i:first-of-type{border-top:0}.lt-i .q{color:var(--tinta-3);font-size:12px;font-variant-numeric:tabular-nums}.lt-i b{font-weight:600;color:var(--verde)}.lt-i .d{color:var(--tinta-2)}

.gtr{background:var(--branco);border:1px solid var(--linha);padding:14px 10px 12px;margin-top:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:14px}.gtr div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}.gtr i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:#efe9dc;color:var(--tinta-3)}.gtr i.f{background:var(--dourado);color:#fff}.gtr i.f.pv{background:var(--verde)}.gtr i.a{background:#fff;color:var(--dourado);box-shadow:0 0 0 2px var(--dourado)}.gtr i.a.pv{color:var(--verde);box-shadow:0 0 0 2px var(--verde)}.gtr i.x{background:var(--alerta);color:#fff}.gtr span{font-size:11.5px;line-height:1.2;color:var(--tinta-3)}.gtr span.on{color:var(--tinta);font-weight:500}.gtr small{font-size:10.5px;color:var(--tinta-3);line-height:1.2;min-height:12px}
.gagora{background:var(--verde);color:var(--creme);padding:16px;margin-top:10px;display:flex;flex-direction:column;gap:8px}.gagora .r{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dourado-claro);font-weight:600}.gagora .t{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1.15}.gagora .d{font-size:13px;color:rgba(249,246,241,.85)}.gagora .b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}.gagora .b>*{display:block;text-align:center;text-decoration:none;font:inherit;font-size:13.5px;padding:12px 8px;cursor:pointer}.gagora .b .p{background:var(--dourado);color:#fff;border:0;font-weight:600}.gagora .b .s{background:transparent;color:var(--creme);border:1px solid rgba(201,169,110,.6)}.gagora .b>*:only-child{grid-column:1/-1}
.glib{display:flex;flex-direction:column;margin-top:2px}.glib>div{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(201,169,110,.3)}.glib>div:first-child{border-top:0;padding-top:4px}.glib i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(201,169,110,.7);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:var(--dourado-claro)}.glib i.ok{background:var(--dourado);border-color:var(--dourado);color:#fff}.glib .x{flex:1;min-width:0}.glib b{display:block;font-weight:600;font-size:14px;color:var(--creme)}.glib small{display:block;font-size:12.5px;color:rgba(249,246,241,.8);margin-top:2px}.glib .ac{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.glib .ac button,.glib .ac a{font:inherit;font-size:12.5px;padding:8px 10px;cursor:pointer;background:transparent;color:var(--creme);border:1px solid rgba(201,169,110,.6);text-decoration:none}.glib .ac .p{background:var(--dourado);border-color:var(--dourado);color:#fff;font-weight:600}.glib input{width:100%;margin-top:6px;padding:9px 10px;font:inherit;font-size:14px;border:1px solid rgba(201,169,110,.6);background:rgba(255,255,255,.95);color:var(--tinta)}.glib .pular{background:none;border:0;color:rgba(249,246,241,.65);font:inherit;font-size:12px;text-decoration:underline;padding:6px 0 0;cursor:pointer;text-align:left}
.gt .dono{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3);margin-left:30px;margin-top:2px}.gt details.rot{margin:6px 0 0 30px}.gt details.rot summary{font-size:12.5px;color:var(--dourado);cursor:pointer}.gt details.rot div{font-size:13px;line-height:1.5;color:var(--tinta-2);white-space:pre-line;margin-top:6px}

.gjres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.gjres button{background:var(--branco);border:1px solid var(--linha);padding:10px 12px;text-align:left;cursor:pointer;font:inherit}.gjres .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}.gjres .bs{display:flex;gap:3px;margin-top:8px}.gjres .bs i{flex:1;height:8px;background:#efe9dc}.gjres .d{font-size:12.5px;color:var(--tinta-2);margin-top:6px}
.gjchips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.gjchips::-webkit-scrollbar{display:none}.gjchips button{white-space:nowrap;border-radius:20px;padding:8px 12px;font-size:12.5px;background:var(--branco);color:var(--tinta-2);border:1px solid var(--linha);cursor:pointer}.gjchips button b{font-weight:600;margin-left:3px}
.gj{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity;align-items:flex-start}.gj::-webkit-scrollbar{height:5px}.gj::-webkit-scrollbar-thumb{background:var(--dourado);border-radius:3px}.gjc{flex:0 0 236px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}.gjc h3{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;padding:0 2px;margin:0}.gjc h3 small{font-size:12px;letter-spacing:0;color:var(--tinta-3);font-weight:400}.gjc .ln{height:3px}.gjk{background:var(--branco);border:1px solid var(--linha);padding:11px 12px;display:flex;flex-direction:column;gap:5px;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}.gjk .n{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--verde);line-height:1.15}.gjk .s{align-self:flex-start;font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:10px;background:#f2ece1;color:#6b5320}.gjk .s.al{background:#f6e7dc;color:var(--alerta)}.gjk .s.ok{background:#e3ece5;color:var(--verde)}.gjk .p{font-size:12.5px;color:var(--tinta-2)}.gjk .q{font-size:11.5px;color:var(--tinta-3);border-top:1px solid var(--linha);padding-top:5px}
.pia h4{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dourado);font-weight:600;margin:14px 0 6px}.pia ul{margin:0;padding-left:18px}.pia li{margin:3px 0;font-size:14px}.pia p{margin:4px 0;font-size:14px}.pia .ob{border-top:1px solid var(--linha);padding:6px 0;font-size:14px}.pia .ob b{color:var(--verde);font-weight:600}.pia .acs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pia .acs>*{flex:1;min-width:140px}

<script>
// Sugestões ao digitar: todo campo com lista (clientes, comprador, fornecedor, programas...)
// mostra uma caixa logo abaixo com os nomes cadastrados que batem com o que foi digitado.
// Toque em um nome para escolher (escolha única).
(() => {
  const tira = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let caixa = null, alvo = null, itens = [], ativo = -1;
  const fechar = () => { if (caixa) caixa.remove(); caixa = null; ativo = -1; };
  const opcoes = inp => {
    const id = inp.dataset.lista || inp.getAttribute('list');
    const dl = id && document.getElementById(id);
    return dl ? [...new Set([...dl.options].map(o => o.value).filter(Boolean))] : [];
  };
  const prepara = inp => {
    if (inp.dataset.lista || !inp.getAttribute('list')) return;
    inp.dataset.lista = inp.getAttribute('list');
    inp.removeAttribute('list'); // tira a sugestão nativa do teclado para não duplicar
    inp.setAttribute('autocomplete', 'off');
  };
  const escolher = v => {
    if (!alvo) return;
    alvo.value = v;
    alvo.dispatchEvent(new Event('input', { bubbles: true }));
    alvo.dispatchEvent(new Event('change', { bubbles: true }));
    fechar();
  };
  const mostrar = inp => {
    const q = tira(inp.value);
    if (!q) return fechar();
    const lista = opcoes(inp).map(v => ({ v, t: tira(v) })).filter(o => o.t.includes(q) && o.t !== q);
    lista.sort((a, b) => {
      const pa = a.t.startsWith(q) ? 0 : a.t.split(/\s+/).some(w => w.startsWith(q)) ? 1 : 2;
      const pb = b.t.startsWith(q) ? 0 : b.t.split(/\s+/).some(w => w.startsWith(q)) ? 1 : 2;
      return pa - pb || a.v.localeCompare(b.v, 'pt-BR');
    });
    itens = lista.slice(0, 30).map(o => o.v);
    if (!itens.length) return fechar();
    if (!caixa) { caixa = document.createElement('div'); caixa.className = 'sug'; document.body.appendChild(caixa); }
    alvo = inp; ativo = -1;
    caixa.innerHTML = itens.map((v, i) => {
      const k = tira(v).indexOf(q);
      const h = k < 0 ? esc(v) : esc(v.slice(0, k)) + '<b>' + esc(v.slice(k, k + q.length)) + '</b>' + esc(v.slice(k + q.length));
      return `<button type="button" data-i="${i}">${h}</button>`;
    }).join('');
    const r = inp.getBoundingClientRect();
    caixa.style.left = (r.left + window.scrollX) + 'px';
    caixa.style.top = (r.bottom + window.scrollY) + 'px';
    caixa.style.width = r.width + 'px';
    // dentro de folhas com rolagem própria, posiciona como fixo
    const fixo = inp.closest('.folha,.folha-caixa,[style*="position:fixed"]');
    if (fixo) { caixa.style.position = 'fixed'; caixa.style.left = r.left + 'px'; caixa.style.top = r.bottom + 'px'; }
    else caixa.style.position = 'absolute';
  };
  document.addEventListener('focusin', e => { const t = e.target; if (t.tagName === 'INPUT' && (t.dataset.lista || t.getAttribute('list'))) { prepara(t); if (t.value) mostrar(t); } });
  document.addEventListener('input', e => { const t = e.target; if (t.tagName === 'INPUT' && t.dataset.lista && t === document.activeElement) mostrar(t); });
  // pointerdown antes do blur, para o toque na opção não se perder
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest('.sug button');
    if (b) { e.preventDefault(); escolher(itens[+b.dataset.i]); return; }
    if (caixa && !e.target.closest('.sug') && e.target !== alvo) fechar();
  }, true);
  document.addEventListener('keydown', e => {
    if (!caixa || e.target !== alvo) return;
    const bs = caixa.querySelectorAll('button');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); ativo = (ativo + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length;
      bs.forEach((b, i) => b.classList.toggle('ativo', i === ativo)); bs[ativo].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && ativo >= 0) { e.preventDefault(); escolher(itens[ativo]); }
    else if (e.key === 'Escape') fechar();
  });
  document.addEventListener('focusout', e => { if (e.target === alvo) setTimeout(() => { if (document.activeElement !== alvo) fechar(); }, 150); });
  document.addEventListener('scroll', e => { if (caixa && alvo && !caixa.contains(e.target)) mostrar(alvo); }, true);
  window.addEventListener('resize', () => { if (caixa && alvo) mostrar(alvo); });
})();
</script>

/* cálculo igual ao do banco (método 1 por padrão) */
const temManual = (x) => x != null && x !== '';
const tec = (m) => ADMIN ? m : (String(m).trim().startsWith('<') ? '<div class="config" style="margin-top:12px">Recurso ainda não ativado. Fale com o administrador.</div>' : 'Recurso ainda não ativado. Fale com o administrador.');
const pctPadraoVend = (id) => +((D.equipe.find(x => x.user_id === id) || {}).comissao_pct || 0);
const pctPadraoParc = (id) => +((D.parceirosAdm.find(x => x.id === id) || {}).pct || 0);
const nomeParc = (id) => ((D.parceirosAdm.find(x => x.id === id) || D.parc.find(x => x.id === id) || {}).nome || '');
function calcular(v) {
  const t = Number((D.cfg && D.cfg.imposto_pct) ?? 6) / 100;
  const custo = Math.round(((+v.milhas || 0) * (+v.milheiro || 0) / 1000 + (+v.taxas || 0)) * 100) / 100;
  const m = (+v.valor_receber || 0) - custo;
  const cp = (+v.comissao_pct || 0) / 100, pp = (+v.parceiro_pct || 0) / 100;
  const r2 = (x) => Math.round(x * 100) / 100;
  let imposto, comissao, repasse;
  if (D.cfg && D.cfg.comissao_desconta_imposto) {
    const iref = Math.max(m, 0) * t;
    comissao = r2(temManual(v.comissao_manual) && !v.pct_app ? +v.comissao_manual : Math.max(m - iref, 0) * cp);
    repasse = r2(temManual(v.repasse_manual) && !v.ppct_app ? +v.repasse_manual : Math.max(m - iref - comissao, 0) * pp);
    imposto = r2(Math.max(m - comissao - repasse, 0) * t);
  } else {
    imposto = r2(Math.max(m, 0) * t);
    comissao = r2(temManual(v.comissao_manual) && !v.pct_app ? +v.comissao_manual : Math.max(m - imposto, 0) * cp);
    repasse = r2(temManual(v.repasse_manual) && !v.ppct_app ? +v.repasse_manual : Math.max(m - imposto - comissao, 0) * pp);
  }
  return { custo, lucro_bruto: r2(m), imposto, comissao, repasse, lucro_liquido: r2(m - imposto - comissao - repasse) };
}

  P.querySelectorAll('[data-ck-nota]').forEach(b => b.onclick = async () => {
    const id = b.dataset.ckNota, e = D.emissoes.find(x => x.id === id), novo = !e.nota_gerada;
    if (!novo && !b.classList.contains('conf')) { b.classList.add('conf'); b.lastChild.textContent = 'Toque de novo para desmarcar'; return; }
    b.disabled = true;
    const { error } = await sb.from('emissoes').update({ nota_gerada: novo }).eq('id', id);
    if (error) { b.disabled = false; aviso('Não salvou: ' + error.message); return; }
    e.nota_gerada = novo; aviso(novo ? 'Nota marcada como emitida. Vai para a planilha em até 5 minutos.' : 'Nota desmarcada no app. Desmarque também na planilha.'); telaEmissoes(P);
  });
  P.querySelectorAll('[data-nota-pdf]').forEach(b => b.onclick = () => {
    const e = D.emissoes.find(x => x.id === b.dataset.notaPdf);
    if (e.nota_arquivo) notaBaixar(e); else notaAnexar(e, () => telaEmissoes(P));
  });
}

/* ---------- PDF da nota fiscal (bucket privado "notas") ---------- */
async function notaBaixar(e) {
  const { data, error } = await sb.storage.from('notas').createSignedUrl(e.nota_arquivo, 300, { download: 'Nota fiscal - ' + (e.comprador || 'venda') + '.' + (String(e.nota_arquivo).split('.').pop() || 'pdf') });
  if (error) { aviso('Não abriu a nota: ' + error.message); return; }
  location.href = data.signedUrl;
}
function notaAnexar(e, depois) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/pdf,.pdf,.xml';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    if (file.size > 10 * 1024 * 1024) { aviso('Arquivo acima de 10 MB.'); return; }
    aviso('Enviando a nota...');
    const ext = /\.xml$/i.test(file.name) ? 'xml' : 'pdf';
    const path = e.id + '/' + Date.now() + '.' + ext;
    const up = await sb.storage.from('notas').upload(path, file, { contentType: ext === 'xml' ? 'text/xml' : 'application/pdf', upsert: false });
    if (up.error) { aviso('Não enviou: ' + up.error.message + (/bucket/i.test(up.error.message) ? ' (rode o notas-e-datas.sql)' : '')); return; }
    const antigo = e.nota_arquivo;
    const { error } = await sb.from('emissoes').update({ nota_arquivo: path, nota_gerada: true }).eq('id', e.id);
    if (error) { await sb.storage.from('notas').remove([path]); aviso('Não salvou: ' + error.message + (/nota_arquivo/.test(error.message) ? ' (rode o notas-e-datas.sql)' : '')); return; }
    if (antigo) await sb.storage.from('notas').remove([antigo]);
    e.nota_arquivo = path; e.nota_gerada = true; aviso('Nota anexada e marcada como emitida.'); if (depois) depois();
  };
  inp.click();
}

      if (card && r.link) { mostrarLinkAcesso(card.nextElementSibling, body.nome, r.link); card.hidden = true; card.closest('form').scrollIntoView({ behavior: 'smooth' }); }
      aviso(r.ja_estava ? 'Já estava na equipe: dados atualizados.' : body.nome.split(' ')[0] + ' adicionada. Agora mande o link pelo WhatsApp.');
    };
  }
}

/* ---------- DRE da empresa (administradores) ---------- */
const CAT_DESP = ['Marketing', 'Ferramentas', 'Contabilidade', 'Pessoal', 'Viagens', 'Taxas e tarifas', 'Escritório', 'Outros'];
async function carregarDRE(L) {
  const el = $('dreBloco'); if (!el) return;
  const y = EM_MES.slice(0, 4), mesModo = FIN_MODO === 'mes', alvo = EM_MES;
  const [cu, dv] = await Promise.all([
    sb.rpc('dre_custos', { p_ini: mesModo ? EM_MES + '-01' : y + '-01-01', p_fim: mesModo ? EM_MES + '-01' : y + '-12-01' }),
    mesModo ? sb.from('despesas').select('*').eq('mes', EM_MES + '-01').order('criado_em', { ascending: false }) : Promise.resolve({ data: [] })
  ]);
  if (ABA !== 'financeiro' || !$('dreBloco') || EM_MES !== alvo) return;
  if (cu.error) { el.innerHTML = '<div class="vazio">O DRE é ativado pelo 27-dre-e-salarios.sql no Supabase.</div>'; return; }
  const C = cu.data || [], tot = (k) => C.reduce((t, r) => t + (+r[k] || 0), 0);
  const rec = soma(L, 'valor_receber'), cus = soma(L, 'custo'), lb = soma(L, 'lucro_bruto'), imp = soma(L, 'imposto'), com = soma(L, 'comissao'), rep = soma(L, 'repasse');
  const margem = lb - imp - com - rep, sal = tot('salarios'), fix = tot('fixas'), avu = tot('avulsas'), res = margem - sal - fix - avu;
  const ln = (t, v, cls) => `<div class="lin ${cls || ''}"><span>${t}</span><span>${v < 0 ? '− ' + brl2(-v) : brl2(v)}</span></div>`;
  const pessoas = mesModo && C[0] ? (C[0].por_pessoa || []) : [];
  let porMes = '';
  if (!mesModo) porMes = `<section class="bloco"><h2>Resultado por mês</h2>${C.map(r => { const k = String(r.mes).slice(0, 7), E = doMes(k); const mg = soma(E, 'lucro_bruto') - soma(E, 'imposto') - soma(E, 'comissao') - soma(E, 'repasse'); const rr = mg - (+r.salarios || 0) - (+r.fixas || 0) - (+r.avulsas || 0); return E.length || +r.salarios || +r.fixas || +r.avulsas ? `<button class="lin" data-mesdre="${k}"><span>${mesNome(k)}</span><span style="color:${rr < 0 ? 'var(--alerta)' : 'var(--verde)'}">${rr < 0 ? '− ' + brl2(-rr) : brl2(rr)}<b class="seta">›</b></span></button>` : ''; }).join('') || '<div class="vazio">Sem movimento no ano.</div>'}</section>`;
  el.innerHTML = `<section class="bloco dre"><h2>DRE ${mesModo ? 'de ' + mesNome(EM_MES).toLowerCase() : 'de ' + y}</h2>
      ${ln('Receita das vendas', rec)}${ln('(−) Custo das emissões', -cus)}${ln('= Lucro bruto', lb, 'sub')}
      ${ln('(−) Imposto', -imp)}${ln('(−) Comissões do time', -com)}${ln('(−) Parceiros', -rep)}${ln('= Margem de contribuição', margem, 'sub')}
      ${ln('(−) Salários fixos', -sal)}${ln('(−) Despesas fixas', -fix)}${ln('(−) Despesas do mês', -avu)}
      <div class="lin forte"><span>= Resultado da empresa</span><span style="color:${res < 0 ? 'var(--alerta)' : 'var(--verde)'}">${res < 0 ? '− ' + brl2(-res) : brl2(res)}</span></div>
      ${rec ? `<div class="sub" style="margin-top:6px">Margem final de ${pct(res / rec * 100)} sobre as vendas.</div>` : ''}
      ${pessoas.length ? `<div class="sub" style="margin-top:8px">Fixos: ${pessoas.map(p => esc(p.nome) + ' ' + brl(p.fixo)).join(' · ')}</div>` : ''}
    </section>
    ${porMes}
    ${mesModo ? `<div class="secao">Despesas do mês <button id="abrirDesp">+ Lançar</button></div>
    <form class="bloco form" id="fDesp" hidden style="margin-top:0">
      <div class="duas-col">${campo('descricao', 'Descrição', '', 'text', 'required placeholder="Ex.: tráfego pago, bônus"')}${campo('valor', 'Valor (R$)', '', 'number', 'required')}</div>
      <label class="fl"><span>Categoria</span><select name="categoria">${CAT_DESP.map(c => `<option>${c}</option>`).join('')}</select></label>
      <button class="zap" type="submit" style="margin-top:8px;width:100%">Lançar em ${mesNome(EM_MES).toLowerCase()}</button>
    </form>
    <div class="bloco" style="margin-top:0">${(dv.data || []).length ? dv.data.map(d => `<div class="lin"><span>${esc(d.descricao)} · ${esc(d.categoria)}</span><span>${brl2(d.valor)} <button class="mini" data-rmdesp="${d.id}">excluir</button></span></div>`).join('') : '<div class="vazio">Nenhuma despesa avulsa neste mês.</div>'}
      <div class="sub">Salários e despesas que se repetem todo mês ficam em <a href="#custos" id="irCustos">Mais > Salários e despesas fixas</a>.</div></div>` : ''}`;
  el.querySelectorAll('[data-mesdre]').forEach(b => b.onclick = () => { FIN_MODO = 'mes'; EM_MES = b.dataset.mesdre; telaFinanceiro($('pagina')); scrollTo(0, 0); });
  if ($('irCustos')) $('irCustos').onclick = (e) => { e.preventDefault(); ir('custos'); };
  if ($('abrirDesp')) $('abrirDesp').onclick = () => { $('fDesp').hidden = !$('fDesp').hidden; };
  if ($('fDesp')) $('fDesp').onsubmit = async (e) => {
    e.preventDefault(); const f = e.target;
    const { error } = await sb.from('despesas').insert({ mes: EM_MES + '-01', descricao: f.elements.descricao.value.trim(), categoria: f.elements.categoria.value, valor: Number(String(f.elements.valor.value).replace(',', '.')) });
    if (error) { aviso('Não salvou: ' + error.message); return; }
    aviso('Despesa lançada.'); carregarDRE(L);
  };
  el.querySelectorAll('[data-rmdesp]').forEach(b => b.onclick = async () => {
    if (CONFIRMA !== 'desp' + b.dataset.rmdesp) { CONFIRMA = 'desp' + b.dataset.rmdesp; b.textContent = 'confirmar'; return; }
    CONFIRMA = null;
    const { error } = await sb.from('despesas').delete().eq('id', b.dataset.rmdesp);
    if (error) { aviso('Não excluiu: ' + error.message); return; }
    aviso('Despesa excluída.'); carregarDRE(L);
  });
}

/* ---------- pagamentos a receber (administradores) ---------- */
let RC_CONF = null;
/* ---------- pagamentos a fornecedores ---------- */
const nNome = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const fornecedoresFichas = () => (D.pessoas || []).filter(p => (p.papeis || []).includes('fornecedor')).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
const fichaFornecedor = (nome) => { const k = nNome(nome); return k ? fornecedoresFichas().find(p => nNome(p.nome) === k) || null : null; };
const devePagar = (e) => (+e.custo || 0) > 0;
// a receber: só o que ainda tem valor para o cliente pagar (cancelamento sem custo e linhas de ajuste não entram)
function aReceberCli(e) { return !e.pago && (+e.valor_receber || 0) > 0.009 && !B2B.ehAjuste(e); }
const aPagar = () => D.emissoes.filter(e => devePagar(e) && !e.pago_fornecedor);
let PG_CONF = null;
function telaPagar(P) {

  P.innerHTML = `<button class="voltar" id="voltar">‹ Empresa</button><h1 class="titulo" style="margin-top:6px">Pagamentos a <em>fornecedores</em></h1>
    <div class="numeros" style="margin-top:10px">
      <div class="num destaque"><div class="l">A pagar</div><div class="v">${brlC(soma(L, 'custo'))}</div><div class="d">${L.length} ${L.length === 1 ? 'venda' : 'vendas'} · ${G.length} ${G.length === 1 ? 'fornecedor' : 'fornecedores'}</div></div>
      <div class="num"><div class="l">A receber</div><div class="v">${brlC(soma(D.emissoes.filter(aReceberCli), 'valor_receber'))}</div><div class="d">dos clientes</div></div>
    </div>
    <div class="sub">O valor a pagar é o custo de cada venda. Pague venda por venda ou tudo de um fornecedor de uma vez.</div>
    ${(R => R.length ? `<details class="bloco" style="margin-top:12px"><summary style="cursor:pointer;color:var(--verde)">Pagos nos últimos 30 dias (${R.length})</summary>${R.map(e => `<div class="lin" style="align-items:center"><span>${esc(e.fornecedor || 'Fornecedor não informado')} · ${esc(e.comprador || e.servico)}${e.localizador ? ' · ' + esc(e.localizador) : ''}<small style="display:block;color:var(--tinta-3)">pago em ${new Date(e.pago_fornecedor_em).toLocaleDateString('pt-BR')}</small></span><span style="white-space:nowrap">${brl2(e.custo)} <button class="sec" data-desf="${e.id}" style="padding:6px 10px;min-width:0;font-size:11px">Desfazer</button></span></div>`).join('')}</details>` : '')(D.emissoes.filter(e => e.pago_fornecedor && e.pago_fornecedor_em && Date.now() - new Date(e.pago_fornecedor_em) < 30 * 864e5).sort((a, b) => String(b.pago_fornecedor_em).localeCompare(String(a.pago_fornecedor_em))))}
    ${G.length ? G.map(([k, g]) => `<section class="bloco"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2 style="margin:0">${g.ficha ? `<button type="button" data-fch="${g.ficha.id}" style="background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer">${esc(g.nome)} ›</button>` : esc(g.nome)}</h2><b style="color:var(--verde)">${brl2(soma(g.L, 'custo'))}</b></div>
      ${g.L.map(e => `<div class="lin" style="align-items:center"><span>${esc(e.comprador || e.produto || e.servico)}${e.localizador ? ' · ' + esc(e.localizador) : ''}<small style="display:block;color:var(--tinta-3)">${dataCurta(dia(e.data_negociacao))}${e.origem && e.destino ? ' · ' + esc(e.origem) + ' → ' + esc(e.destino) : ''} · cliente ${e.pago ? 'já pagou' : 'ainda não pagou'}</small></span><span style="white-space:nowrap">${brl2(e.custo)} <button class="sec" data-pg="${e.id}" style="padding:6px 10px;min-width:0;font-size:11px">Pago</button></span></div>`).join('')}
      ${g.L.length > 1 ? `<button class="zap" type="button" data-pgall="${esc(k)}" style="width:100%;margin-top:10px">Pagar tudo de ${esc(g.nome)}: ${brl2(soma(g.L, 'custo'))}</button>` : ''}</section>`).join('') : '<div class="vazio">Nada a pagar a fornecedores.</div>'}`;
  $('voltar').onclick = () => voltarA('empresa');
  const marcar = async (ids, msg) => {

// check-in do B2B é feito pela agência: o app marca sozinho para não cobrar ninguém (nem no Telegram)
let CK_B2B_FEITO = new Set();
async function marcarCheckinB2B() {
  if (!pode('checkin')) return;
  for (const v of D.voosEm || []) {
    const e = (D.emissoes || []).find(x => x.id === v.id);
    if (!B2B.ehB2B(e)) continue;
    for (const tr of ['ida', 'volta']) {
      const k = v.id + tr;
      if (!v['data_' + tr] || v['checkin_' + tr] || CK_B2B_FEITO.has(k)) continue;
      CK_B2B_FEITO.add(k);
      const { error } = await sb.rpc('marcar_checkin', { p_id: v.id, p_trecho: tr, p_feito: true });
      if (!error) { v['checkin_' + tr] = true; e['checkin_' + tr] = true; }
    }
  }
}

// instante real de saída: data e hora locais do aeroporto de saída, no fuso dele
function instanteVoo(iso, hhmm, tz) {
  const [y, m, d] = iso.split('-').map(Number), [hh, mm] = hhmm.split(':').map(Number), utc = Date.UTC(y, m - 1, d, hh, mm);
  try {
    const s = new Intl.DateTimeFormat('en-US', { timeZone: tz || 'America/Sao_Paulo', timeZoneName: 'longOffset' }).formatToParts(new Date(utc)).find(x => x.type === 'timeZoneName').value;
    const r = s.match(/GMT([+-])(\d{1,2}):?(\d{2})?/), off = r ? (r[1] === '-' ? -1 : 1) * (+r[2] * 60 + (+r[3] || 0)) : 0;
    return utc - off * 6e4;
  } catch (_) {
    try { const loc = new Date(new Date(utc).toLocaleString('en-US', { timeZone: tz || 'America/Sao_Paulo' })), ref = new Date(new Date(utc).toLocaleString('en-US', { timeZone: 'UTC' })); return utc - (loc - ref); } catch (__) { return utc + 3 * 36e5; }
  }
}
/* trechos de voo das emissões (todo o time vê) */
function trechosEm() {
  const T = [];
  D.voosEm.forEach(v => {
    { const em = (D.emissoes || []).find(x => x.id === v.id); if (B2B.ehB2B(em) || B2B.ehCancelada(em, D)) return; }
    // voos registrados um a um (vendas novas): um check-in por voo, com a rota, a data e o horário reais
    const R = ((D.trechos || {})[String(v.id)] || []).slice().sort((a, b) => a.n - b.n);
    if (R.length) {
      R.forEach(r => {
        const d = dia(r.data), k = difDias(d); if (k < -1) return;
        const hr = r.hora ? String(r.hora).slice(0, 5) : '', feito = !!r.checkin;
        let pend = !feito && k >= 0 && k <= 2;
        if (hr) { const ms = instanteVoo(String(r.data).slice(0, 10), hr, r.tz) - Date.now(); pend = !feito && ms > 0 && ms <= 48 * 36e5; }
        T.push({ id: v.id, tr: 't' + r.n, n: r.n, total: R.length, d, hora: hr, feito, pendente: pend, de: r.origem, para: r.destino, v });
      });
      return;
    }
    [['ida', v.data_ida, v.checkin_ida, v.origem, v.destino], ['volta', v.data_volta, v.checkin_volta, v.destino, v.origem]].forEach(([tr, data, feito, de, para]) => {
      if (!data) return;
      const d = dia(data), k = difDias(d);
      if (k < -1) return;
      const H = (D.horas || {})[String(v.id)] || {}, hr = H['hora_' + tr];
      let pend = !feito && k >= 0 && k <= 2;
      if (hr) { const ms = instanteVoo(String(data).slice(0, 10), String(hr).slice(0, 5), H['tz_' + tr]) - Date.now(); pend = !feito && ms > 0 && ms <= 48 * 36e5; }
      T.push({ id: v.id, tr, d, hora: hr ? String(hr).slice(0, 5) : '', feito, pendente: pend, de, para, v });
    });
  });
  return T;
}

async function depoisDaCarteira(c, msg) {

  const pr = await sb.from('programas_milhas').select('*').eq('cliente_id', c.id);
  if (!pr.error) D.progs = D.progs.filter(p => p.cliente_id !== c.id).concat(pr.data || []);
  D.extMes = (D.extMes || []).concat([{ cliente_id: c.id, created_at: agora }]);
  const ec = await sb.from('historico_economia').select('*').eq('cliente_id', c.id).gte('data', new Date().getFullYear() + '-01-01');
  if (!ec.error) D.eco = D.eco.filter(r => r.cliente_id !== c.id).concat(ec.data || []);
  await gtMarcarChave(c, 'carteira');
  FI_FORM = null; aviso(msg); telaFicha($('pagina'), c.id);

      <div class="sub" style="margin-top:4px">Com o valor em dinheiro, a economia entra sozinha no painel do cliente.</div>`,
    transf: `<h2>Transferência entre programas</h2>
      <div class="duas-col">${campo('data', 'Data', hoje, 'date', 'required')}${selG('de', 'De', comSaldo, comSaldo[0][0])}</div>
      ${progIn('para', 'Para')}
      <div class="duas-col">${campo('enviados', 'Pontos enviados', '', 'number', 'required min="1"')}${selG('paridade', 'Paridade', [['1', '1 ponto = 1 milha'], ['2', '2 pontos = 1 milha'], ['3', '3 pontos = 1 milha'], ['0.5', '1 ponto = 2 milhas']], '1')}</div>
      <div class="duas-col">${campo('bonus', 'Bônus da promoção (%)', '0', 'number')}${campo('recebidas', 'Milhas recebidas', '', 'number', 'required min="1"')}</div>

  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const f = $('fCart');
  const pre = tipo === 'uso' ? FI_PRE : null;
  if (pre) { if (pre.data) f.elements.data.value = pre.data; if (pre.quantidade) f.elements.quantidade.value = Math.round(pre.quantidade); if (pre.taxas) f.elements.taxas_brl.value = pre.taxas; if (pre.descricao) f.elements.descricao.value = pre.descricao; $('prevCart').textContent = 'Preenchido a partir da emissão. Confira o programa e informe o valor em dinheiro para calcular a economia.'; }

    const pv = $('prevCart');
    if (tipo === 'entrada') {
      const t = tv(f, 'tipo'); $('wCusto').hidden = t === 'acumulo' || t === 'bonus';

    } else if (tipo === 'uso') {
      const s = estado(tv(f, 'programa')), q = nv(f, 'quantidade'), tx = nv(f, 'taxas_brl') || 0, pag = nv(f, 'valor_pagante_brl');
      if (s && q > 0 && s.custo_medio !== null) { const real = s.custo_medio * q / 1000 + tx; pv.textContent = `Custo real: ${brl2(real)}` + (pag > 0 ? ` · economia: ${brl2(pag - real)}` : ''); } else pv.textContent = '';
    } else if (tipo === 'transf') {
      if (ev && ev.target && ev.target.name === 'recebidas') manual = true;
      else if (ev && ev.target && ['enviados', 'paridade', 'bonus'].includes(ev.target.name)) manual = false;
      const env = nv(f, 'enviados'), par = Number(tv(f, 'paridade') || 1), bon = nv(f, 'bonus') || 0;
      if (!manual && env > 0) f.elements.recebidas.value = Math.round(env / par * (1 + bon / 100));
    }
  };
  f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
  f.onsubmit = async (e) => {
    e.preventDefault();
    const erro = (m) => { $('prevCart').textContent = m; $('prevCart').style.color = 'var(--alerta)'; };
    let linhas = [];
    if (tipo === 'entrada') {
      const t = tv(f, 'tipo'), q = nv(f, 'quantidade'), cu = nv(f, 'custo_brl');
      if (!tv(f, 'programa') || !(q > 0)) return erro('Preencha programa e quantidade.');
      if ((t === 'compra' || t === 'clube') && !(cu > 0)) return erro('Compra e clube precisam do valor pago.');
      linhas = [{ data: tv(f, 'data'), programa: tv(f, 'programa'), tipo: t, quantidade: Math.round(q), custo_brl: t === 'acumulo' || t === 'bonus' ? null : cu, validade: tv(f, 'validade') || null, descricao: tv(f, 'descricao') || null }];
    } else if (tipo === 'uso') {
      const q = nv(f, 'quantidade'), s = estado(tv(f, 'programa'));
      if (!(q > 0) || !tv(f, 'descricao')) return erro('Preencha milhas usadas e descrição.');
      if (!s || q > s.saldo) return erro(`Saldo insuficiente: ${num(s ? s.saldo : 0)}.`);
      linhas = [{ data: tv(f, 'data'), programa: tv(f, 'programa'), tipo: 'emissao', quantidade: -Math.round(q), categoria_uso: tv(f, 'categoria_uso'), taxas_brl: nv(f, 'taxas_brl'), valor_pagante_brl: nv(f, 'valor_pagante_brl'), descricao: tv(f, 'descricao') }];
    } else if (tipo === 'transf') {
      const de = tv(f, 'de'), para = tv(f, 'para'), env = nv(f, 'enviados'), rec = nv(f, 'recebidas'), par = Number(tv(f, 'paridade') || 1), s = estado(de);
      if (!para || !(env > 0) || !(rec > 0)) return erro('Preencha destino, pontos enviados e milhas recebidas.');
      if (CART.normProg(de) === CART.normProg(para)) return erro('Origem e destino precisam ser diferentes.');
      if (!s || env > s.saldo) return erro(`Saldo insuficiente em ${de}: ${num(s ? s.saldo : 0)}.`);
      const grupo = crypto.randomUUID(), d = tv(f, 'descricao');
      linhas = [{ data: tv(f, 'data'), programa: de, tipo: 'transf_saida', quantidade: -Math.round(env), grupo_id: grupo, descricao: `Para ${para}${d ? ' · ' + d : ''}` },
        { data: tv(f, 'data'), programa: para, tipo: 'transf_entrada', quantidade: Math.round(rec), milhas_bonus: Math.max(0, Math.round(rec - env / par)), grupo_id: grupo, validade: tv(f, 'validade') || null, descricao: `De ${de}${d ? ' · ' + d : ''}` }];
    } else if (tipo === 'ajuste') {
      const q = nv(f, 'quantidade'), t = tv(f, 'tipo');
      if (!tv(f, 'programa') || !(q > 0)) return erro('Preencha programa e quantidade.');
      linhas = [{ data: tv(f, 'data'), programa: tv(f, 'programa'), tipo: t === 'expiracao' ? 'expiracao' : 'ajuste', quantidade: t === 'mais' ? Math.round(q) : -Math.round(q), descricao: tv(f, 'descricao') || null }];
    }
    $('salvarCart').disabled = true; $('prevCart').style.color = ''; $('prevCart').textContent = 'Salvando...';
    if (tipo === 'economia') {
      const v = nv(f, 'valor'); if (!(v > 0) || !tv(f, 'descricao')) { $('salvarCart').disabled = false; return erro('Preencha valor e descrição.'); }
      const { error } = await sb.from('historico_economia').insert({ cliente_id: c.id, categoria: tv(f, 'categoria'), data: tv(f, 'data'), descricao: tv(f, 'descricao'), valor_economia_brl: v });
      if (error) { $('salvarCart').disabled = false; return erro('Não salvou: ' + error.message); }
      return depoisDaCarteira(c, 'Ganho lançado. Já aparece no painel do cliente.');
    }
    const { error } = await sb.from('extrato_milhas').insert(linhas.map(x => ({ ...x, cliente_id: c.id })));
    if (error) { $('salvarCart').disabled = false; return erro('Não salvou: ' + error.message); }
    if (pre && pre.emissao_id) { await sb.from('emissoes').update({ carteira_status: 'lancado' }).eq('id', pre.emissao_id); const em = D.emissoes.find(x => x.id === pre.emissao_id); if (em) em.carteira_status = 'lancado'; FI_PRE = null; }
    await depoisDaCarteira(c, 'Salvo. O painel do cliente já mostra a atualização.');
  };
}

/* conferência mensal: digita o saldo de hoje e o app lança a diferença */
function formConferencia(c) {

  const progs = W.programas.filter(p => p.saldo !== 0);
  const extras = c._confExtra || (c._confExtra = []);
  const linha = (nome, atual, i) => `<div class="conf" data-i="${i}">
      <div class="cab"><b>${esc(nome)}</b><small>${atual === null ? 'programa novo' : 'no painel: ' + num(atual)}</small></div>
      <input type="number" inputmode="numeric" min="0" step="1" name="novo" placeholder="${atual === null ? 'saldo de hoje' : 'saldo de hoje (em branco = igual)'}">
      <div class="dif" hidden></div>
      <div class="det" hidden></div></div>`;
  const nomes = [...new Set(W.programas.map(p => p.programa).concat(PROG_PADRAO))];
  box.innerHTML = `<form class="bloco form" id="fConf">
    <h2>Conferência de ${mesNomeCurto(mesKey(new Date()))}</h2>
    <div class="sub" style="margin-top:0">Digite o saldo que aparece hoje em cada programa. O app calcula a diferença e faz os lançamentos sozinho.${primeira ? ' Como é a primeira vez, tudo entra como saldo herdado.' : ''}</div>
    ${campo('data', 'Data da conferência', hojeISO(), 'date', 'required')}
    <div id="confLinhas">${progs.map((p, i) => linha(p.programa, p.saldo, i)).join('')}${extras.map((n, j) => linha(n, null, progs.length + j)).join('')}</div>
    <div class="duas-col" style="align-items:end;margin-top:8px"><label class="fl"><span>Outro programa</span><input id="confNovoProg" list="dlProgC" autocomplete="off" placeholder="Ex.: Smiles"></label><button class="sec" type="button" id="confAdd" style="height:44px">+ Adicionar</button></div>
    <datalist id="dlProgC">${nomes.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="resumoConf" id="confResumo"></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="zap" type="submit" id="salvarConf" style="flex:2">Salvar conferência</button><button class="sec" type="button" id="cancConf" style="flex:1">Cancelar</button></div>
  </form>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const f = $('fConf');
  const lista = () => progs.map(p => ({ nome: p.programa, atual: p.saldo, key: p.key })).concat(extras.map(n => ({ nome: n, atual: null, key: CART.normProg(n) })));
  $('cancConf').onclick = () => { FI_FORM = null; c._confExtra = []; box.innerHTML = ''; };
  $('confAdd').onclick = () => {
    const n = $('confNovoProg').value.trim(); if (!n) return;
    if (lista().some(x => x.key === CART.normProg(n))) { aviso('Esse programa já está na lista.'); return; }
    const vals = [...f.querySelectorAll('.conf [name=novo]')].map(x => x.value);
    extras.push(n); formConferencia(c);
    $('fConf').querySelectorAll('.conf [name=novo]').forEach((x, i) => { if (vals[i] !== undefined) x.value = vals[i]; });
    $('fConf').dispatchEvent(new Event('input'));
  };
  const detalhe = (div, dif, atual) => {
    const d = div.querySelector('.det'), tipoAtual = d.dataset.t;
    if (!dif) { d.hidden = true; d.innerHTML = ''; d.dataset.t = ''; return; }
    const sobe = dif > 0, chave = sobe ? 'sobe' : 'desce';
    if (tipoAtual === chave) return;
    d.dataset.t = chave; d.hidden = false;
    d.innerHTML = sobe
      ? `<select name="tipo">${(primeira || atual === null ? [['saldo_inicial', 'Saldo herdado (já tinha antes)']] : []).concat([['acumulo', 'Acúmulo no cartão ou parceiros'], ['bonus', 'Bônus ou promoção'], ['compra', 'Compra de pontos'], ['clube', 'Clube de pontos']]).map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
         <input type="number" name="custo" placeholder="Valor pago (R$)" hidden step="any" inputmode="decimal">`
      : `<select name="tipo"><option value="emissao">Uso de milhas</option><option value="expiracao">Expiração</option><option value="ajuste">Ajuste para menos</option></select>
         <input name="desc" placeholder="O que foi emitido (ex.: GRU > LIS, 2 pax)">
         <div class="duas-col"><input type="number" name="pagante" placeholder="Valor em dinheiro (R$)" step="any" inputmode="decimal"><input type="number" name="taxas" placeholder="Taxas (R$)" step="any" inputmode="decimal"></div>`;
  };
  const ler = () => lista().map((x, i) => {
    const div = f.querySelector(`.conf[data-i="${i}"]`), v = div.querySelector('[name=novo]').value.trim();
    const novo = v === '' ? null : Math.round(Number(v)), base = x.atual || 0, dif = novo === null ? 0 : novo - base;
    return { ...x, div, novo, dif };
  });
  const upd = () => {
    let sobe = 0, valor = 0, mexidos = 0;
    ler().forEach(r => {
      const el = r.div.querySelector('.dif');
      el.hidden = !r.dif; el.className = 'dif ' + (r.dif < 0 ? 'neg' : '');
      el.textContent = r.dif ? `${r.dif > 0 ? '+' : ''}${num(r.dif)}${refs[r.key] !== undefined ? ' · ' + brl2(r.dif * refs[r.key] / 1000) : ''}` : '';
      detalhe(r.div, r.dif, r.atual);
      const d = r.div.querySelector('.det');
      if (d.dataset.t === 'sobe') { const t = d.querySelector('[name=tipo]').value; d.querySelector('[name=custo]').hidden = !(t === 'compra' || t === 'clube'); }
      if (d.dataset.t === 'desce') { const t = d.querySelector('[name=tipo]').value; d.querySelectorAll('[name=desc],[name=pagante],[name=taxas]').forEach(x => { x.hidden = t !== 'emissao'; }); d.querySelector('.duas-col').hidden = t !== 'emissao'; }
      if (r.novo !== null) mexidos++;
      if (r.dif > 0) { sobe += r.dif; if (refs[r.key] !== undefined) valor += r.dif * refs[r.key] / 1000; }
    });
    $('confResumo').innerHTML = mexidos ? `<b>${plural(mexidos, 'programa conferido', 'programas conferidos')}</b>${sobe ? ` · ${num(sobe)} novos pontos${valor ? ', cerca de ' + brl2(valor) + ' em patrimônio' : ''}` : ''}` : '';
  };
  f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
  f.onsubmit = async (e) => {
    e.preventDefault();
    const data = tv(f, 'data'), R = ler(), linhas = [];
    if (!R.some(r => r.novo !== null)) { aviso('Digite o saldo de pelo menos um programa.'); return; }
    for (const r of R) {
      if (!r.dif) continue;
      const d = r.div.querySelector('.det'), t = d.querySelector('[name=tipo]').value;
      if (r.dif > 0) {
        const custo = d.querySelector('[name=custo]').value.trim() === '' ? null : Number(d.querySelector('[name=custo]').value.replace(',', '.'));
        if ((t === 'compra' || t === 'clube') && !(custo > 0)) { aviso(`${r.nome}: informe o valor pago.`); return; }
        linhas.push({ data, programa: r.nome, tipo: t, quantidade: r.dif, custo_brl: t === 'compra' || t === 'clube' ? custo : null, descricao: 'Conferência mensal' });
      } else if (t === 'emissao') {
        const desc = d.querySelector('[name=desc]').value.trim(), pag = d.querySelector('[name=pagante]').value.trim(), tx = d.querySelector('[name=taxas]').value.trim();
        if (!desc) { aviso(`${r.nome}: descreva o que foi emitido.`); return; }
        linhas.push({ data, programa: r.nome, tipo: 'emissao', quantidade: r.dif, categoria_uso: 'passagem', descricao: desc, valor_pagante_brl: pag ? Number(pag.replace(',', '.')) : null, taxas_brl: tx ? Number(tx.replace(',', '.')) : null });
      } else linhas.push({ data, programa: r.nome, tipo: t, quantidade: r.dif, descricao: 'Conferência mensal' });
    }
    $('salvarConf').disabled = true; $('salvarConf').textContent = 'Salvando...';
    if (linhas.length) {
      const { error } = await sb.from('extrato_milhas').insert(linhas.map(x => ({ ...x, cliente_id: c.id })));
      if (error) { $('salvarConf').disabled = false; $('salvarConf').textContent = 'Salvar conferência'; aviso('Não salvou: ' + error.message); return; }
    }
    const agora = new Date().toISOString();
    const cf = await sb.from('clientes').update({ conferencia_em: agora }).eq('id', c.id);
    if (!cf.error) c.conferencia_em = agora;
    c._confExtra = [];
    await depoisDaCarteira(c, linhas.length ? `Conferência salva: ${plural(linhas.length, 'lançamento feito', 'lançamentos feitos')} e painel atualizado.` : 'Conferência salva: nenhum saldo mudou.');
  };
}

    const ins = await sb.from('documentos').insert({ cliente_id: c.id, titulo: tv(f, 'titulo'), tipo: tv(f, 'tipo'), arquivo_path: path, tamanho_bytes: file.size });
    if (ins.error) { await sb.storage.from('documentos').remove([path]); $('upBtn').disabled = false; $('upBtn').textContent = 'Enviar documento'; aviso('Não salvou: ' + ins.error.message); return; }
    const agora = new Date().toISOString();
    await sb.from('clientes').update({ ultima_atualizacao: agora }).eq('id', c.id).then(({ error: e2 }) => { if (!e2) c.ultima_atualizacao = agora; });

    if (er) { w && w.close(); aviso('Não abriu: ' + er.message); } else if (w) w.location = s.signedUrl;
  });
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    const d = data.find(x => String(x.id) === b.dataset.rm); if (!d) return;
    if (CONFIRMA !== 'doc' + d.id) { CONFIRMA = 'doc' + d.id; b.textContent = 'confirmar'; return; }
    CONFIRMA = null;
    await sb.storage.from('documentos').remove([d.arquivo_path]);
    const { error: er } = await sb.from('documentos').delete().eq('id', d.id);
    if (er) aviso('Não excluiu: ' + er.message); else { aviso('Documento excluído.'); fiDocs(el, c); }
  });
}

const diaHoje = () => new Date().getDate();

  const t = th.map(x => { const dv = diasPara(x.prazo); return `<article class="card" style="margin-bottom:8px">
      <div class="cab"><div><div class="nome">${esc(nomeCli(x.cliente_id))}</div><span class="tag ${dv < 0 ? 'alerta' : 'ouro'}">${dv < 0 ? 'atrasada desde ' + dataCurta(dia(x.prazo)) : 'para hoje'}</span>${x.grupo === 'cliente' ? ' <span class="tag">cobrar do cliente</span>' : ''}</div></div>

async function gtMarcar(id, feito) {

function textoPreOnboard(c, modelo) {
  const nome = String(c.nome_completo || '').split(' ')[0] || 'tudo bem';
  const quando = c.onboard_data ? new Date(c.onboard_data).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }) + ', às ' + new Date(c.onboard_data).toTimeString().slice(0, 5) : '';

/* calendário do mês: voos, viagens, reuniões, vencimentos e aniversários; toque no dia abre tudo detalhado */
let AG_MODO = 'cal', AG_CMES = mesKey(new Date()), AG_DIA = null;
function agCalendario() {
  const k = AG_CMES, [y, mm] = k.split('-').map(Number);
  const prim = (new Date(y, mm - 1, 1).getDay() + 6) % 7, dias = new Date(y, mm, 0).getDate(), hj = isoLocal(new Date());
  const doMes = eventos(true).filter(e => isoLocal(e.d).slice(0, 7) === k);
  if (!AG_DIA && hj.slice(0, 7) === k) AG_DIA = hj;
  if (AG_DIA && AG_DIA.slice(0, 7) !== k) AG_DIA = null;
  const chip = (e, iso) => `<span class="ag-chip ${e.ic || ''} ${e.alerta ? 'alerta' : ''} ${iso < hj ? 'passado' : ''}">${e.hora ? `<span class="hr">${esc(e.hora)} </span>` : ''}${esc(e.t)}</span>`;
  let cel = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'].map(d => `<div class="h">${d}</div>`).join('');
  for (let i = 0; i < prim; i++) cel += '<div class="d fora"></div>';
  for (let d = 1; d <= dias; d++) {
    const iso = `${k}-${String(d).padStart(2, '0')}`, L = doMes.filter(e => isoLocal(e.d) === iso);
    cel += `<div class="d ${iso === hj ? 'hj' : ''} ${iso === AG_DIA ? 'sel' : ''}" data-dia="${iso}"><span class="n">${d}</span>${L.slice(0, 4).map(e => chip(e, iso)).join('')}${L.length > 4 ? `<span class="ag-mais">+${L.length - 4}</span>` : ''}</div>`;
  }
  const resto = (prim + dias) % 7; if (resto) for (let i = resto; i < 7; i++) cel += '<div class="d fora"></div>';
  const doDia = AG_DIA ? doMes.filter(e => isoLocal(e.d) === AG_DIA) : [];
  const tipos = [['voo', 'Voos'], ['reuniao', 'Reuniões'], ['viagem', 'Início de viagem'], ['milhas', 'Vencimentos'], ['aniv', 'Aniversários e documentos']].filter(([t]) => t !== 'milhas' || pode('gestao'));
  return `<div class="mesnav" id="agCMes" style="margin-top:12px"><button data-n="-1" aria-label="Mês anterior">‹</button><span>${mesNome(k)}</span><button data-n="1" aria-label="Próximo mês">›</button></div>
    <div class="ag-cm">${cel}</div>
    <div class="ag-leg">${tipos.map(([t, n]) => `<span><i class="ag-chip ${t}" style="display:inline-block;width:10px;padding:0"></i>${n}</span>`).join('')}<span>Faixa vermelha: precisa de ação</span></div>
    <div class="sub">Toque no dia para ver tudo detalhado.</div>
    <div id="agDiaLista">${AG_DIA ? `<div class="secao">${new Date(AG_DIA + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })} · ${doDia.length} ${doDia.length === 1 ? 'item' : 'itens'}</div>${doDia.length ? doDia.map(htmlEvento).join('') : '<div class="vazio">Nada neste dia.</div>'}` : ''}</div>`;
}

  try {
    const { data, error } = await sb.functions.invoke('metricas-site', { body: { dias: SITE_DIAS } });
    SITE = error || !data || !data.ok ? { ok: false, erro: (error && error.message) || (data && data.erro) || '', dias: SITE_DIAS } : { ...data, dias: SITE_DIAS };
  } catch (e) { SITE = { ok: false, erro: String(e), dias: SITE_DIAS }; }
  return SITE;
}

      <form id="fGoogle" class="form" style="margin-top:6px">${campo('link', 'Link de avaliação', D.cfg && D.cfg.link_avaliacao_google, 'url', 'placeholder="https://g.page/r/..."')}<button class="sec" type="submit" style="margin-top:8px;width:100%">Salvar link</button></form>
      <div class="sub">${D.posViagem.filter(x => x.situacao === 'pedido').length} pedidos feitos desde o início.</div></section>` : ''; }
function ligarAvalGoogle() {
  if ($('fGoogle')) $('fGoogle').onsubmit = async (ev) => {
    ev.preventDefault(); const v = ev.target.elements.link.value.trim();
    if (v && !/^https:\/\//.test(v)) { aviso('O link precisa começar com https://'); return; }
    const { error } = await sb.from('configuracoes').update({ link_avaliacao_google: v || null }).eq('id', 1);
    if (error) { aviso('Não salvou: ' + error.message); return; }
    D.cfg = { ...(D.cfg || {}), link_avaliacao_google: v || null }; aviso('Link salvo.');
  };
}

  ligarAvalGoogle(); ligarAvg(P, () => telaSite(P));
  $('sdias').onclick = (e) => { const b = e.target.closest('button'); if (b) { SITE_DIAS = +b.dataset.d; telaSite(P); } };
  const [, cl] = await Promise.all([carregarSite(), sb.from('clarity_dias').select('*').order('dia', { ascending: false }).limit(90)]);
  const el = $('sconteudo'); if (!el || ABA !== 'site') return;

  const ga = SITE.ga, sc = SITE.sc;
  el.innerHTML = `
    <div class="secao">Visitas (Google Analytics)</div>
    <div class="numeros">
      <div class="num destaque"><div class="l">Visitas</div><div class="v">${num(ga.sessoes)}</div><div class="d">${num(ga.usuarios)} pessoas</div></div>
      <div class="num"><div class="l">Cliques no WhatsApp</div><div class="v">${num(ga.whatsapp)}</div></div>
      <div class="num"><div class="l">Formulários</div><div class="v">${num(ga.formularios)}</div></div>
      <div class="num"><div class="l">Taxa de contato</div><div class="v">${ga.sessoes ? ((ga.whatsapp + ga.formularios) / ga.sessoes * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) : 0}%</div><div class="d">contatos sobre visitas</div></div>
    </div>
    <section class="bloco"><h2>Páginas mais vistas</h2>${barras((ga.paginas || []).map(p => [semDado(p.pagina), p.visitas]))}</section>
    <section class="bloco"><h2>De onde vêm as visitas</h2>${barras((ga.origens || []).map(o => [semDado(o.origem), o.visitas]), 'ouro')}${(ga.origens || []).some(o => /not set|not provided/i.test(o.origem || '')) ? '<div class="sub">Não identificado: o Google não conseguiu saber de onde a pessoa veio (link copiado e colado, aplicativo de mensagem que esconde a origem ou visita muito curta).</div>' : ''}</section>
    <div class="secao">Busca no Google (Search Console)</div>
    <div class="numeros">
      <div class="num destaque"><div class="l">Cliques</div><div class="v">${num(sc.cliques)}</div></div>
      <div class="num"><div class="l">Aparições</div><div class="v">${num(sc.impressoes)}</div></div>
      <div class="num"><div class="l">Taxa de clique</div><div class="v">${(sc.ctr * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%</div></div>
      <div class="num"><div class="l">Posição média</div><div class="v">${Number(sc.posicao || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}</div></div>
    </div>
    <section class="bloco"><h2>O que as pessoas buscaram</h2>${(sc.consultas || []).length ? sc.consultas.map(q => `<div class="lin"><span>${esc(q.termo)}</span><span>${num(q.cliques)} cliques · ${num(q.impressoes)} aparições</span></div>`).join('') : '<div class="vazio">Sem buscas registradas no período.</div>'}</section>
    <div class="sub" style="margin-top:10px">Dados do Search Console chegam com cerca de 2 dias de atraso.</div>` + blClarity;
}

/* comportamento das visitas (Microsoft Clarity): retratos diários guardados pelo banco */
function htmlClarity(dias) {
  const cab = '<div class="secao">Comportamento das visitas (Clarity) <a href="https://clarity.microsoft.com/projects/view/ypnuw0ek2m/dashboard" target="_blank" rel="noopener">Abrir ›</a></div>';
  if (dias === null) return cab + '<div class="vazio">O Clarity no app é ativado pelo 13-clarity.sql.</div>';
  const periodo = dias.filter(d => difDias(dia(d.dia)) > -SITE_DIAS);
  if (!periodo.length) return cab + '<div class="vazio">Ainda sem dados. O app busca os números do Clarity 3 vezes por dia (9h, 15h e 21h).</div>';
  const n = (v) => Number(String(v ?? '').replace(',', '.')) || 0;
  const met = (d, nome) => { const m = ((d.dados || {}).geral || []).find(x => String(x.metricName).toLowerCase() === nome.toLowerCase()); return m ? (m.information || []) : []; };
  const pri = (d, nome) => met(d, nome)[0] || {};
  let sess = 0, bots = 0, usu = 0, pps = 0, rol = 0, tTot = 0, tAt = 0, sRol = 0, sT = 0, mortos = 0, raiva = 0, rolEx = 0, volta = 0, k = 0;
  const pags = {}, disp = {};
  periodo.forEach(d => {
    const t = pri(d, 'Traffic'), s1 = n(t.totalSessionCount);
    sess += s1; bots += n(t.totalBotSessionCount); usu += n(t.distantUserCount); pps += n(t.PagesPerSessionPercentage) * s1;
    if (met(d, 'Scroll Depth').length) { rol += n(pri(d, 'Scroll Depth').averageScrollDepth) * s1; sRol += s1; }
    const e = pri(d, 'Engagement Time'); if (met(d, 'Engagement Time').length) { tTot += n(e.totalTime) * s1; tAt += n(e.activeTime) * s1; sT += s1; }
    mortos += n(pri(d, 'Dead Click Count').sessionsCount); raiva += n(pri(d, 'Rage Click Count').sessionsCount);
    rolEx += n(pri(d, 'Excessive Scroll').sessionsCount); volta += n(pri(d, 'Quickback Click').sessionsCount);
    met(d, 'Popular Pages').forEach(p => { const u = String(p.url || '').replace(/^https?:\/\/(www\.)?maktubgo\.com\.br/, '') || '/'; pags[u] = (pags[u] || 0) + n(p.visitsCount); });
    (((d.dados || {}).dispositivos || []).find(x => x.metricName === 'Traffic') || { information: [] }).information.forEach(x => { disp[x.Device || 'Outro'] = (disp[x.Device || 'Outro'] || 0) + n(x.totalSessionCount); });
    k++;
  });
  const media = (v) => sess ? v / sess : 0;
  const seg = (x) => { x = Math.round(x); return x >= 60 ? Math.floor(x / 60) + ' min ' + (x % 60 ? (x % 60) + ' s' : '') : x + ' s'; };
  const pc = (x) => sess ? (x / sess * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%' : '0%';
  const DISP = { PC: 'Computador', Mobile: 'Celular', Tablet: 'Tablet', Other: 'Outro' };
  return cab + `<div class="sub" style="margin-top:-4px">${k} dia${k === 1 ? '' : 's'} com dados no período · atualizado ${quando(periodo[0].atualizado_em)}</div>
    <div class="numeros" style="margin-top:8px">
      <div class="num destaque"><div class="l">Sessões</div><div class="v">${num(sess)}</div><div class="d">${num(bots)} de robôs excluídas</div></div>
      <div class="num"><div class="l">Páginas por sessão</div><div class="v">${media(pps).toLocaleString('pt-BR', { maximumFractionDigits: 2 })}</div></div>
      <div class="num"><div class="l">Rolagem média</div><div class="v">${(sRol ? rol / sRol : 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%</div><div class="d">da página vista</div></div>
      <div class="num"><div class="l">Tempo ativo</div><div class="v">${seg(sT ? tAt / sT : 0)}</div><div class="d">de ${seg(sT ? tTot / sT : 0)} no total</div></div>
    </div>
    <section class="bloco"><h2>Sinais de frustração</h2>
      <div class="lin"><span>Cliques mortos (clicou e nada aconteceu)</span><span>${pc(mortos)}</span></div>
      <div class="lin"><span>Cliques de raiva (vários cliques seguidos)</span><span>${pc(raiva)}</span></div>
      <div class="lin"><span>Rolagem excessiva (procurando algo)</span><span>${pc(rolEx)}</span></div>
      <div class="lin"><span>Voltou rápido para a página anterior</span><span>${pc(volta)}</span></div>
      <div class="sub">Porcentagem das sessões. As gravações dessas visitas ficam no Clarity.</div></section>
    ${Object.keys(disp).length ? `<section class="bloco"><h2>Aparelho</h2>${barras(Object.entries(disp).sort((a, b) => b[1] - a[1]).map(([kk, v]) => [DISP[kk] || kk, v]), 'ouro')}</section>` : ''}
    ${Object.keys(pags).length ? `<section class="bloco"><h2>Páginas mais visitadas (Clarity)</h2>${barras(Object.entries(pags).sort((a, b) => b[1] - a[1]).slice(0, 8))}</section>` : ''}`;
}
/* Kanban:
   - deslizar o funil para o lado passa de etapa em etapa (no celular, rolagem nativa; no computador, arrastando com o mouse);
   - arrastar um card até outra coluna muda a etapa dele. No celular, segura o card um instante e arrasta;
     no computador, clica no card e arrasta. */
(() => {
  let kb = null, x0 = 0, y0 = 0, s0 = 0, i0 = 0, moveu = false, tipo = '';
  let card = null, segura = null, fant = null, dx0 = 0, dy0 = 0, alvo = null, rolar = 0, px = 0, py = 0;
  const colAtual = k => {
    const base = k.getBoundingClientRect().left + 16; let i = 0, d = Infinity;
    [...k.children].forEach((c, j) => { const dd = Math.abs(c.getBoundingClientRect().left - base); if (dd < d) { d = dd; i = j; } });
    return i;
  };
  const irPara = (k, i) => {
    const cols = k.children; i = Math.max(0, Math.min(cols.length - 1, i));
    const a = cols[i]; if (!a) return;
    k.scrollTo({ left: k.scrollLeft + a.getBoundingClientRect().left - k.getBoundingClientRect().left - 16, behavior: 'smooth' });
  };
  const bloquearClique = () => {
    const bloq = ev => { ev.stopPropagation(); ev.preventDefault(); };
    window.addEventListener('click', bloq, { capture: true, once: true });
    setTimeout(() => window.removeEventListener('click', bloq, { capture: true }), 60);
  };
  const pegarCard = () => {
    clearTimeout(segura); segura = null;
    const r = card.getBoundingClientRect();
    dx0 = px - r.left; dy0 = py - r.top;
    fant = card.cloneNode(true); fant.classList.add('kfant'); fant.style.width = r.width + 'px';
    document.body.appendChild(fant); card.classList.add('levando'); kb.classList.add('arrastando');
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {}
    moverFant();
    const passo = () => { if (!fant) return; if (rolar) kb.scrollLeft += rolar; marcarAlvo(); requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  };
  const moverFant = () => { if (fant) { fant.style.left = (px - dx0) + 'px'; fant.style.top = (py - dy0) + 'px'; } };
  const marcarAlvo = () => {
    const el = document.elementFromPoint(px, py), c = el && el.closest('.kcol[data-ket]');
    const novo = c && kb.contains(c) ? c : null;
    if (novo !== alvo) { if (alvo) alvo.classList.remove('alvo'); alvo = novo; if (alvo) alvo.classList.add('alvo'); }
    const r = kb.getBoundingClientRect(), borda = 48;
    rolar = px < r.left + borda ? -12 : px > r.right - borda ? 12 : 0;
  };
  const limparCard = () => {
    clearTimeout(segura); segura = null;
    if (fant) fant.remove(); fant = null;
    if (card) card.classList.remove('levando');
    if (alvo) alvo.classList.remove('alvo');
    card = null; alvo = null; rolar = 0;
  };
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const k = e.target.closest('.kanban'); if (!k) return;
    if (e.target.closest('input,select,textarea')) return;
    kb = k; x0 = px = e.clientX; y0 = py = e.clientY; s0 = k.scrollLeft; i0 = colAtual(k); moveu = false; tipo = e.pointerType;
    card = e.target.closest('.kc[data-kid]');
    if (card && tipo !== 'mouse') segura = setTimeout(pegarCard, 380);
  });
  document.addEventListener('pointermove', e => {
    if (!kb) return;
    px = e.clientX; py = e.clientY;
    if (fant) { moverFant(); e.preventDefault(); return; }
    const dx = px - x0, dy = py - y0;
    if (!moveu && Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (segura) { clearTimeout(segura); segura = null; card = null; }
    // no celular o deslizar para o lado é a rolagem nativa do aparelho (mais fluida); o app só cuida do mouse
    if (tipo !== 'mouse') { kb = null; card = null; return; }
    if (card && tipo === 'mouse') { moveu = true; pegarCard(); e.preventDefault(); return; }
    if (!moveu && Math.abs(dx) < 8) return;
    if (!moveu) { moveu = true; kb.classList.add('arrastando'); }
    kb.scrollLeft = s0 - dx;
    if (tipo === 'mouse') e.preventDefault();
  }, { passive: false });
  // enquanto leva um card no celular, a página não rola
  document.addEventListener('touchmove', e => {
    if (!fant) return;
    e.preventDefault();
    const t = e.touches[0]; if (t) { px = t.clientX; py = t.clientY; moverFant(); }
  }, { passive: false });
  document.addEventListener('contextmenu', e => { if (fant || segura) e.preventDefault(); });
  const fim = e => {
    if (!kb) return;
    const k = kb; kb = null;
    if (fant) {
      const id = card.dataset.kid, et = alvo && alvo.dataset.ket, origem = card.closest('.kcol');
      k.classList.remove('arrastando'); limparCard(); bloquearClique();
      if (e.type === 'pointerup' && et && origem && origem.dataset.ket !== et) (k.dataset.mk ? MKT.mover(id, et) : moverEtapa(id, et));
      return;
    }
    limparCard();
    if (!moveu) return;
    k.classList.remove('arrastando');
    const dx = e.type === 'pointerup' ? e.clientX - x0 : 0;
    irPara(k, Math.abs(dx) > 40 ? i0 + (dx < 0 ? 1 : -1) : colAtual(k));
    bloquearClique();
  };
  document.addEventListener('pointerup', fim);
  document.addEventListener('pointercancel', fim);
})();
</script>
