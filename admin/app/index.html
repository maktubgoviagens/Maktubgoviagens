<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a3826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maktub Op">
<title>Operação | Maktub Go</title>
<link rel="manifest" href="/admin/app/manifest.webmanifest">
<link rel="icon" href="/ativos/app-icon-192.png">
<link rel="apple-touch-icon" href="/ativos/app-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1a3826;--verde-2:#234832;--dourado:#8a6520;--dourado-claro:#c9a96e;
  --creme:#f9f6f1;--creme-2:#f2ece1;--branco:#fff;
  --tinta:#2b2b26;--tinta-2:#5c5c55;--tinta-3:#86867c;
  --linha:rgba(26,56,38,.12);
  --alerta:#a0561f;--ok:#2f6b4a;
  --barra-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--creme);color:var(--tinta);font-family:'Jost',-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5}
a{color:inherit}
button,select,textarea,input{font-family:inherit;font-size:15px;color:inherit}

/* topo */
.topo{position:sticky;top:0;z-index:30;background:var(--verde);color:var(--creme);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.topo img{width:26px}
.topo .n{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;line-height:1.2}
.topo .s{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dourado-claro)}
.topo .acoes{margin-left:auto;display:flex;gap:6px}
.icone{background:none;border:1px solid rgba(201,169,110,.35);color:var(--creme);width:38px;height:38px;display:grid;place-items:center;cursor:pointer;text-decoration:none}
.icone svg{width:18px;height:18px}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--branco);border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;height:var(--barra-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;letter-spacing:.06em;color:var(--tinta-3);cursor:pointer;position:relative}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--verde);font-weight:600}
.nav button.on::before{content:'';position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--dourado)}
.nav .bola{position:absolute;top:9px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--alerta);color:#fff;font-size:10px;line-height:17px;text-align:center;padding:0 4px;font-weight:600}

.pagina{max-width:760px;margin:0 auto;padding:18px 16px calc(var(--barra-h) + 36px + env(safe-area-inset-bottom))}
body.com-fab .pagina{padding-bottom:calc(var(--barra-h) + 100px + env(safe-area-inset-bottom))}
.titulo{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;color:var(--verde);line-height:1.1}
.titulo em{color:var(--dourado)}
.sub{font-size:12.5px;color:var(--tinta-3);margin-top:4px}
.secao{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dourado);font-weight:600;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
.secao a,.secao button{font-size:11px;letter-spacing:.06em;text-transform:none;color:var(--tinta-2);background:none;border:0;cursor:pointer;font-weight:400}

/* números */
.numeros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{background:var(--branco);border:1px solid var(--linha);padding:14px 14px 12px}
.num .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-2);font-weight:500}
.num .v{white-space:nowrap;font-family:'Cormorant Garamond',serif;font-size:clamp(25px,7.2vw,32px);color:var(--verde);line-height:1.05;margin-top:4px;font-variant-numeric:lining-nums}
.num .d{font-size:12px;color:var(--tinta-3)}
.num.destaque{border-left:3px solid var(--dourado)}
.num.alerta .v{color:var(--alerta)}

/* lista de pendências */
.pend{background:var(--branco);border:1px solid var(--linha)}
.pend button{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--linha);padding:13px 14px;cursor:pointer;font-size:14.5px}
.pend button:first-child{border-top:0}
.pend b{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;color:var(--tinta-3);line-height:1;min-width:24px;text-align:right}
.pend b.tem{color:var(--alerta)}
.pend .seta{color:var(--tinta-3);margin-left:10px}

/* blocos */
.bloco{background:var(--branco);border:1px solid var(--linha);padding:16px;margin-top:10px}
.bloco h2{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dourado);font-weight:600;margin-bottom:12px}
.barra{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:10px;padding:5px 0}
.barra .r{font-size:13px;color:var(--tinta-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .t{height:14px;background:var(--creme-2);position:relative}
.barra .t i{position:absolute;inset:0 auto 0 0;background:var(--verde);border-radius:0 4px 4px 0;min-width:2px}
.barra .t i.ouro{background:var(--dourado)}
.barra .q{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.vazio{color:var(--tinta-3);font-size:13.5px;padding:10px 0}

/* chips / abas internas */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fotosG{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -2px 10px;scrollbar-width:none}.fotosG::-webkit-scrollbar{display:none}.fotosG:empty{display:none}.fotosG figure{margin:0;flex:0 0 82%;scroll-snap-align:start}.fotosG img{width:100%;height:190px;object-fit:cover;display:block;background:var(--linha)}.fotosG figcaption{font-size:11px;color:var(--tinta-3);margin-top:3px}.fotosG figcaption a{color:inherit}
.chips button{white-space:nowrap;background:var(--branco);border:1px solid var(--linha);padding:8px 13px;font-size:12.5px;cursor:pointer;color:var(--tinta-2);border-radius:20px}
.chips button.on{border-color:var(--verde);background:var(--verde);color:var(--creme)}
.seg{display:flex;border:1px solid var(--linha);background:var(--branco);margin:14px 0 4px}
.seg button{flex:1;background:none;border:0;padding:10px 4px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--tinta-2)}
.seg button.on{background:var(--verde);color:var(--creme)}
.busca{width:100%;padding:12px 14px;border:1px solid var(--linha);background:var(--branco);font-size:16px;margin-top:14px}

/* cartões */
.lista{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.card{background:var(--branco);border:1px solid var(--linha);padding:14px}
.card.novo{border-left:3px solid var(--alerta)}
.card .cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .nome{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--verde);line-height:1.15}
.card .quando{font-size:12px;color:var(--tinta-3);white-space:nowrap}
.tag{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--linha);color:var(--tinta-2);margin-top:4px}
.tag.ouro{border-color:rgba(138,101,32,.4);color:var(--dourado)}
.tag.ok{border-color:rgba(27,67,50,.35);color:var(--verde);background:rgba(27,67,50,.06)}
.ciclo{display:block;width:100%;text-align:left;background:var(--branco);border:1px solid var(--linha);border-left:3px solid var(--dourado);padding:14px;margin-top:14px;cursor:pointer;font:inherit;color:inherit}
.ciclo .top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--verde)}
.ciclo .top b{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500}
.ciclo small{display:block;margin-top:8px;font-size:12.5px;color:var(--tinta-3);line-height:1.45}
.fseg{overflow-x:auto;scrollbar-width:none}.fseg::-webkit-scrollbar{display:none}.fseg button{font-size:10px;letter-spacing:.02em;padding:11px 5px;flex:1 0 auto;white-space:nowrap}
.botoes4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.botoes4 .zap,.botoes4 .sec{min-width:0;padding:12px 6px;font-size:11px}
.lanc{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--linha);font-size:14px}
.lanc:first-child{border-top:0}
.lanc b{font-weight:600;color:var(--verde)}
.lanc small{display:block;color:var(--tinta-3);font-size:12px;margin-top:2px}
.lanc .q{text-align:right;white-space:nowrap;color:var(--verde);font-weight:600}
.lanc .q.neg{color:var(--alerta)}
.lanc .mini{display:block;margin:4px 0 0 auto}
.conf{border-top:1px solid var(--linha);padding:12px 0}
.conf:first-child{border-top:0}
.conf .cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.conf .cab b{font-weight:600;color:var(--verde);font-size:15px}
.conf .cab small{color:var(--tinta-3);font-size:12.5px}
.conf input,.conf select{width:100%;padding:11px;border:1px solid var(--linha);background:var(--creme);font-size:16px;margin-top:6px;border-radius:0}
.conf .dif{margin-top:6px;font-weight:600;color:var(--verde);font-size:14px}
.conf .dif.neg{color:var(--alerta)}
.resumoConf{margin-top:12px;font-size:14px;color:var(--tinta-2)}
.dre .lin.sub{font-weight:600;color:var(--verde)}
.mapa{height:340px;margin-top:12px;border:1px solid var(--linha);background:#dde5e8;z-index:0}
.mapa .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.6)}
.mapa .leaflet-tooltip{font-family:inherit;font-size:12.5px}
.rank .rk{padding:7px 0}
.rank .rt{display:flex;gap:10px;align-items:baseline}
.rank .rt span{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--dourado);min-width:14px}
.rank .rt b{flex:1;font-weight:400;font-size:14.5px;color:var(--tinta)}
.rank .rt em{font-style:normal;font-weight:600;font-size:14px;color:var(--verde);white-space:nowrap}
.rank .rb{height:5px;background:var(--linha);margin:5px 0 0 24px}
.rank .rb i{display:block;height:100%;background:var(--verde)}
.rank .rb i.ouro{background:var(--dourado)}
.meses{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:130px;align-items:end}
.meses div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.meses i{display:block;width:70%;background:var(--verde);opacity:.85}
.meses b{font-size:11px;font-weight:600;color:var(--verde);margin-top:3px;min-height:14px}
.meses span{font-size:10.5px;color:var(--tinta-3);text-transform:uppercase;letter-spacing:.05em}
.perms{display:grid;gap:6px;margin-top:4px}
.perm{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--linha);background:var(--branco);cursor:pointer}
.perm input{flex:none;margin-top:3px;width:18px;height:18px;accent-color:var(--verde)}
.perm b{display:block;font-weight:600;font-size:14px;color:var(--verde)}
.perm small{display:block;font-size:12px;color:var(--tinta-3)}
.perm.off{opacity:.55;cursor:default;padding-left:38px;margin-top:6px}
.pgrupo{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta-3);font-weight:600;margin:10px 0 0}
.pgrupo:first-child{margin-top:2px}
.tag.alerta{border-color:rgba(160,86,31,.45);color:var(--alerta)}
.info{margin-top:10px;display:grid;gap:3px;font-size:14px}
.info span{color:var(--tinta-3)}
.card .acoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.zap{flex:1;min-width:130px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--verde);color:var(--creme);text-decoration:none;padding:11px 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:0;cursor:pointer}
.zap svg{width:16px;height:16px;fill:currentColor}
.sec{display:flex;align-items:center;justify-content:center;border:1px solid var(--linha);background:var(--branco);padding:10px 14px;text-decoration:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2);cursor:pointer}
.card select{flex:1;min-width:150px;padding:10px;border:1px solid var(--linha);background:var(--creme);border-radius:0}
.obs{margin-top:10px}
.obs summary{font-size:12.5px;color:var(--dourado);cursor:pointer}
.obs textarea{width:100%;margin-top:8px;min-height:76px;border:1px solid var(--linha);padding:10px;background:var(--creme);resize:vertical;font-size:16px}
.obs button{margin-top:6px;background:var(--verde);color:var(--creme);border:0;padding:9px 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.obs .salvo{font-size:12px;color:var(--tinta-3);margin-left:8px}

/* clientes */
.cli{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--branco);border:1px solid var(--linha);padding:14px;cursor:pointer}
.cli .nome{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--verde);line-height:1.15}
.cli .meta{font-size:12.5px;color:var(--tinta-3);margin-top:2px}
.cli .val{text-align:right;flex-shrink:0}
.cli .val b{display:block;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--verde)}
.cli .val span{font-size:11.5px;color:var(--tinta-3)}
.prog{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--linha)}
.prog:first-of-type{border-top:0}
.prog .p{font-size:15px;color:var(--verde)}
.prog .s{font-size:12.5px;color:var(--tinta-3)}
.prog .v{text-align:right;font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--verde)}
.prog .venc{grid-column:1/-1;font-size:12px;color:var(--alerta)}
.voltar{background:none;border:0;color:var(--tinta-2);font-size:13px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px}

/* agenda */
.dia{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-2);font-weight:600;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.dia::after{content:'';flex:1;height:1px;background:var(--linha)}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;background:var(--branco);border:1px solid var(--linha);padding:12px 12px 12px 10px;margin-bottom:6px;text-decoration:none}
.ev .h{font-variant-numeric:tabular-nums;font-size:13px;color:var(--tinta-2);text-align:center;padding-top:2px}
.ev .h svg{width:18px;height:18px;display:block;margin:0 auto 3px;color:var(--dourado)}
.ev .t{font-size:15px;color:var(--verde);line-height:1.3}
.ev .d{font-size:12.5px;color:var(--tinta-3);margin-top:2px}
.ev.alerta{border-left:3px solid var(--alerta)}

/* site */
.lin{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--linha);font-size:14px}
.lin:first-of-type{border-top:0}
.lin span:last-child{color:var(--tinta-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.config{background:var(--creme-2);border-left:3px solid var(--dourado);padding:14px;font-size:14px;color:var(--tinta-2)}
.config b{color:var(--verde)}

/* portão, aviso */
.portao{min-height:80vh;display:grid;place-items:center;text-align:center;padding:24px}
.portao h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;color:var(--verde);margin:12px 0 8px}
.portao p{color:var(--tinta-2);margin-bottom:16px}
.btn{display:inline-block;background:var(--verde);color:var(--creme);text-decoration:none;padding:12px 18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.aviso{position:fixed;left:50%;bottom:calc(var(--barra-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--verde);color:var(--creme);padding:11px 18px;font-size:13px;z-index:50;max-width:90vw;text-align:center}
.carregando{opacity:.55;pointer-events:none}

/* operação */
.zap.grande,.sec.grande{width:100%;padding:14px;font-size:12.5px}
.mesnav{display:flex;align-items:center;justify-content:space-between;background:var(--branco);border:1px solid var(--linha);margin-top:12px}
.mesnav button{background:none;border:0;width:48px;height:44px;font-size:22px;color:var(--verde);cursor:pointer}
.mesnav span{font-size:14px;color:var(--verde);font-weight:500}
.mesnav .tag{font-style:normal;margin:0 0 0 6px}
button.card.em{text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.form .grupo{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dourado);font-weight:600;margin:20px 0 6px}
.fl{display:block;margin-top:10px}
.fl span{display:block;font-size:12px;color:var(--tinta-2);margin-bottom:4px}
.fl input,.fl select,.fl textarea{width:100%;padding:11px 12px;border:1px solid var(--linha);background:var(--branco);font-size:16px;border-radius:0}
.fl input:disabled,.fl select:disabled{background:var(--creme-2);color:var(--tinta-3)}
.duas-col{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.duas-col>*{min-width:0}
.fl input{min-width:0;max-width:100%}
.fl input[type=month],.fl input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left}
.fl input::-webkit-date-and-time-value{text-align:left}
.fxlin small{display:block;font-size:12px;color:var(--tinta-3);margin-top:2px}
.fxlin{align-items:flex-start;text-align:left}
.fxed{padding:6px 0 12px;border-bottom:1px solid var(--linha)}
.caixas{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.fc{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px;cursor:pointer}
.fc input{width:20px;height:20px;accent-color:var(--verde)}
.toque{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dourado);margin-top:6px}
.ajuste{background:var(--branco);border:1px solid rgba(138,101,32,.45);padding:4px 14px 14px;margin-top:14px}
.ajuste .grupo{margin-top:12px}
.fl small{display:block;font-size:11.5px;color:var(--tinta-3);margin-top:4px}
button.lin{width:100%;background:none;border:0;border-top:1px solid var(--linha);font:inherit;color:inherit;cursor:pointer;text-align:left}
button.lin:first-of-type{border-top:0}
button.lin .seta{color:var(--dourado);margin-left:6px}
.icone{position:relative}
.card.em{margin-bottom:0}
.emchk{display:flex;flex-wrap:wrap;gap:6px;margin:-1px 0 12px;background:var(--branco);border:1px solid var(--linha);border-top:0;padding:8px}
.emchk button{flex:1 1 140px;display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--linha);padding:8px 10px;font:inherit;font-size:12.5px;color:var(--tinta-2);cursor:pointer;text-align:left}
.emchk .cx{width:18px;height:18px;border:1.5px solid var(--tinta-3);display:grid;place-items:center;font-size:12px;flex:0 0 18px}
.emchk button.ok{color:var(--verde);border-color:rgba(47,107,74,.45)}
.emchk button.ok .cx{background:var(--verde);border-color:var(--verde);color:#fff}
.emchk button.conf{border-color:var(--alerta);color:var(--alerta)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:var(--verde);color:var(--creme);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
.folha{position:fixed;inset:0;z-index:60}
.folha-fundo{position:absolute;inset:0;background:rgba(20,30,24,.45)}

const brl = (n) => 'R$ ' + Number(n || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const brlC = (n) => { n = Number(n || 0); if (Math.abs(n) >= 1e6) return 'R$ ' + (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi'; if (Math.abs(n) >= 1e4) return 'R$ ' + (n / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil'; return brl(n); };

  const d = new Date(s); if (isNaN(d)) return '';
  const h = (Date.now() - d) / 36e5;
  if (h < 1) return 'agora há pouco';
  if (h < 24) return `há ${Math.floor(h)} h`;

  return dataCurta(d);
};
const nomeDia = (d) => { const k = difDias(d); if (k === 0) return 'Hoje'; if (k === 1) return 'Amanhã'; if (k === -1) return 'Ontem'; return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' }); };

    const nada = Promise.resolve({ data: [], error: null, count: 0 });
    const q = await Promise.all([
      LE ? sb.from('leads').select('*').order('created_at', { ascending: false }).limit(1000) : nada,
      LE || G ? sb.from('solicitacoes_acesso').select('*').order('created_at', { ascending: false }).limit(500) : nada,
      pode('talentos') ? sb.from('banco_talentos').select('*').order('created_at', { ascending: false }).limit(300) : nada,
      G ? sb.from('clientes').select('*').order('nome_completo') : nada,
      G ? sb.from('gestores').select('*') : nada,
      G ? sb.from('programas_milhas').select('*') : nada,
      G ? sb.from('historico_economia').select('*').gte('data', inicioAno) : nada,
      G ? sb.from('voos').select('*').gte('data_voo', iso(ontem)).lte('data_voo', iso(em120)).order('data_voo').order('hora_partida') : nada,
      G ? sb.from('viagens').select('*').gte('data_viagem', iso(ontem)).lte('data_viagem', iso(em120)).order('data_viagem') : nada,
      G ? sb.from('agendamentos_reuniao').select('*').in('status', ['solicitada', 'confirmada']).order('created_at', { ascending: false }).limit(200) : nada,
      G ? sb.from('convites').select('id', { count: 'exact', head: true }).eq('status', 'enviado') : nada,
      ADMIN ? carregarEquipe() : nada,
      ADMIN ? carregarAvisos() : nada
    ]);
    const erro = q.slice(0, 10).find(r => r && r.error && r !== q[2]);
    if (erro) aviso('Alguns dados não carregaram: ' + erro.error.message);
    [D.leads, D.sols, D.tal, D.clientes, D.gestores, D.progs, D.eco, D.voos, D.viagens, D.ags] = q.slice(0, 10).map(r => (r && r.data) || []);
    D.talErro = q[2].error; D.convPend = q[10].count || 0;
  }
  if (G) {
    const k0 = mesKey(new Date());
    const gx = await Promise.all([
      sb.from('convites').select('*').order('created_at', { ascending: false }).limit(300),
      sb.from('relatorios_mensais').select('cliente_id,publicado').eq('mes', mesMais(k0, -1) + '-01'),
      sb.from('extrato_milhas').select('cliente_id,created_at').gte('created_at', k0 + '-01'),
      sb.from('reunioes').select('cliente_id,data_reuniao').gte('data_reuniao', k0 + '-01'),
      sb.from('gestao_tarefas').select('*').limit(5000)
    ]);
    [D.indic, D.rel, D.extMes, D.atasMes, D.gtar] = gx.map(r => r.data || []);
    if (gx[4].error) D.gtar = null;
  }
  if (podeAba('crm')) {
    const nada = Promise.resolve({ data: [], error: null });
    const px = await Promise.all([
      sb.from('pessoas').select('*').order('nome').limit(10000),
      pode('emissoes') ? sb.from('pessoas_documentos').select('*').limit(10000) : nada,
      sb.from('pessoas_vinculos').select('*').limit(10000),
      pode('emissoes') ? sb.from('emissao_passageiros').select('*').limit(20000) : nada,
      ADMIN ? sb.from('pessoas_duplicatas').select('*').eq('status', 'pendente').limit(500) : nada
    ]);
    D.pessoas = px[0].error ? null : (px[0].data || []);
    { const av = await sb.from('avaliacoes').select('*').order('created_at', { ascending: false }).limit(5000); D.avaliacoes = av.error ? null : (av.data || []); }
    { const pv = await sb.from('pos_viagem').select('*').limit(10000); D.posViagem = pv.error ? null : (pv.data || []); }
    if (podeAba('fornecedores')) await FORN.carregar(sb);
    [D.docs, D.vinculos, D.passageiros, D.dups] = px.slice(1).map(r => (r && !r.error && r.data) || []);
  } else D.pessoas = [];
  if (podeAba('compromissos')) await CMP.carregar(ctxCMP());
  if (podeAba('marketing')) await MKT.carregar(sb);
  $('pagina').classList.remove('carregando');
  D.atual = new Date();
  tela();
}

function ctxDRE() { return { D, sb, $, esc, aviso, brl2, pct, campo, ir, aba: () => ABA, mesNome, nomeTime, CAT_DESP, mes: () => EM_MES, setMes: (k) => { EM_MES = k; }, seletorMes, ligarMes, folha: (k) => CMP.folha(ctxCMP(), k), mesCaixa: CMP.MES_CAIXA }; }
function ctxCMP() { return { D, sb, $, esc, aviso, brl2, ir, aba: () => ABA, aPagar, nomeTime }; }

function ctxCRM() {

const pessoaPorNome = (n) => { const k = String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); return k ? (D.pessoas || []).find(p => String(p.nome).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim() === k) : null; };

/* ================= cálculos ================= */
const nomeCli = (id) => (D.clientes.find(c => c.id === id) || {}).nome_completo || 'Cliente';
const ecoValor = (r) => (r.valor_economia_brl !== null && r.valor_economia_brl !== undefined && r.valor_economia_brl !== '') ? Number(r.valor_economia_brl) || 0 : (Number(r.valor_mercado_brl) || 0) - (Number(r.valor_pago_brl) || 0);
const progsDe = (id) => D.progs.filter(p => p.cliente_id === id);
const patrimonio = (id) => progsDe(id).reduce((s, p) => s + (Number(p.patrimonio_brl) || 0), 0);
const milhas = (id) => progsDe(id).reduce((s, p) => s + (Number(p.saldo) || 0), 0);
const economiaAno = (id) => D.eco.filter(r => !id || r.cliente_id === id).reduce((s, r) => s + ecoValor(r), 0);
const vencimentos = (dias) => D.progs.filter(p => p.vencimento_data && Number(p.vencimento_quantidade) > 0).map(p => ({ p, d: dia(p.vencimento_data) })).filter(x => difDias(x.d) >= 0 && difDias(x.d) <= dias).sort((a, b) => a.d - b.d);
const checkins = () => D.voos.filter(v => ['confirmado', 'checkin_aberto'].includes(v.status)).filter(v => { const d = dia(v.data_voo); if (v.hora_partida) { const [h, m] = v.hora_partida.split(':'); d.setHours(+h, +m); } const hrs = (d - Date.now()) / 36e5; return hrs >= 0 && hrs <= 48; });
const checkinsTotal = () => checkins().length + checkinsEm().length;
const reunioesAConfirmar = () => D.ags.filter(a => a.status === 'solicitada');
const leadsSemResposta = () => D.leads.filter(r => r.status === 'novo');
const leadsSemDono = () => D.leads.filter(r => r.status === 'novo' && !r.responsavel_id);
const medianaAssumir = (L) => { const v = L.filter(r => r.assumido_em).map(r => (new Date(r.assumido_em) - new Date(r.created_at)) / 6e4).filter(x => x >= 0).sort((a, b) => a - b); return v.length ? v[Math.floor(v.length / 2)] : null; };
const convitesNovos = () => D.sols.filter(r => r.status === 'nova');
const diasPara = (d) => d ? difDias(dia(d)) : null;
const renovacoes = (n) => D.clientes.filter(c => c.gestao_vencimento && diasPara(c.gestao_vencimento) <= n).sort((a, b) => String(a.gestao_vencimento).localeCompare(String(b.gestao_vencimento)));
const semContrato = () => D.clientes.filter(c => !c.gestao_inicio);
const dataBR = (d) => d ? dia(d).toLocaleDateString('pt-BR') : '';
const semAtualizacao = () => D.clientes.filter(c => !c.ultima_atualizacao || (Date.now() - new Date(c.ultima_atualizacao)) / 864e5 > 30);

function eventos() {
  const E = [];
  D.voos.forEach(v => {
    const d = dia(v.data_voo);
    const ck = checkins().includes(v);
    E.push({ cid: v.cliente_id, d, hora: v.hora_partida ? v.hora_partida.slice(0, 5) : '', ic: 'voo', alerta: ck,
      t: `${v.origem_codigo || v.origem_cidade || '?'} → ${v.destino_codigo || v.destino_cidade || '?'}${v.companhia ? ' · ' + v.companhia : ''}${v.numero_voo ? ' ' + v.numero_voo : ''}`,
      s: `${nomeCli(v.cliente_id)}${v.localizador ? ' · loc. ' + v.localizador : ''}${ck ? ' · fazer check-in' : v.status === 'alterado' ? ' · alterado pela cia.' : ''}`,
      href: adminLink(v.cliente_id, 'voos') });
  });
  D.viagens.forEach(v => E.push({ cid: v.cliente_id, d: dia(v.data_viagem), hora: '', ic: 'viagem', t: `Início da viagem: ${v.destino || ''}${v.destino_complemento ? ' · ' + v.destino_complemento : ''}`, s: nomeCli(v.cliente_id) + (v.hotel ? ' · ' + v.hotel : ''), href: adminLink(v.cliente_id, 'viagens') }));
  D.ags.forEach(a => {
    if ((D.agenda || []).some(x => String(x.agendamento_id) === String(a.id))) return;
    if (a.status === 'confirmada' && a.data_confirmada) { const d = new Date(a.data_confirmada); const d0 = new Date(d); d0.setHours(0, 0, 0, 0); if (difDias(d0) >= -1) E.push({ cid: a.cliente_id, d: d0, hora: d.toTimeString().slice(0, 5), ic: 'reuniao', t: `Reunião com ${nomeCli(a.cliente_id)}`, s: a.link_reuniao ? 'Link da reunião pronto' : 'Sem link cadastrado', href: a.link_reuniao || adminLink(a.cliente_id, 'agendamentos_reuniao'), ext: !!a.link_reuniao }); }
    if (a.status === 'solicitada') E.push({ cid: a.cliente_id, d: dia(a.data_preferida) || HOJE(), hora: '', ic: 'reuniao', alerta: true, t: `Reunião a confirmar: ${nomeCli(a.cliente_id)}`, s: `Preferência ${a.periodo ? 'pela ' + a.periodo.toLowerCase() : 'sem período'}${a.formato ? ' · ' + a.formato : ''}`, href: adminLink(a.cliente_id, 'agendamentos_reuniao') });
  });
  trechosEm().forEach(t => E.push({ d: t.d, hora: '', ic: 'voo', alerta: t.pendente,
    t: `${t.de || '?'} → ${t.para || '?'}${t.v.cia ? ' · ' + t.v.cia : ''}${t.tr === 'volta' ? ' · volta' : ''}`,
    s: `${t.v.passageiro || 'Passageiro'}${t.v.localizador ? ' · loc. ' + t.v.localizador : ''}${t.v.vendedor ? ' · ' + t.v.vendedor : ''}`,
    href: (ADMIN || D.emissoes.some(x => x.id === t.id)) ? '#emissoes/' + t.id : '', ck: { id: t.id, tr: t.tr, feito: t.feito } }));
  D.clientes.filter(c => c.gestao_vencimento && diasPara(c.gestao_vencimento) >= -1 && diasPara(c.gestao_vencimento) <= 120).forEach(c => E.push({ cid: c.id, d: dia(c.gestao_vencimento), hora: '', ic: 'milhas', alerta: diasPara(c.gestao_vencimento) <= 30, t: `Vence o contrato da Gestão: ${c.nome_completo}`, s: 'Reunião de renovação', href: '#clientes/' + c.id }));
  (D.agenda || []).filter(x => x.status === 'Agendada').forEach(x => { const d = new Date(x.data), d0 = new Date(d); d0.setHours(0, 0, 0, 0); E.push({ d: d0, hora: d.toTimeString().slice(0, 5), ic: 'reuniao', t: x.titulo + (x.cliente && !x.titulo.includes(x.cliente) ? ' · ' + x.cliente : ''), s: [x.tipo, (x.participantes || []).map(nomeTime).filter(Boolean).join(', ')].filter(Boolean).join(' · '), href: '#agenda/' + x.id }); });
  vencimentos(90).forEach(({ p, d }) => E.push({ cid: p.cliente_id, d, hora: '', ic: 'milhas', alerta: difDias(d) <= 30, t: `${num(p.vencimento_quantidade)} ${p.unidade || 'milhas'} ${p.programa} vencem`, s: nomeCli(p.cliente_id), href: adminLink(p.cliente_id, 'programas_milhas') }));
  if (podeAba('crm')) CRM.eventos(D).forEach(x => E.push({ d: x.d, hora: '', ic: x.ic, alerta: x.alerta || (x.aniv && difDias(x.d) === 0), t: x.t, s: x.s, href: '#crm/' + x.pid }));
  return E.filter(e => e.d && difDias(e.d) >= -1).sort((a, b) => a.d - b.d || String(a.hora).localeCompare(String(b.hora)));
}
function agrupar(lista) { let u = ''; return lista.map(e => { const k = nomeDia(e.d); const h = k !== u ? `<div class="dia">${k}</div>` : ''; u = k; return h + htmlEvento(e); }).join(''); }
function htmlEvento(e) {
  const ck = e.ck ? `<button class="ck ${e.ck.feito ? 'feito' : ''}" data-id="${e.ck.id}" data-tr="${e.ck.tr}">${e.ck.feito ? 'Check-in feito' : 'Marcar check-in feito'}</button>` : '';

function tela() {

  if (ABA === 'metas') return telaMetas(P);
  if (ABA === 'custos') return telaCustos(P);
  if (ABA === 'acessos') return telaAcessos(P);
  if (ABA === 'cotador') return COT.tela(P, { D, $, esc, sb, aviso, ir, aba: () => ABA, cotacaoEnviada, fornecedores: podeAba('fornecedores') ? { lista: FORN.lista } : null, acervoRecarregar: ACV.recarregar });
  if (ABA === 'acervo') return ACV.telaAcervo(P, { sb, $, esc, aviso, brl2, brlC, num, campo, ir, aba: () => ABA });
  if (ABA === 'receber') return telaReceber(P);
  if (ABA === 'dre') return DRE.tela(P, ctxDRE());
  if (ABA === 'compromissos') return CMP.tela(P, ctxCMP());
  if (ABA === 'pagar') return telaPagar(P);

  if (ABA === 'emissoes') return telaEmissoes(P);
  if (ABA === 'comissao') return telaComissao(P);
  if (ABA === 'financeiro') return telaFinanceiro(P);
  if (ABA === 'mais') return telaMais(P);
  if (ABA === 'empresa') return telaEmpresa(P);

  return telaInicio(P);

const mesKey = (d) => { d = d instanceof Date ? d : dia(d); return d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` : ''; };

/* cálculo igual ao do banco (método 1 por padrão) */
const temManual = (x) => x != null && x !== '';
const tec = (m) => ADMIN ? m : (String(m).trim().startsWith('<') ? '<div class="config" style="margin-top:12px">Recurso ainda não ativado. Fale com o administrador.</div>' : 'Recurso ainda não ativado. Fale com o administrador.');
const pctPadraoVend = (id) => +((D.equipe.find(x => x.user_id === id) || {}).comissao_pct || 0);
const pctPadraoParc = (id) => +((D.parceirosAdm.find(x => x.id === id) || {}).pct || 0);
const nomeParc = (id) => ((D.parceirosAdm.find(x => x.id === id) || D.parc.find(x => x.id === id) || {}).nome || '');
function calcular(v) {
  const t = Number((D.cfg && D.cfg.imposto_pct) ?? 6) / 100;
  const custo = Math.round(((+v.milhas || 0) * (+v.milheiro || 0) / 1000 + (+v.taxas || 0)) * 100) / 100;
  const m = (+v.valor_receber || 0) - custo;
  const cp = (+v.comissao_pct || 0) / 100, pp = (+v.parceiro_pct || 0) / 100;
  const r2 = (x) => Math.round(x * 100) / 100;
  let imposto, comissao, repasse;
  if (D.cfg && D.cfg.comissao_desconta_imposto) {
    const iref = Math.max(m, 0) * t;
    comissao = r2(temManual(v.comissao_manual) && !v.pct_app ? +v.comissao_manual : Math.max(m - iref, 0) * cp);
    repasse = r2(temManual(v.repasse_manual) && !v.ppct_app ? +v.repasse_manual : Math.max(m - iref - comissao, 0) * pp);
    imposto = r2(Math.max(m - comissao - repasse, 0) * t);
  } else {
    imposto = r2(Math.max(m, 0) * t);
    comissao = r2(temManual(v.comissao_manual) && !v.pct_app ? +v.comissao_manual : Math.max(m - imposto, 0) * cp);
    repasse = r2(temManual(v.repasse_manual) && !v.ppct_app ? +v.repasse_manual : Math.max(m - imposto - comissao, 0) * pp);
  }
  return { custo, lucro_bruto: r2(m), imposto, comissao, repasse, lucro_liquido: r2(m - imposto - comissao - repasse) };
}

/* ---------- PDF da nota fiscal (bucket privado "notas") ---------- */
async function notaBaixar(e) {
  const { data, error } = await sb.storage.from('notas').createSignedUrl(e.nota_arquivo, 300, { download: 'Nota fiscal - ' + (e.comprador || 'venda') + '.' + (String(e.nota_arquivo).split('.').pop() || 'pdf') });
  if (error) { aviso('Não abriu a nota: ' + error.message); return; }
  location.href = data.signedUrl;
}
function notaAnexar(e, depois) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/pdf,.pdf,.xml';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    if (file.size > 10 * 1024 * 1024) { aviso('Arquivo acima de 10 MB.'); return; }
    aviso('Enviando a nota...');
    const ext = /\.xml$/i.test(file.name) ? 'xml' : 'pdf';
    const path = e.id + '/' + Date.now() + '.' + ext;
    const up = await sb.storage.from('notas').upload(path, file, { contentType: ext === 'xml' ? 'text/xml' : 'application/pdf', upsert: false });
    if (up.error) { aviso('Não enviou: ' + up.error.message + (/bucket/i.test(up.error.message) ? ' (rode o notas-e-datas.sql)' : '')); return; }
    const antigo = e.nota_arquivo;
    const { error } = await sb.from('emissoes').update({ nota_arquivo: path, nota_gerada: true }).eq('id', e.id);
    if (error) { await sb.storage.from('notas').remove([path]); aviso('Não salvou: ' + error.message + (/nota_arquivo/.test(error.message) ? ' (rode o notas-e-datas.sql)' : '')); return; }
    if (antigo) await sb.storage.from('notas').remove([antigo]);
    e.nota_arquivo = path; e.nota_gerada = true; aviso('Nota anexada e marcada como emitida.'); if (depois) depois();
  };
  inp.click();
}

}
function caixa(nome, rotulo, valor) { return `<label class="fc"><input type="checkbox" name="${nome}" ${valor ? 'checked' : ''}><span>${rotulo}</span></label>`; }

      ${daPlanilha ? '' : '<div class="resumo" id="resumo"></div>'}

      <div class="grupo">Acompanhamento</div>

      ${!nova ? `<div class="emchk" style="margin:4px 0 12px;border-top:1px solid var(--linha)"><button type="button" id="notaPdf" class="${e.nota_arquivo ? 'ok' : ''}"><span class="cx">${e.nota_arquivo ? '↓' : '+'}</span><span>${e.nota_arquivo ? 'Baixar a nota fiscal' : 'Anexar PDF da nota fiscal'}</span></button>${e.nota_arquivo && (ADMIN || e.vendedor_id === D.meuId) ? `<button type="button" id="notaTroca"><span class="cx">↺</span><span>Trocar o arquivo</span></button>` : ''}</div>` : ''}
      <label class="fl"><span>Observações</span><textarea name="observacoes" rows="3">${esc(e.observacoes || '')}</textarea></label>

      ${podeEditar ? `<button class="zap grande" type="submit" id="salvar">${nova ? 'Registrar emissão' : 'Salvar alterações'}</button>` : ''}
      ${ADMIN && !nova && !daPlanilha ? `<button class="sec grande" type="button" id="excluir" style="margin-top:8px;width:100%">Excluir emissão</button>` : ''}
      <div class="sub" id="msgEm" style="margin-top:8px"></div>
    </form>`;
  const f = $('fEm');

  if ($('notaPdf')) $('notaPdf').onclick = () => e.nota_arquivo ? notaBaixar(e) : notaAnexar(e, reabrir);
  if ($('notaTroca')) $('notaTroca').onclick = () => notaAnexar(e, reabrir);

    const p = pessoaPorNome(f.elements.comprador.value);

    $('fichaEm').innerHTML = p ? 'Cliente com ficha: a venda entra no histórico dele.' : f.elements.comprador.value.trim() && podeAba('crm') ? 'Sem ficha ainda. Depois de salvar, cadastre em Clientes, Cadastrar cliente.' : '';
  });

  const MARCAS = ['pago', 'nota_gerada', 'checkin_ida', 'checkin_volta', 'monitorado', 'voado', 'feito_pos'];

  if (!podeEditar) [...f.elements].forEach(x => { if (!(daPlanilha && (/^checkin_/.test(x.name) || (podeMarcar && MARCAS.includes(x.name))))) x.disabled = true; });

  if (daPlanilha) MARCAS.forEach(n => {
    const cx = f.elements[n]; if (!cx || cx.disabled) return;
    cx.onchange = async () => {
      const ck = /^checkin_/.test(n);
      if (ck && cx.checked && !(await perguntarBilhete(n.slice(8)))) { cx.checked = false; return; }
      const { error } = ck ? await sb.rpc('marcar_checkin', { p_id: e.id, p_trecho: n.slice(8), p_feito: cx.checked })
                           : await sb.from('emissoes').update({ [n]: cx.checked }).eq('id', e.id);
      if (error) { cx.checked = !cx.checked; aviso('Não salvou: ' + error.message); return; }
      e[n] = cx.checked; const v = D.voosEm.find(x => x.id === e.id); if (v && ck) v[n] = cx.checked;
      const nome = { pago: 'Pagamento', nota_gerada: 'Nota fiscal', checkin_ida: 'Check-in da ida', checkin_volta: 'Check-in da volta', monitorado: 'Monitoramento', voado: 'Voado', feito_pos: 'Pós-venda' }[n];
      aviso(cx.checked ? `${nome} marcado. Vai para a planilha em até 5 minutos.` : `${nome} desmarcado no app. Desmarque também na planilha.`);
    };
  });
  if (!nova && ADMIN) { P.insertAdjacentHTML('beforeend', '<div id="histAlt"></div>'); historico('emissoes', e.id); }
  const lerValores = () => {
    const g = (n) => f.elements[n] ? f.elements[n].value : undefined;
    const serv = g('servico');
    const v = { milhas: ehMilhas(serv) ? g('milhas') : 0, milheiro: ehMilhas(serv) ? g('milheiro') : 0, taxas: ehMilhas(serv) ? g('taxas') : g('custo_direto'), valor_receber: g('valor_receber'), comissao_manual: g('comissao_manual'), repasse_manual: g('repasse_manual') };
    const vend = ADMIN ? g('vendedor_id') : D.meuId;
    v.comissao_pct = (!nova && vend === e.vendedor_id && e.comissao_pct_app == null) ? e.comissao_pct : (ADMIN ? pctPadraoVend(vend) : D.perfil.comissao_pct);
    const parc = g('parceiro_id');
    v.parceiro_pct = (!nova && parc === (e.parceiro_id || '') && e.parceiro_pct_app == null) ? e.parceiro_pct : (ADMIN ? pctPadraoParc(parc) : 0);
    const cpa = g('comissao_pct_app'), ppa = g('parceiro_pct_app');
    if (temManual(cpa)) { v.comissao_pct = +String(cpa).replace(',', '.'); v.pct_app = true; }

      ? `<div class="lin"><span>Custo</span><span>${brl2(r.custo)}</span></div><div class="lin"><span>Lucro bruto</span><span>${brl2(r.lucro_bruto)}</span></div><div class="lin"><span>Imposto</span><span>− ${brl2(r.imposto)}</span></div><div class="lin"><span>Comissão do vendedor</span><span>− ${brl2(r.comissao)}</span></div><div class="lin"><span>Parceiro</span><span>− ${brl2(r.repasse)}</span></div><div class="lin forte"><span>Lucro líquido da Maktub</span><span>${brl2(r.lucro_liquido)}</span></div>`
      : `<div class="lin"><span>Lucro da venda</span><span>${brl2(r.lucro_bruto)}</span></div><div class="lin forte"><span>Sua comissão estimada</span><span>${brl2(r.comissao)}</span></div>`;
  };
  f.oninput = atualizar; atualizar();
  $('voltar').onclick = () => history.back();
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const g = (n) => f.elements[n] ? f.elements[n].value.trim() : undefined;
    const numOuNulo = (x) => x === '' || x === undefined ? null : Number(String(x).replace(',', '.'));
    const serv = g('servico');
    if (!g('comprador')) { $('msgEm').textContent = 'Informe o comprador.'; return; }
    if (g('valor_receber') === '') { $('msgEm').textContent = 'Informe o valor a receber.'; return; }
    const row = {
      servico: serv, data_negociacao: g('data_negociacao') || null, comprador: g('comprador'), sobrenome: g('sobrenome') || null,
      passageiros: numOuNulo(g('passageiros')), contato: g('contato') || null, cpf_nf: g('cpf_nf') || null,
      parceiro_id: g('parceiro_id') || null, origem: (g('origem') || '').toUpperCase() || null, destino: (g('destino') || '').toUpperCase() || null,
      cia: g('cia') || null, localizador: (g('localizador') || '').toUpperCase() || null, data_ida: g('data_ida') || null, data_volta: g('data_volta') || null,
      produto: g('produto') || null, milhas: ehMilhas(serv) ? (numOuNulo(g('milhas')) || 0) : 0, milheiro: ehMilhas(serv) ? (numOuNulo(g('milheiro')) || 0) : 0,
      taxas: ehMilhas(serv) ? (numOuNulo(g('taxas')) || 0) : (numOuNulo(g('custo_direto')) || 0), valor_receber: numOuNulo(g('valor_receber')) || 0,
      fornecedor: g('fornecedor') || null, conta: g('conta') || null, forma_pagamento: g('forma_pagamento') || null, parcelas: numOuNulo(g('parcelas')),
      observacoes: g('observacoes') || null
    };
    if (g('pessoa_id')) row.pessoa_id = g('pessoa_id');
    ['pago', 'nota_gerada', 'checkin_ida', 'checkin_volta', 'monitorado', 'voado', 'feito_pos'].forEach(n => row[n] = f.elements[n].checked);
    if (ADMIN) { row.vendedor_id = g('vendedor_id') || null; row.comissao_manual = numOuNulo(g('comissao_manual')); row.repasse_manual = numOuNulo(g('repasse_manual')); row.comissao_pct_app = numOuNulo(g('comissao_pct_app')); row.parceiro_pct_app = numOuNulo(g('parceiro_pct_app')); }
    else if (nova) row.vendedor_id = D.meuId;
    if (travado) financeiros.forEach(n => delete row[n]);
  if (!ADMIN) { delete row.comissao_pct_app; delete row.parceiro_pct_app; }
    $('salvar').disabled = true; $('msgEm').textContent = 'Salvando...';
    const q = nova ? sb.from('emissoes').insert(row).select().single() : sb.from('emissoes').update(row).eq('id', e.id).select().single();
    const { data, error } = await q;
    $('salvar').disabled = false;
    if (error) { $('msgEm').textContent = 'Não salvou: ' + error.message; return; }
    const i = D.emissoes.findIndex(x => x.id === data.id); if (i >= 0) D.emissoes[i] = data; else D.emissoes.unshift(data);
    aviso(nova ? `Emissão registrada. Comissão: ${brl2(data.comissao)}.` : 'Emissão atualizada.');
    if (data.pessoa_id) virarCliente(data.pessoa_id);
    EM_MES = String(data.data_negociacao).slice(0, 7);
    carregarAgendaEm().then(() => {});
    history.back();
  };
  if ($('excluir')) $('excluir').onclick = async () => {
    if (CONFIRMA !== e.id) { CONFIRMA = e.id; $('excluir').textContent = 'Toque de novo para confirmar a exclusão'; return; }
    const { error } = await sb.from('emissoes').delete().eq('id', e.id);
    if (error) { aviso('Não excluiu: ' + error.message); return; }
    D.emissoes = D.emissoes.filter(x => x.id !== e.id); CONFIRMA = null; aviso('Emissão excluída.'); history.back();
  };
}

    </div>`).join('')}</div>

      const { error } = await sb.from('emissoes').update({ comissao_pct_app: novo }).in('id', ids.slice(k, k + 100));

    await carregarEquipe(); aviso('Regras salvas.');
  };
}
async function carregarEquipe() {

async function carregarAgendaEm() {
  const iso = (d) => d.toISOString().slice(0, 10);
  const r = await sb.rpc('agenda_voos', { p_de: iso(new Date(+HOJE() - 864e5)), p_ate: iso(new Date(+HOJE() + 120 * 864e5)) });
  D.voosEm = r.data || [];
}

/* trechos de voo das emissões (todo o time vê) */
function trechosEm() {
  const T = [];
  D.voosEm.forEach(v => {
    [['ida', v.data_ida, v.checkin_ida, v.origem, v.destino], ['volta', v.data_volta, v.checkin_volta, v.destino, v.origem]].forEach(([tr, data, feito, de, para]) => {
      if (!data) return;
      const d = dia(data), k = difDias(d);
      if (k < -1) return;
      T.push({ id: v.id, tr, d, feito, pendente: !feito && k >= 0 && k <= 2, de, para, v });
    });
  });
  return T;
}
const checkinsEm = () => trechosEm().filter(t => t.pendente);

/* ---------- leads ---------- */
const noPeriodo = (arr) => DIAS ? arr.filter(r => Date.now() - new Date(r.created_at) <= DIAS * 864e5) : arr;
const origemDe = (o) => {
  const v = String(o || '').trim().toLowerCase();
  if (!v || v === 'direto') return 'Direto';
  if (/google/.test(v)) return 'Google';
  if (/instagram|\big\b/.test(v)) return 'Instagram';
  if (/facebook|\bfb\b/.test(v)) return 'Facebook';
  if (/whatsapp|wa\.me/.test(v)) return 'WhatsApp';
  if (/bing/.test(v)) return 'Bing';
  if (/linkedin/.test(v)) return 'LinkedIn';
  if (/maktubgo\.com\.br/.test(v)) return 'Direto';
  try { return new URL(v).hostname.replace(/^www\./, ''); } catch (_) { return v.slice(0, 24); }
};
const semDado = (x) => !x || /^\((not set|not provided|other)\)$/i.test(String(x).trim()) ? 'Não identificado' : x;
function barras(itens, classe = '') {

async function depoisDaCarteira(c, msg) {
  try { await CART.syncCarteira(c.id, c._refs); } catch (e) { aviso('Salvou, mas o recálculo falhou: ' + (e.message || e)); }
  const agora = new Date().toISOString();
  await sb.from('clientes').update({ ultima_atualizacao: agora }).eq('id', c.id).then(({ error }) => { if (!error) c.ultima_atualizacao = agora; });
  const pr = await sb.from('programas_milhas').select('*').eq('cliente_id', c.id);
  if (!pr.error) D.progs = D.progs.filter(p => p.cliente_id !== c.id).concat(pr.data || []);
  D.extMes = (D.extMes || []).concat([{ cliente_id: c.id, created_at: agora }]);
  const ec = await sb.from('historico_economia').select('*').eq('cliente_id', c.id).gte('data', new Date().getFullYear() + '-01-01');
  if (!ec.error) D.eco = D.eco.filter(r => r.cliente_id !== c.id).concat(ec.data || []);
  await gtMarcarChave(c, 'carteira');
  FI_FORM = null; aviso(msg); telaFicha($('pagina'), c.id);
}

      <div class="duas-col">${campo('quantidade', 'Quantidade', '', 'number', 'required min="1"')}<span id="wCusto">${campo('custo_brl', 'Valor pago (R$)', '', 'number')}</span></div>

    uso: `<h2>Uso de milhas</h2>

      <div class="duas-col">${campo('quantidade', 'Milhas usadas', '', 'number', 'required min="1"')}${selG('categoria_uso', 'O que foi emitido', [['passagem', 'Passagem aérea'], ['hospedagem', 'Hospedagem'], ['upgrade', 'Upgrade'], ['produto', 'Produtos ou vale-compras'], ['outro', 'Outro']], 'passagem')}</div>
      <div class="duas-col">${campo('taxas_brl', 'Taxas pagas (R$)', '', 'number')}${campo('valor_pagante_brl', 'Valor em dinheiro (R$)', '', 'number')}</div>
      ${campo('descricao', 'Descrição', '', 'text', 'required placeholder="Ex.: GRU > SCL, executiva, 2 passageiros"')}
      <div class="sub" style="margin-top:4px">Com o valor em dinheiro, a economia entra sozinha no painel do cliente.</div>`,
    transf: `<h2>Transferência entre programas</h2>
      <div class="duas-col">${campo('data', 'Data', hoje, 'date', 'required')}${selG('de', 'De', comSaldo, comSaldo[0][0])}</div>
      ${progIn('para', 'Para')}
      <div class="duas-col">${campo('enviados', 'Pontos enviados', '', 'number', 'required min="1"')}${selG('paridade', 'Paridade', [['1', '1 ponto = 1 milha'], ['2', '2 pontos = 1 milha'], ['3', '3 pontos = 1 milha'], ['0.5', '1 ponto = 2 milhas']], '1')}</div>
      <div class="duas-col">${campo('bonus', 'Bônus da promoção (%)', '0', 'number')}${campo('recebidas', 'Milhas recebidas', '', 'number', 'required min="1"')}</div>
      ${campo('validade', 'Validade no destino (opcional)', '', 'date')}${campo('descricao', 'Descrição', '', 'text', 'placeholder="Ex.: promoção 100% Livelo > Smiles"')}`,
    ajuste: `<h2>Expiração ou ajuste</h2>
      <div class="duas-col">${campo('data', 'Data', hoje, 'date', 'required')}${progIn('programa', 'Programa')}</div>
      <div class="duas-col">${selG('tipo', 'Tipo', [['expiracao', 'Expiração'], ['menos', 'Ajuste para menos'], ['mais', 'Ajuste para mais']], 'expiracao')}${campo('quantidade', 'Quantidade', '', 'number', 'required min="1"')}</div>
      ${campo('descricao', 'Descrição', '', 'text')}`,
    economia: `<h2>Cashback ou outro ganho</h2>
      <div class="duas-col">${campo('data', 'Data', hoje, 'date', 'required')}${selG('categoria', 'Tipo', [['cashback', 'Cashback'], ['outro', 'Outro ganho']], 'cashback')}</div>
      <div class="duas-col">${campo('valor', 'Valor (R$)', '', 'number', 'required')}${campo('descricao', 'Descrição', '', 'text', 'required placeholder="Ex.: cashback Méliuz de setembro"')}</div>
      <div class="sub" style="margin-top:4px">Passagens entram sozinhas pelo Uso de milhas. Use aqui só o que não passa pela carteira.</div>`
  }[tipo];
  box.innerHTML = `<form class="bloco form" id="fCart">${corpo}${dl}<div class="sub" id="prevCart"></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="zap" type="submit" id="salvarCart" style="flex:2">Salvar e atualizar o painel</button><button class="sec" type="button" id="cancCart" style="flex:1">Cancelar</button></div></form>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const f = $('fCart');
  const pre = tipo === 'uso' ? FI_PRE : null;
  if (pre) { if (pre.data) f.elements.data.value = pre.data; if (pre.quantidade) f.elements.quantidade.value = Math.round(pre.quantidade); if (pre.taxas) f.elements.taxas_brl.value = pre.taxas; if (pre.descricao) f.elements.descricao.value = pre.descricao; $('prevCart').textContent = 'Preenchido a partir da emissão. Confira o programa e informe o valor em dinheiro para calcular a economia.'; }
  $('cancCart').onclick = () => { FI_FORM = null; FI_PRE = null; box.innerHTML = ''; };
  const estado = (nome) => W.programas.find(p => p.key === CART.normProg(nome));
  let manual = false;
  const upd = (ev) => {
    const pv = $('prevCart');
    if (tipo === 'entrada') {
      const t = tv(f, 'tipo'); $('wCusto').hidden = t === 'acumulo' || t === 'bonus';
      const q = nv(f, 'quantidade'), cu = nv(f, 'custo_brl');
      pv.textContent = !$('wCusto').hidden && q > 0 && cu > 0 ? `Milheiro desta entrada: ${brl2(cu / q * 1000)}` : '';
    } else if (tipo === 'uso') {
      const s = estado(tv(f, 'programa')), q = nv(f, 'quantidade'), tx = nv(f, 'taxas_brl') || 0, pag = nv(f, 'valor_pagante_brl');
      if (s && q > 0 && s.custo_medio !== null) { const real = s.custo_medio * q / 1000 + tx; pv.textContent = `Custo real: ${brl2(real)}` + (pag > 0 ? ` · economia: ${brl2(pag - real)}` : ''); } else pv.textContent = '';
    } else if (tipo === 'transf') {
      if (ev && ev.target && ev.target.name === 'recebidas') manual = true;
      else if (ev && ev.target && ['enviados', 'paridade', 'bonus'].includes(ev.target.name)) manual = false;
      const env = nv(f, 'enviados'), par = Number(tv(f, 'paridade') || 1), bon = nv(f, 'bonus') || 0;
      if (!manual && env > 0) f.elements.recebidas.value = Math.round(env / par * (1 + bon / 100));
    }
  };
  f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
  f.onsubmit = async (e) => {
    e.preventDefault();
    const erro = (m) => { $('prevCart').textContent = m; $('prevCart').style.color = 'var(--alerta)'; };
    let linhas = [];
    if (tipo === 'entrada') {
      const t = tv(f, 'tipo'), q = nv(f, 'quantidade'), cu = nv(f, 'custo_brl');
      if (!tv(f, 'programa') || !(q > 0)) return erro('Preencha programa e quantidade.');
      if ((t === 'compra' || t === 'clube') && !(cu > 0)) return erro('Compra e clube precisam do valor pago.');
      linhas = [{ data: tv(f, 'data'), programa: tv(f, 'programa'), tipo: t, quantidade: Math.round(q), custo_brl: t === 'acumulo' || t === 'bonus' ? null : cu, validade: tv(f, 'validade') || null, descricao: tv(f, 'descricao') || null }];
    } else if (tipo === 'uso') {
      const q = nv(f, 'quantidade'), s = estado(tv(f, 'programa'));
      if (!(q > 0) || !tv(f, 'descricao')) return erro('Preencha milhas usadas e descrição.');
      if (!s || q > s.saldo) return erro(`Saldo insuficiente: ${num(s ? s.saldo : 0)}.`);
      linhas = [{ data: tv(f, 'data'), programa: tv(f, 'programa'), tipo: 'emissao', quantidade: -Math.round(q), categoria_uso: tv(f, 'categoria_uso'), taxas_brl: nv(f, 'taxas_brl'), valor_pagante_brl: nv(f, 'valor_pagante_brl'), descricao: tv(f, 'descricao') }];
    } else if (tipo === 'transf') {
      const de = tv(f, 'de'), para = tv(f, 'para'), env = nv(f, 'enviados'), rec = nv(f, 'recebidas'), par = Number(tv(f, 'paridade') || 1), s = estado(de);
      if (!para || !(env > 0) || !(rec > 0)) return erro('Preencha destino, pontos enviados e milhas recebidas.');
      if (CART.normProg(de) === CART.normProg(para)) return erro('Origem e destino precisam ser diferentes.');
      if (!s || env > s.saldo) return erro(`Saldo insuficiente em ${de}: ${num(s ? s.saldo : 0)}.`);
      const grupo = crypto.randomUUID(), d = tv(f, 'descricao');
      linhas = [{ data: tv(f, 'data'), programa: de, tipo: 'transf_saida', quantidade: -Math.round(env), grupo_id: grupo, descricao: `Para ${para}${d ? ' · ' + d : ''}` },
        { data: tv(f, 'data'), programa: para, tipo: 'transf_entrada', quantidade: Math.round(rec), milhas_bonus: Math.max(0, Math.round(rec - env / par)), grupo_id: grupo, validade: tv(f, 'validade') || null, descricao: `De ${de}${d ? ' · ' + d : ''}` }];
    } else if (tipo === 'ajuste') {
      const q = nv(f, 'quantidade'), t = tv(f, 'tipo');
      if (!tv(f, 'programa') || !(q > 0)) return erro('Preencha programa e quantidade.');
      linhas = [{ data: tv(f, 'data'), programa: tv(f, 'programa'), tipo: t === 'expiracao' ? 'expiracao' : 'ajuste', quantidade: t === 'mais' ? Math.round(q) : -Math.round(q), descricao: tv(f, 'descricao') || null }];
    }
    $('salvarCart').disabled = true; $('prevCart').style.color = ''; $('prevCart').textContent = 'Salvando...';
    if (tipo === 'economia') {
      const v = nv(f, 'valor'); if (!(v > 0) || !tv(f, 'descricao')) { $('salvarCart').disabled = false; return erro('Preencha valor e descrição.'); }
      const { error } = await sb.from('historico_economia').insert({ cliente_id: c.id, categoria: tv(f, 'categoria'), data: tv(f, 'data'), descricao: tv(f, 'descricao'), valor_economia_brl: v });
      if (error) { $('salvarCart').disabled = false; return erro('Não salvou: ' + error.message); }
      return depoisDaCarteira(c, 'Ganho lançado. Já aparece no painel do cliente.');
    }
    const { error } = await sb.from('extrato_milhas').insert(linhas.map(x => ({ ...x, cliente_id: c.id })));
    if (error) { $('salvarCart').disabled = false; return erro('Não salvou: ' + error.message); }
    if (pre && pre.emissao_id) { await sb.from('emissoes').update({ carteira_status: 'lancado' }).eq('id', pre.emissao_id); const em = D.emissoes.find(x => x.id === pre.emissao_id); if (em) em.carteira_status = 'lancado'; FI_PRE = null; }
    await depoisDaCarteira(c, 'Salvo. O painel do cliente já mostra a atualização.');
  };
}

/* conferência mensal: digita o saldo de hoje e o app lança a diferença */
function formConferencia(c) {
  const box = $('ctForm'); if (!box) return;
  const W = c._W, refs = c._refs || {}, primeira = !c._ex.length;
  const progs = W.programas.filter(p => p.saldo !== 0);
  const extras = c._confExtra || (c._confExtra = []);
  const linha = (nome, atual, i) => `<div class="conf" data-i="${i}">
      <div class="cab"><b>${esc(nome)}</b><small>${atual === null ? 'programa novo' : 'no painel: ' + num(atual)}</small></div>
      <input type="number" inputmode="numeric" min="0" step="1" name="novo" placeholder="${atual === null ? 'saldo de hoje' : 'saldo de hoje (em branco = igual)'}">
      <div class="dif" hidden></div>
      <div class="det" hidden></div></div>`;
  const nomes = [...new Set(W.programas.map(p => p.programa).concat(PROG_PADRAO))];
  box.innerHTML = `<form class="bloco form" id="fConf">
    <h2>Conferência de ${mesNomeCurto(mesKey(new Date()))}</h2>
    <div class="sub" style="margin-top:0">Digite o saldo que aparece hoje em cada programa. O app calcula a diferença e faz os lançamentos sozinho.${primeira ? ' Como é a primeira vez, tudo entra como saldo herdado.' : ''}</div>
    ${campo('data', 'Data da conferência', hojeISO(), 'date', 'required')}
    <div id="confLinhas">${progs.map((p, i) => linha(p.programa, p.saldo, i)).join('')}${extras.map((n, j) => linha(n, null, progs.length + j)).join('')}</div>
    <div class="duas-col" style="align-items:end;margin-top:8px"><label class="fl"><span>Outro programa</span><input id="confNovoProg" list="dlProgC" autocomplete="off" placeholder="Ex.: Smiles"></label><button class="sec" type="button" id="confAdd" style="height:44px">+ Adicionar</button></div>
    <datalist id="dlProgC">${nomes.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="resumoConf" id="confResumo"></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="zap" type="submit" id="salvarConf" style="flex:2">Salvar conferência</button><button class="sec" type="button" id="cancConf" style="flex:1">Cancelar</button></div>
  </form>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const f = $('fConf');
  const lista = () => progs.map(p => ({ nome: p.programa, atual: p.saldo, key: p.key })).concat(extras.map(n => ({ nome: n, atual: null, key: CART.normProg(n) })));
  $('cancConf').onclick = () => { FI_FORM = null; c._confExtra = []; box.innerHTML = ''; };
  $('confAdd').onclick = () => {
    const n = $('confNovoProg').value.trim(); if (!n) return;
    if (lista().some(x => x.key === CART.normProg(n))) { aviso('Esse programa já está na lista.'); return; }
    const vals = [...f.querySelectorAll('.conf [name=novo]')].map(x => x.value);
    extras.push(n); formConferencia(c);
    $('fConf').querySelectorAll('.conf [name=novo]').forEach((x, i) => { if (vals[i] !== undefined) x.value = vals[i]; });
    $('fConf').dispatchEvent(new Event('input'));
  };
  const detalhe = (div, dif, atual) => {
    const d = div.querySelector('.det'), tipoAtual = d.dataset.t;
    if (!dif) { d.hidden = true; d.innerHTML = ''; d.dataset.t = ''; return; }
    const sobe = dif > 0, chave = sobe ? 'sobe' : 'desce';
    if (tipoAtual === chave) return;
    d.dataset.t = chave; d.hidden = false;
    d.innerHTML = sobe
      ? `<select name="tipo">${(primeira || atual === null ? [['saldo_inicial', 'Saldo herdado (já tinha antes)']] : []).concat([['acumulo', 'Acúmulo no cartão ou parceiros'], ['bonus', 'Bônus ou promoção'], ['compra', 'Compra de pontos'], ['clube', 'Clube de pontos']]).map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
         <input type="number" name="custo" placeholder="Valor pago (R$)" hidden step="any" inputmode="decimal">`
      : `<select name="tipo"><option value="emissao">Uso de milhas</option><option value="expiracao">Expiração</option><option value="ajuste">Ajuste para menos</option></select>
         <input name="desc" placeholder="O que foi emitido (ex.: GRU > LIS, 2 pax)">
         <div class="duas-col"><input type="number" name="pagante" placeholder="Valor em dinheiro (R$)" step="any" inputmode="decimal"><input type="number" name="taxas" placeholder="Taxas (R$)" step="any" inputmode="decimal"></div>`;
  };
  const ler = () => lista().map((x, i) => {
    const div = f.querySelector(`.conf[data-i="${i}"]`), v = div.querySelector('[name=novo]').value.trim();
    const novo = v === '' ? null : Math.round(Number(v)), base = x.atual || 0, dif = novo === null ? 0 : novo - base;
    return { ...x, div, novo, dif };
  });
  const upd = () => {
    let sobe = 0, valor = 0, mexidos = 0;
    ler().forEach(r => {
      const el = r.div.querySelector('.dif');
      el.hidden = !r.dif; el.className = 'dif ' + (r.dif < 0 ? 'neg' : '');
      el.textContent = r.dif ? `${r.dif > 0 ? '+' : ''}${num(r.dif)}${refs[r.key] !== undefined ? ' · ' + brl2(r.dif * refs[r.key] / 1000) : ''}` : '';
      detalhe(r.div, r.dif, r.atual);
      const d = r.div.querySelector('.det');
      if (d.dataset.t === 'sobe') { const t = d.querySelector('[name=tipo]').value; d.querySelector('[name=custo]').hidden = !(t === 'compra' || t === 'clube'); }
      if (d.dataset.t === 'desce') { const t = d.querySelector('[name=tipo]').value; d.querySelectorAll('[name=desc],[name=pagante],[name=taxas]').forEach(x => { x.hidden = t !== 'emissao'; }); d.querySelector('.duas-col').hidden = t !== 'emissao'; }
      if (r.novo !== null) mexidos++;
      if (r.dif > 0) { sobe += r.dif; if (refs[r.key] !== undefined) valor += r.dif * refs[r.key] / 1000; }
    });
    $('confResumo').innerHTML = mexidos ? `<b>${plural(mexidos, 'programa conferido', 'programas conferidos')}</b>${sobe ? ` · ${num(sobe)} novos pontos${valor ? ', cerca de ' + brl2(valor) + ' em patrimônio' : ''}` : ''}` : '';
  };
  f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
  f.onsubmit = async (e) => {
    e.preventDefault();
    const data = tv(f, 'data'), R = ler(), linhas = [];
    if (!R.some(r => r.novo !== null)) { aviso('Digite o saldo de pelo menos um programa.'); return; }
    for (const r of R) {
      if (!r.dif) continue;
      const d = r.div.querySelector('.det'), t = d.querySelector('[name=tipo]').value;
      if (r.dif > 0) {
        const custo = d.querySelector('[name=custo]').value.trim() === '' ? null : Number(d.querySelector('[name=custo]').value.replace(',', '.'));
        if ((t === 'compra' || t === 'clube') && !(custo > 0)) { aviso(`${r.nome}: informe o valor pago.`); return; }
        linhas.push({ data, programa: r.nome, tipo: t, quantidade: r.dif, custo_brl: t === 'compra' || t === 'clube' ? custo : null, descricao: 'Conferência mensal' });
      } else if (t === 'emissao') {
        const desc = d.querySelector('[name=desc]').value.trim(), pag = d.querySelector('[name=pagante]').value.trim(), tx = d.querySelector('[name=taxas]').value.trim();
        if (!desc) { aviso(`${r.nome}: descreva o que foi emitido.`); return; }
        linhas.push({ data, programa: r.nome, tipo: 'emissao', quantidade: r.dif, categoria_uso: 'passagem', descricao: desc, valor_pagante_brl: pag ? Number(pag.replace(',', '.')) : null, taxas_brl: tx ? Number(tx.replace(',', '.')) : null });
      } else linhas.push({ data, programa: r.nome, tipo: t, quantidade: r.dif, descricao: 'Conferência mensal' });
    }
    $('salvarConf').disabled = true; $('salvarConf').textContent = 'Salvando...';
    if (linhas.length) {
      const { error } = await sb.from('extrato_milhas').insert(linhas.map(x => ({ ...x, cliente_id: c.id })));
      if (error) { $('salvarConf').disabled = false; $('salvarConf').textContent = 'Salvar conferência'; aviso('Não salvou: ' + error.message); return; }
    }
    const agora = new Date().toISOString();
    const cf = await sb.from('clientes').update({ conferencia_em: agora }).eq('id', c.id);
    if (!cf.error) c.conferencia_em = agora;
    c._confExtra = [];
    await depoisDaCarteira(c, linhas.length ? `Conferência salva: ${plural(linhas.length, 'lançamento feito', 'lançamentos feitos')} e painel atualizado.` : 'Conferência salva: nenhum saldo mudou.');
  };
}

/* reuniões do cliente */
function fiReunioes(el, c) {
  const pedidos = D.ags.filter(a => a.cliente_id === c.id && a.status === 'solicitada');
  el.innerHTML = `
    ${pedidos.length ? `<div class="secao">Pedidos do cliente</div>${pedidos.map(a => `<article class="card" style="margin-bottom:8px"><div class="cab"><div class="nome" style="font-size:19px">Pediu reunião</div><span class="quando">${quando(a.created_at)}</span></div>
      <div class="info">${[['Preferência', [a.data_preferida ? dataBR(a.data_preferida) : '', a.periodo].filter(Boolean).join(' · ')], ['Pauta', a.pauta]].filter(x => x[1]).map(([k, v]) => `<div><span>${k}:</span> ${esc(v)}</div>`).join('')}</div>
      <div class="acoes"><button class="zap" data-conf="${a.id}">Confirmar e marcar</button></div></article>`).join('')}` : ''}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="zap" id="novaReuCli" style="flex:1">+ Registrar reunião</button><button class="sec" id="agendaCli" style="flex:1">+ Agendar</button></div>
    <div class="secao">Histórico: o que foi feito em cada reunião</div>
    <div id="reuCli"><div class="vazio">Carregando...</div></div>
    <div class="sub">Tudo aqui fica no histórico do cliente e aparece no painel dele. Reunião marcada como realizada na agenda, com "publicar no painel", entra aqui sozinha.</div>
    <div class="secao">Agenda (marcadas e realizadas)</div>
    ${(D.agenda || []).filter(x => x.cliente_id === c.id).slice(0, 8).map(htmlReuniaoAgenda).join('') || '<div class="vazio">Nenhuma reunião na agenda.</div>'}`;
  carregarReunioesCliente(c).then(() => { if (FI_ONB && CLI === c.id) { FI_ONB = false; formReuniaoCliente(c, { titulo: 'Reunião de onboard', data_reuniao: hojeISO() }); } });
  $('novaReuCli').onclick = () => formReuniaoCliente(c, null);
  $('agendaCli').onclick = () => meuCal() ? abrirCal({ cliente_id: c.id, nome: c.nome_completo, tipo: 'Cliente da Gestão' }) : abrirReuniao('nova', { tipo: 'Cliente da Gestão', cliente_id: c.id, titulo: 'Reunião com ' + c.nome_completo });
  el.querySelectorAll('[data-ag]').forEach(b => b.onclick = () => abrirReuniao(b.dataset.ag));
  el.querySelectorAll('[data-conf]').forEach(b => b.onclick = () => {
    const a = D.ags.find(x => String(x.id) === b.dataset.conf); if (!a) return;
    const pref = a.data_preferida ? a.data_preferida + 'T' + ({ 'Manhã': '10:00', 'Tarde': '15:00', 'Noite': '19:00' }[a.periodo] || '10:00') : '';
    abrirReuniao('nova', { tipo: 'Cliente da Gestão', cliente_id: a.cliente_id, agendamento_id: String(a.id), titulo: 'Reunião com ' + c.nome_completo, data: pref, link: a.link_reuniao || '' });
  });
}

/* carta do relatório mensal */
let FI_MES = null;
async function fiRelatorio(el, c) {
  const mes = FI_MES || mesAnterior();
  el.innerHTML = '<div class="vazio" style="margin-top:14px">Carregando...</div>';
  const { data, error } = await sb.from('relatorios_mensais').select('*').eq('cliente_id', c.id).order('mes', { ascending: false });

/* documentos */
async function fiDocs(el, c) {
  el.innerHTML = '<div class="vazio" style="margin-top:14px">Carregando...</div>';
  const { data, error } = await sb.from('documentos').select('*').eq('cliente_id', c.id).order('created_at', { ascending: false });
  if (CLI !== c.id || FI_ABA !== 'docs' || !$('fiCorpo')) return;
  if (error) { el.innerHTML = `<div class="vazio">Não carregou: ${esc(error.message)}</div>`; return; }
  el.innerHTML = `
    <form class="bloco form" id="fDoc" style="margin-top:12px"><h2>Enviar para o painel do cliente</h2>
      ${campo('titulo', 'Título', '', 'text', 'required placeholder="Ex.: Bilhete GRU-SCL"')}
      ${selG('tipo', 'Tipo', TIPO_DOC, 'bilhete')}
      <label class="fl"><span>Arquivo (PDF, imagem ou HTML, até 20 MB)</span><input type="file" name="arquivo" required accept=".pdf,.html,.htm,.png,.jpg,.jpeg,.webp"></label>
      <button class="zap" type="submit" id="upBtn" style="margin-top:10px;width:100%">Enviar documento</button></form>
    <div class="secao">Enviados</div>
    <div class="bloco" style="margin-top:0">${(data || []).length ? data.map(d => `<div class="lanc"><div><b>${esc(d.titulo)}</b><small>${esc((TIPO_DOC.find(x => x[0] === d.tipo) || [0, d.tipo])[1])} · ${new Date(d.created_at).toLocaleDateString('pt-BR')}</small></div><div class="q"><button class="mini" data-ver="${esc(d.arquivo_path)}">ver</button><button class="mini" data-rm="${d.id}">excluir</button></div></div>`).join('') : '<div class="vazio">Nenhum documento enviado.</div>'}</div>`;
  $('fDoc').onsubmit = async (e) => {
    e.preventDefault(); const f = e.target, file = f.elements.arquivo.files[0];
    if (!tv(f, 'titulo') || !file) { aviso('Informe o título e escolha o arquivo.'); return; }
    if (file.size > 20 * 1024 * 1024) { aviso('Arquivo acima de 20 MB.'); return; }
    const nome = file.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '-').toLowerCase(), path = `${c.id}/${Date.now()}-${nome}`;
    $('upBtn').disabled = true; $('upBtn').textContent = 'Enviando...';
    const up = await sb.storage.from('documentos').upload(path, file, { contentType: /\.html?$/i.test(nome) ? 'text/html' : (file.type || 'application/octet-stream'), upsert: false });
    if (up.error) { $('upBtn').disabled = false; $('upBtn').textContent = 'Enviar documento'; aviso('Não enviou: ' + up.error.message); return; }
    const ins = await sb.from('documentos').insert({ cliente_id: c.id, titulo: tv(f, 'titulo'), tipo: tv(f, 'tipo'), arquivo_path: path, tamanho_bytes: file.size });
    if (ins.error) { await sb.storage.from('documentos').remove([path]); $('upBtn').disabled = false; $('upBtn').textContent = 'Enviar documento'; aviso('Não salvou: ' + ins.error.message); return; }
    const agora = new Date().toISOString();
    await sb.from('clientes').update({ ultima_atualizacao: agora }).eq('id', c.id).then(({ error: e2 }) => { if (!e2) c.ultima_atualizacao = agora; });
    aviso('Documento enviado. Já está no painel do cliente.'); fiDocs(el, c);
  };
  el.querySelectorAll('[data-ver]').forEach(b => b.onclick = async () => {
    const w = window.open('', '_blank');
    const { data: s, error: er } = await sb.storage.from('documentos').createSignedUrl(b.dataset.ver, 300);
    if (er) { w && w.close(); aviso('Não abriu: ' + er.message); } else if (w) w.location = s.signedUrl;
  });
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    const d = data.find(x => String(x.id) === b.dataset.rm); if (!d) return;
    if (CONFIRMA !== 'doc' + d.id) { CONFIRMA = 'doc' + d.id; b.textContent = 'confirmar'; return; }
    CONFIRMA = null;
    await sb.storage.from('documentos').remove([d.arquivo_path]);
    const { error: er } = await sb.from('documentos').delete().eq('id', d.id);
    if (er) aviso('Não excluiu: ' + er.message); else { aviso('Documento excluído.'); fiDocs(el, c); }
  });
}

/* ---------- tarefas da Gestão: implantação, cartões e rotina mensal ---------- */
const GT_SQL = 'Rode o 36-tarefas-da-gestao.sql no Supabase para ativar as tarefas.';
const tarefasDe = (cid) => (D.gtar || []).filter(t => String(t.cliente_id) === String(cid)).sort((a, b) => a.ordem - b.ordem || a.id - b.id);
const diaHoje = () => new Date().getDate();
function saldosDoDia() {
  return (D.clientes || []).filter(c => c.dia_saldos && diaHoje() >= c.dia_saldos && !cicloCliente(c).saldos);
}
function tarefasParaHoje() {
  return (D.gtar || []).filter(t => !t.feito && t.prazo && diasPara(t.prazo) <= 0 && D.clientes.some(c => String(c.id) === String(t.cliente_id)))
    .sort((a, b) => String(a.prazo).localeCompare(String(b.prazo)));
}
function implantacoesAbertas() {
  return (D.clientes || []).map(c => { const L = tarefasDe(c.id); return { c, total: L.length, feitas: L.filter(t => t.feito).length }; })
    .filter(x => x.total && x.feitas < x.total);
}
function htmlTarefasHoje() {
  const sd = saldosDoDia(), th = tarefasParaHoje();
  const s = sd.map(c => `<article class="card" style="margin-bottom:8px">
      <div class="cab"><div><div class="nome">${esc(c.nome_completo)}</div><span class="tag ${diaHoje() === c.dia_saldos ? 'ouro' : 'alerta'}">${diaHoje() === c.dia_saldos ? 'hoje é o dia dos saldos' : 'saldos atrasados'}</span></div><span class="quando">todo dia ${c.dia_saldos}</span></div>
      <div class="acoes"><button class="zap" data-ficha="${c.id}" data-fa="carteira">Atualizar saldos</button></div></article>`).join('');
  const t = th.map(x => { const dv = diasPara(x.prazo); return `<article class="card" style="margin-bottom:8px">
      <div class="cab"><div><div class="nome">${esc(nomeCli(x.cliente_id))}</div><span class="tag ${dv < 0 ? 'alerta' : 'ouro'}">${dv < 0 ? 'atrasada desde ' + dataCurta(dia(x.prazo)) : 'para hoje'}</span>${x.grupo === 'cliente' ? ' <span class="tag">cobrar do cliente</span>' : ''}</div></div>
      <div class="info"><div>${esc(x.titulo)}</div></div>
      <div class="acoes"><button class="zap" data-gt-ok="${x.id}">Feito</button><button class="sec" data-ficha="${x.cliente_id}" data-fa="tarefas">Abrir tarefas</button></div></article>`; }).join('');
  return s + t;
}
async function gtMarcar(id, feito) {
  const upd = { feito, feito_em: feito ? new Date().toISOString() : null, feito_por: feito ? (D.meuId || null) : null };
  const { error } = await sb.from('gestao_tarefas').update(upd).eq('id', id);
  if (error) { aviso(/gestao_tarefas/.test(error.message) ? tec(GT_SQL) : 'Não salvou: ' + error.message); return false; }
  const t = (D.gtar || []).find(x => String(x.id) === String(id)); if (t) Object.assign(t, upd);
  return true;
}
async function gtMarcarChave(c, chave) {
  const t = tarefasDe(c.id).find(x => x.chave === chave && !x.feito);
  if (t) await gtMarcar(t.id, true);
}
async function gtRecarregar(c) {
  const { data, error } = await sb.from('gestao_tarefas').select('*').eq('cliente_id', c.id);
  if (error) return false;
  D.gtar = (D.gtar || []).filter(t => String(t.cliente_id) !== String(c.id)).concat(data || []);
  return true;
}
const dtLocal = (ts) => { if (!ts) return ''; const d = new Date(ts); const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
function textoPreOnboard(c, modelo) {
  const nome = String(c.nome_completo || '').split(' ')[0] || 'tudo bem';
  const quando = c.onboard_data ? new Date(c.onboard_data).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }) + ', às ' + new Date(c.onboard_data).toTimeString().slice(0, 5) : '';
  return String(modelo || '').split('\n').filter(l => quando || !l.includes('{data_onboard}')).join('\n')
    .replace(/\{nome\}/g, nome).replace(/\{data_onboard\}/g, quando).replace(/\n{3,}/g, '\n\n').trim();
}

      <section class="bloco"><h2>Reunião de onboard</h2>
        ${c.onboard_data ? `<div class="lin" style="border-top:0"><span>Marcada para</span><span>${dataHora(c.onboard_data)}</span></div>` : '<div class="sub" style="margin-top:0">Ainda sem data. Com a data, as tarefas do cliente ganham prazo na véspera.</div>'}
        <label class="fl"><span>${c.onboard_data ? 'Mudar a data' : 'Data e hora do onboard'}</span><input type="datetime-local" id="gtOnb" value="${esc(dtLocal(c.onboard_data))}"></label>
        <button class="sec" id="gtOnbOk" style="margin-top:8px;width:100%">Salvar data do onboard</button></section>
      <div class="secao">Antes do onboard · com o cliente</div>
      <div class="bloco" style="margin-top:0">${cli.map(ck).join('') || '<div class="vazio">Nenhuma tarefa do cliente.</div>'}</div>

        ${campo('gt_titulo', 'Tarefa', '', 'text', 'placeholder="Ex.: enviar acesso ao painel"')}

        ${campo('gt_prazo', 'Prazo (opcional)', '', 'date')}

function htmlClarity(dias) {
  const cab = '<div class="secao">Comportamento das visitas (Clarity) <a href="https://clarity.microsoft.com/projects/view/ypnuw0ek2m/dashboard" target="_blank" rel="noopener">Abrir ›</a></div>';
