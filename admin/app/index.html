<style>

.gsec{background:var(--branco);border:1px solid var(--linha);padding:0 14px;margin-top:10px}.gsec>summary{padding:13px 0;cursor:pointer;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}.gsec>summary::-webkit-details-marker{display:none}.gsec>summary::after{content:'›';color:var(--tinta-3);transition:transform .15s}.gsec[open]>summary::after{transform:rotate(90deg)}.gsec[open]{padding-bottom:14px}.gsec>summary small{display:block;font-size:14px;color:var(--tinta-3)}.gsec .bloco{border:0;padding:0;margin-top:0}
.gtr{background:var(--branco);border:1px solid var(--linha);padding:14px 10px 12px;margin-top:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:14px}.gtr div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}.gtr i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;background:#efe9dc;color:var(--tinta-3)}.gtr i.f{background:var(--dourado);color:#fff}.gtr i.f.pv{background:var(--verde)}.gtr i.a{background:#fff;color:var(--dourado);box-shadow:0 0 0 2px var(--dourado)}.gtr i.a.pv{color:var(--verde);box-shadow:0 0 0 2px var(--verde)}.gtr i.x{background:var(--alerta);color:#fff}.gtr span{font-size:14px;line-height:1.2;color:var(--tinta-3)}.gtr span.on{color:var(--tinta);font-weight:500}.gtr small{font-size:14px;color:var(--tinta-3);line-height:1.2;min-height:12px}
.gagora{background:var(--verde);color:var(--creme);padding:16px;margin-top:10px;display:flex;flex-direction:column;gap:8px}.gagora .r{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--dourado-claro);font-weight:600}.gagora .t{font-family:'Cormorant Garamond',serif;font-size:22px;line-height:1.15}.gagora .d{font-size:14px;color:rgba(249,246,241,.85)}.gagora .b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}.gagora .b>*{display:block;text-align:center;text-decoration:none;font:inherit;font-size:14px;padding:12px 8px;cursor:pointer}.gagora .b .p{background:var(--dourado);color:#fff;border:0;font-weight:600}.gagora .b .s{background:transparent;color:var(--creme);border:1px solid rgba(201,169,110,.6)}.gagora .b>*:only-child{grid-column:1/-1}
.glib{display:flex;flex-direction:column;margin-top:2px}.glib>div{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(201,169,110,.3)}.glib>div:first-child{border-top:0;padding-top:4px}.glib i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(201,169,110,.7);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:var(--dourado-claro)}.glib i.ok{background:var(--dourado);border-color:var(--dourado);color:#fff}.glib .x{flex:1;min-width:0}.glib b{display:block;font-weight:600;font-size:14px;color:var(--creme)}.glib small{display:block;font-size:14px;color:rgba(249,246,241,.8);margin-top:2px}.glib .ac{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.glib .ac button,.glib .ac a{font:inherit;font-size:14px;padding:8px 10px;cursor:pointer;background:transparent;color:var(--creme);border:1px solid rgba(201,169,110,.6);text-decoration:none}.glib .ac .p{background:var(--dourado);border-color:var(--dourado);color:#fff;font-weight:600}.glib input{width:100%;margin-top:6px;padding:9px 10px;font:inherit;font-size:14px;border:1px solid rgba(201,169,110,.6);background:rgba(255,255,255,.95);color:var(--tinta)}.pular{display:block;width:100%;margin-top:14px;-webkit-appearance:none;appearance:none;-webkit-user-select:none;user-select:none;background:transparent;border:1px solid rgba(249,246,241,.55);border-radius:0;color:var(--creme);font:inherit;font-size:14px;line-height:1.35;padding:11px 14px;cursor:pointer;text-align:center}

.gjseg{display:flex;border:1px solid var(--linha);background:var(--branco);margin-top:12px}.gjseg button{flex:1;background:none;border:0;padding:10px 4px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--tinta-2)}.gjseg button.on{background:var(--verde);color:var(--creme)}
.gjres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.gjres button{background:var(--branco);border:1px solid var(--linha);padding:10px 12px;text-align:left;cursor:pointer;font:inherit}.gjres .l{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}.gjres .bs{display:flex;gap:3px;margin-top:8px}.gjres .bs i{flex:1;height:8px;background:#efe9dc}.gjres .d{font-size:14px;color:var(--tinta-2);margin-top:6px}
.gjchips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.gjchips::-webkit-scrollbar{display:none}.gjchips button{white-space:nowrap;border-radius:20px;padding:8px 12px;font-size:14px;background:var(--branco);color:var(--tinta-2);border:1px solid var(--linha);cursor:pointer}.gjchips button b{font-weight:600;margin-left:3px}
.gj{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity;scroll-padding-left:16px;align-items:flex-start}.gj::-webkit-scrollbar{height:5px}.gj::-webkit-scrollbar-thumb{background:var(--dourado);border-radius:3px}.gjc{flex:0 0 236px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}.gjc h3{display:flex;justify-content:space-between;font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:0 2px;margin:0}.gjc h3 small{font-size:14px;letter-spacing:0;color:var(--tinta-3);font-weight:400}.gjc .ln{height:3px}.gjk{background:var(--branco);border:1px solid var(--linha);padding:11px 12px;display:flex;flex-direction:column;gap:5px;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}.gjk .n{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--verde);line-height:1.15}.gjk .s{align-self:flex-start;font-size:14px;letter-spacing:.04em;padding:2px 8px;border-radius:10px;background:#f2ece1;color:#6b5320}.gjk .s.al{background:#f6e7dc;color:var(--alerta)}.gjk .s.ok{background:#e3ece5;color:var(--verde)}.gjk .p{font-size:14px;color:var(--tinta-2)}.gjk .q{font-size:14px;color:var(--tinta-3);border-top:1px solid var(--linha);padding-top:5px}

button[data-pg],button[data-desf],button[data-cfdesf],button[data-avgok]{min-height:40px;padding:8px 14px!important;font-size:14px!important}

/* ============ computador (1024px ou mais) ============
   Só visual: nenhuma função muda. O celular e o tablet continuam exatamente como estão.
   Menu de baixo vira menu lateral fixo; o conteúdo usa a largura da tela até 1280px. */
@media (min-width:1024px){
  :root{--lado:232px;--topo-h:58px;--conteudo:1280px}
  /* menu lateral */
  .nav{top:var(--topo-h);right:auto;bottom:0;width:var(--lado);flex-direction:column;gap:2px;padding:18px 12px;border-top:0;border-right:1px solid var(--linha);overflow-y:auto}
  .nav button,.nav.seis button{flex:none;height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;font-size:14px;letter-spacing:.02em;border-radius:6px}
  .nav button:hover{background:var(--creme)}
  .nav button.on{background:var(--creme-2)}
  .nav button.on::before{top:10px;bottom:10px;left:0;right:auto;width:3px;height:auto;border-radius:0 2px 2px 0}
  .nav svg{width:20px;height:20px;flex:none}
  .nav .bola{top:50%;left:auto;right:12px;transform:translateY(-50%)}
  /* conteúdo ao lado do menu, centralizado no espaço que sobra */
  .pagina{margin:0 0 0 calc(var(--lado) + max(0px, (100% - var(--lado) - var(--conteudo)) / 2));max-width:var(--conteudo);padding:28px 40px 56px}
  body.com-fab .pagina{padding-bottom:110px}
  .faixa-push{max-width:calc(var(--conteudo) - 80px);margin:16px 0 0 calc(var(--lado) + 40px + max(0px, (100% - var(--lado) - var(--conteudo)) / 2))}
  /* quem não tem menu (acesso só ao Marketing) usa a tela inteira, centralizada */
  #app:has(> .nav[hidden]) .pagina{margin-left:auto;margin-right:auto}
  #app:has(> .nav[hidden]) .faixa-push{margin-left:auto;margin-right:auto}
  #app:has(> .nav[hidden]) .aviso,#app:has(> .nav[hidden]) ~ .aviso{left:50%}
  .titulo{font-size:36px}
  .fab{right:32px;bottom:32px}
  .aviso{bottom:28px;left:calc(50% + var(--lado) / 2)}
  #faixaVersao{left:calc(var(--lado) + 24px)!important;right:auto!important;bottom:24px!important;max-width:560px}
  /* folhas que sobem de baixo viram janelas no centro */
  .folha-caixa{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(640px,92vw);max-height:84vh;border-radius:12px;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.22)}
  .folha-caixa.busca-caixa{top:84px;transform:translateX(-50%);width:min(720px,92vw);padding-top:20px}
  /* números e indicadores com mais colunas */
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpis.k3{grid-template-columns:repeat(3,1fr)}
  .gatalhos{grid-template-columns:repeat(4,1fr)}
  .numeros .num .v{font-size:36px}
  /* listas de cartões em duas colunas (as emissões ficam em uma, porque cada card tem a linha de checks logo abaixo) */
  .lista:not(:has(> .emchk)){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
  .lista > .vazio{grid-column:1/-1}
  /* kanban: todas as etapas lado a lado, sem precisar deslizar */
  .kanban{margin:0;padding:2px 0 10px;scroll-snap-type:none}
  .kcol{flex:1 1 0;min-width:210px;max-width:none}
  .gj{margin:0;padding:12px 0 6px}
  .gjc{flex:1 1 220px}
  .prazo-col{flex:1 1 0}
  /* formulários em duas colunas: campos simples lado a lado; títulos, textos longos e caixas ocupam a linha toda */
  .pagina form.form:not(.card){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;align-items:end}
  .pagina form.form:not(.card) > *{grid-column:1/-1}
  .pagina form.form:not(.card) > .fl:not(:has(textarea)){grid-column:auto}
  /* início: duas colunas (o que pede ação à esquerda, números e agenda à direita) */
  .ini-grade{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0 40px;align-items:start}
  .ini-grade .numeros{grid-template-columns:1fr 1fr}
  /* mais: grupos em duas colunas */
  .mais-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px;align-items:start}
  /* cotação rápida: prévia da imagem fixa ao lado do formulário */
  .pagina:has(> #rpPrevia){display:grid;grid-template-columns:minmax(0,1fr) 400px;column-gap:40px;align-content:start}
  .pagina:has(> #rpPrevia) > *{grid-column:1}
  .pagina:has(> #rpPrevia) > #rpPrevia{grid-column:2;grid-row:1 / span 40;align-self:start;position:sticky;top:calc(var(--topo-h) + 20px);margin-top:0!important}
}
/* >>> leitura-computador
   Leitura no computador (1024px ou mais): escala de fontes do CLAUDE.md (13, 16, 18, 22, 28, 36).
   Nada abaixo de 13px; texto, campos, linhas de lista e menu com 16px; rótulos em caixa alta com 13px e espaçamento menor.
   As regras de fonte abaixo repetem, na mesma ordem, cada regra de fonte do app (daqui e do CSS dos módulos calendário,
   indicações, marketing e aeroportos), já no tamanho da escala. O :root na frente só garante que elas valem no computador

/* ===== Base visual (13/11/2026) =====
   Escala: 14, 16, 18, 22, 28 e 36 px; nada abaixo de 14. Botões em letra normal. Um canto só: 12 px em caixas,
   botões e campos; chips e etiquetas redondos. Caixa alta só nos rótulos de seção. */
body{font-size:16px}
button,select,textarea,input{font-size:16px}
/* letra escrita direto no elemento (style="font-size:..."), dentro do app: nada abaixo de 14 */
#pagina [style*="font-size:9px"],#pagina [style*="font-size:9.5px"],#pagina [style*="font-size:10px"],#pagina [style*="font-size:10.5px"],
#pagina [style*="font-size:11px"],#pagina [style*="font-size:11.5px"],#pagina [style*="font-size:12px"],#pagina [style*="font-size:12.5px"],
#pagina [style*="font-size:13px"],#pagina [style*="font-size:13.5px"],#pagina [style*="font-size: 12px"],#pagina [style*="font-size: 13px"],
.folha [style*="font-size:11px"],.folha [style*="font-size:12px"],.folha [style*="font-size:12.5px"],.folha [style*="font-size:13px"],.folha [style*="font-size:13.5px"]{font-size:14px!important}
/* botões: letra normal, 16 px */
.zap,.sec,.btn{text-transform:none;letter-spacing:.02em;font-size:16px;border-radius:12px;padding:13px 16px;min-height:48px}
.zap.grande,.sec.grande{font-size:16px;padding:15px}
.seg{border-radius:12px;overflow:hidden}
.seg button,.gjseg button,.kc .mv button,.obs button,.resq button{text-transform:none;letter-spacing:.01em;font-size:14px}
.seg button{min-height:44px}
/* etiquetas e chips redondos, sem caixa alta */
.tag{text-transform:none;letter-spacing:.01em;font-size:14px;border-radius:999px;padding:2px 10px}
.chips button{border-radius:999px;font-size:14px;min-height:40px}
.num .l,.gjres .l,.lint .l,.canal .ok,.gt .dono,.toque,.ag-cm .h{text-transform:none;letter-spacing:.01em}
/* caixas e campos com o mesmo canto */
.bloco,.card,.num,.pend,.cli,.ev,.kc,.busca,.lista>*,.ac-lista,.icone{border-radius:12px}
.pend,.bloco,.card{overflow:hidden}
.kcol{border-radius:12px}
.fl input,.fl select,.fl textarea,.busca{border-radius:12px;min-height:48px}
.fl textarea{min-height:96px}
.icone{border-radius:10px}
.aviso{border-radius:12px;font-size:16px}
.folha-caixa{border-radius:18px 18px 0 0}
.folha-item{border-radius:12px;font-size:16px}
.folha-item small{font-size:14px}
.mesnav,.gatalhos button,details.gsec,.ev .ck,.kc .mv button,.emchk,.emchk button,.kpi,details.kalerta,.gjres button,.gjk,.gsec .ciclo,.resq button,.mini,.calc section.ent,.ind-conf{border-radius:12px}
.gjseg,.resq{border-radius:12px;overflow:hidden}
.gjseg button,.resq button{border-radius:0}
#pagina input:not([type=checkbox]):not([type=radio]):not([type=range]),#pagina select,#pagina textarea,.folha input,.folha select{border-radius:12px}
/* calendário do mês no celular: cada compromisso vira uma barrinha colorida; o texto aparece ao tocar no dia */
@media (max-width:640px){.ag-chip,.cal-chip{font-size:0!important;height:6px;min-height:0;padding:0!important;margin-top:3px;border-radius:3px;box-shadow:none!important}.cal-mais{font-size:14px}}
/* topo: o nome da tela cabe numa linha */
.topo>div:not(.acoes){min-width:0}
.topo .n,.topo .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.08em}

/* ===== Navegação (13/11/2026) ===== */
.mais-busca{display:flex;align-items:center;gap:10px;background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:0 14px;margin-top:12px;min-height:50px}
.mais-busca:focus-within{border-color:var(--verde)}
.mais-busca span{color:var(--tinta-3);font-size:18px}
.mais-busca input{flex:1;border:0;background:none;outline:none;font-size:16px;padding:12px 0;min-width:0}
.mais-n{font-style:normal;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--alerta);min-width:20px;text-align:right}
.novo-topo{display:none}
/* menu: no celular só os 5 principais; no computador, todas as áreas */
.nav .nx,.nav .ng,.nav .nbusca{display:none}
@media (min-width:1024px){
  .fab{display:none!important}
  .novo-topo:not([hidden]){display:inline-flex;align-items:center;background:var(--dourado-claro);color:var(--verde);border:0;border-radius:10px;padding:0 14px;height:38px;font-size:16px;font-weight:500;cursor:pointer;margin-right:4px}
  .nav button[data-t="mais"]{display:none}
  .nav .nbusca{display:flex;align-items:center;gap:8px;height:42px;margin:0 0 10px;padding:0 12px;border:1px solid var(--linha);border-radius:10px;background:var(--creme);color:var(--tinta-3);font-size:16px;flex:none;cursor:pointer}
  .nav .ng{display:flex;justify-content:space-between;align-items:center;flex:none;height:auto;text-align:left;white-space:nowrap;background:none;border:0;margin:14px 0 2px;padding:4px 14px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--dourado);cursor:pointer}
  .nav .ng::after{content:'⌄';font-size:14px;color:var(--tinta-3)}
  .nav .ng.fechado::after{content:'›'}
  .nav .nx:not([hidden]){display:flex;align-items:center;justify-content:space-between;flex:none;height:auto;min-height:40px;padding:8px 14px;line-height:1.3;border:0;border-radius:8px;background:none;font-size:16px;color:var(--tinta-2);cursor:pointer;text-align:left;letter-spacing:0}
  .nav .nx:hover{background:var(--creme)}
  .nav .nx.on{background:var(--creme-2);color:var(--verde);font-weight:600}
  .nav .nx .mais-n{font-size:18px}
}

/* ===== Card do Comercial em leitura (13/11/2026) ===== */
.cb-etapa{display:inline-block;background:var(--creme-2);color:var(--verde);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:500;margin:10px 0 10px}
.cbr{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:8px 14px;margin-bottom:12px}
.cbr-l{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--linha);font-size:16px}
.cbr-l:first-child{border-top:0}
.cbr-l>span:first-child{color:var(--tinta-3);font-size:14px;flex:none;padding-top:2px}
.cbr-l>span:last-child{text-align:right}
.cbr-l .alerta,.cbr-l>span.alerta{color:var(--alerta)}
.cb-olho{display:block;margin:4px 0 4px auto;background:none;border:0;color:var(--dourado);font-size:14px;text-decoration:underline;cursor:pointer;padding:4px 0}
body.sem-valores .cb-valor{color:transparent!important;text-shadow:0 0 9px rgba(43,43,38,.45);user-select:none}
.cb-txts{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 20px;margin:12px 0 4px}
.cb-txts button,.cb-txts a{background:none;border:0;color:var(--dourado);font-size:16px;text-decoration:underline;cursor:pointer;padding:6px 0}
.cb{background:var(--branco);border:1px solid var(--linha);border-radius:12px;margin-top:8px}
.cb-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px}
.cb-h b{display:block;font-weight:500;font-size:16px;color:var(--verde)}
.cb-h small{display:block;font-size:14px;color:var(--tinta-3);margin-top:2px}
.cb-ed{flex:none;background:none;border:1px solid var(--linha);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--dourado);cursor:pointer}
.cb-corpo{display:none;padding:0 14px 14px}
.cb.aberto .cb-corpo{display:block}
.cb.aberto{background:#fffdf7}
.cb-corpo>.grupo:first-child{display:none}

<script>
// Sugestões ao digitar: todo campo com lista (clientes, comprador, fornecedor, programas...)
// mostra uma caixa logo abaixo com os nomes cadastrados que batem com o que foi digitado.
// Toque em um nome para escolher (escolha única).
(() => {
  const tira = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let caixa = null, alvo = null, itens = [], ativo = -1;
  const fechar = () => { if (caixa) caixa.remove(); caixa = null; ativo = -1; };
  const opcoes = inp => {
    const id = inp.dataset.lista || inp.getAttribute('list');
    const dl = id && document.getElementById(id);
    return dl ? [...new Set([...dl.options].map(o => o.value).filter(Boolean))] : [];
  };
  const prepara = inp => {
    if (inp.dataset.lista || !inp.getAttribute('list')) return;
    inp.dataset.lista = inp.getAttribute('list');
    inp.removeAttribute('list'); // tira a sugestão nativa do teclado para não duplicar
    inp.setAttribute('autocomplete', 'off');
  };
  const escolher = v => {
    if (!alvo) return;
    alvo.value = v;
    alvo.dispatchEvent(new Event('input', { bubbles: true }));
    alvo.dispatchEvent(new Event('change', { bubbles: true }));
    fechar();
  };
  const mostrar = inp => {
    const q = tira(inp.value);
    if (!q) return fechar();
    const lista = opcoes(inp).map(v => ({ v, t: tira(v) })).filter(o => o.t.includes(q) && o.t !== q);
    lista.sort((a, b) => {
      const pa = a.t.startsWith(q) ? 0 : a.t.split(/\s+/).some(w => w.startsWith(q)) ? 1 : 2;
      const pb = b.t.startsWith(q) ? 0 : b.t.split(/\s+/).some(w => w.startsWith(q)) ? 1 : 2;
      return pa - pb || a.v.localeCompare(b.v, 'pt-BR');
    });
    itens = lista.slice(0, 30).map(o => o.v);
    if (!itens.length) return fechar();
    if (!caixa) { caixa = document.createElement('div'); caixa.className = 'sug'; document.body.appendChild(caixa); }
    alvo = inp; ativo = -1;
    caixa.innerHTML = itens.map((v, i) => {
      const k = tira(v).indexOf(q);
      const h = k < 0 ? esc(v) : esc(v.slice(0, k)) + '<b>' + esc(v.slice(k, k + q.length)) + '</b>' + esc(v.slice(k + q.length));
      return `<button type="button" data-i="${i}">${h}</button>`;
    }).join('');
    const r = inp.getBoundingClientRect();
    caixa.style.left = (r.left + window.scrollX) + 'px';
    caixa.style.top = (r.bottom + window.scrollY) + 'px';
    caixa.style.width = r.width + 'px';
    // dentro de folhas com rolagem própria, posiciona como fixo
    const fixo = inp.closest('.folha,.folha-caixa,[style*="position:fixed"]');
    if (fixo) { caixa.style.position = 'fixed'; caixa.style.left = r.left + 'px'; caixa.style.top = r.bottom + 'px'; }
    else caixa.style.position = 'absolute';
  };
  document.addEventListener('focusin', e => { const t = e.target; if (t.tagName === 'INPUT' && (t.dataset.lista || t.getAttribute('list'))) { prepara(t); if (t.value) mostrar(t); } });
  document.addEventListener('input', e => { const t = e.target; if (t.tagName === 'INPUT' && t.dataset.lista && t === document.activeElement) mostrar(t); });
  // pointerdown antes do blur, para o toque na opção não se perder
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest('.sug button');
    if (b) { e.preventDefault(); escolher(itens[+b.dataset.i]); return; }
    if (caixa && !e.target.closest('.sug') && e.target !== alvo) fechar();
  }, true);
  document.addEventListener('keydown', e => {
    if (!caixa || e.target !== alvo) return;
    const bs = caixa.querySelectorAll('button');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); ativo = (ativo + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length;
      bs.forEach((b, i) => b.classList.toggle('ativo', i === ativo)); bs[ativo].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && ativo >= 0) { e.preventDefault(); escolher(itens[ativo]); }
    else if (e.key === 'Escape') fechar();
  });
  document.addEventListener('focusout', e => { if (e.target === alvo) setTimeout(() => { if (document.activeElement !== alvo) fechar(); }, 150); });
  document.addEventListener('scroll', e => { if (caixa && alvo && !caixa.contains(e.target)) mostrar(alvo); }, true);
  window.addEventListener('resize', () => { if (caixa && alvo) mostrar(alvo); });
})();
</script>

// a etapa do Comercial com mais cards parados há mais de 2 dias (só cards em andamento, fora da Gestão)
function gargaloComercial() {
  const lim = Date.now() - 2 * 864e5, cont = {};
  D.reunioes.filter(r => r.resultado === 'Em andamento' && !ehGestao(r)).forEach(r => { const et = etapaDe(r); if (new Date(r.etapa_desde || r.created_at || r.data) < lim) cont[et] = (cont[et] || 0) + 1; });
  const [etapa, n] = Object.entries(cont).sort((a, b) => b[1] - a[1])[0] || [];

}

function blocoMesInicio(m, mesTxt) {

  return `<div class="sub" style="margin-top:8px">Lançamentos vêm da planilha. Última sincronização: ${u}.</div>${alertas.length ? `<div class="config" style="margin-top:8px">${alertas.join('<br>')}</div>` : ''}`;
}

/* cálculo igual ao do banco (método 1 por padrão) */
const temManual = (x) => x != null && x !== '';
const tec = (m) => ADMIN ? m : (String(m).trim().startsWith('<') ? '<div class="config" style="margin-top:12px">Recurso ainda não ativado. Fale com o administrador.</div>' : 'Recurso ainda não ativado. Fale com o administrador.');
const pctPadraoVend = (id) => +((D.equipe.find(x => x.user_id === id) || {}).comissao_pct || 0);
const pctPadraoParc = (id) => +((D.parceirosAdm.find(x => x.id === id) || {}).pct || 0);
const nomeParc = (id) => ((D.parceirosAdm.find(x => x.id === id) || D.parc.find(x => x.id === id) || {}).nome || '');
function calcular(v) {
  const t = Number((D.cfg && D.cfg.imposto_pct) ?? 6) / 100;
  const custo = Math.round(((+v.milhas || 0) * (+v.milheiro || 0) / 1000 + (+v.taxas || 0)) * 100) / 100;
  const m = (+v.valor_receber || 0) - custo;
  const cp = (+v.comissao_pct || 0) / 100, pp = (+v.parceiro_pct || 0) / 100;
  const r2 = (x) => Math.round(x * 100) / 100;
  let imposto, comissao, repasse;
  if (D.cfg && D.cfg.comissao_desconta_imposto) {
    const iref = Math.max(m, 0) * t;
    comissao = r2(temManual(v.comissao_manual) && !v.pct_app ? +v.comissao_manual : Math.max(m - iref, 0) * cp);
    repasse = r2(temManual(v.repasse_manual) && !v.ppct_app ? +v.repasse_manual : Math.max(m - iref - comissao, 0) * pp);
    imposto = r2(Math.max(m - comissao - repasse, 0) * t);
  } else {
    imposto = r2(Math.max(m, 0) * t);
    comissao = r2(temManual(v.comissao_manual) && !v.pct_app ? +v.comissao_manual : Math.max(m - imposto, 0) * cp);
    repasse = r2(temManual(v.repasse_manual) && !v.ppct_app ? +v.repasse_manual : Math.max(m - imposto - comissao, 0) * pp);
  }
  return { custo, lucro_bruto: r2(m), imposto, comissao, repasse, lucro_liquido: r2(m - imposto - comissao - repasse) };
}

/* ---------- PDF da nota fiscal (bucket privado "notas") ---------- */
async function notaBaixar(e) {
  const { data, error } = await sb.storage.from('notas').createSignedUrl(e.nota_arquivo, 300, { download: 'Nota fiscal - ' + (e.comprador || 'venda') + '.' + (String(e.nota_arquivo).split('.').pop() || 'pdf') });
  if (error) { aviso('Não abriu a nota: ' + error.message); return; }
  location.href = data.signedUrl;
}
function notaAnexar(e, depois) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/pdf,.pdf,.xml';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    if (file.size > 10 * 1024 * 1024) { aviso('Arquivo acima de 10 MB.'); return; }
    aviso('Enviando a nota...');
    const ext = /\.xml$/i.test(file.name) ? 'xml' : 'pdf';
    const path = e.id + '/' + Date.now() + '.' + ext;
    const up = await sb.storage.from('notas').upload(path, file, { contentType: ext === 'xml' ? 'text/xml' : 'application/pdf', upsert: false });
    if (up.error) { aviso('Não enviou: ' + up.error.message + (/bucket/i.test(up.error.message) ? ' (rode o notas-e-datas.sql)' : '')); return; }
    const antigo = e.nota_arquivo;
    const { error } = await sb.from('emissoes').update({ nota_arquivo: path, nota_gerada: true }).eq('id', e.id);
    if (error) { await sb.storage.from('notas').remove([path]); aviso('Não salvou: ' + error.message + (/nota_arquivo/.test(error.message) ? ' (rode o notas-e-datas.sql)' : '')); return; }
    if (antigo) await sb.storage.from('notas').remove([antigo]);
    e.nota_arquivo = path; e.nota_gerada = true; aviso('Nota anexada e marcada como emitida.'); if (depois) depois();
  };
  inp.click();
}

        if (!row.closer_id) { $('msgRe').textContent = 'Escolha o closer que fará o diagnóstico.'; return; }
      }
      if (etN === 'Qualificação' && !row.sdr_id) row.sdr_id = D.meuId;
      if (etN === 'Reunião de proposta' && mudou && !g('mg_prop')) { $('msgRe').textContent = 'Informe a data e a hora da reunião de proposta.'; return; }
      if (etN === 'Reunião de proposta' && g('mg_valor')) row.valor_estimado = n2(g('mg_valor'));
      // diagnóstico e reunião de proposta: o retorno fica na data da reunião (no dia seguinte, vira o retorno pós-reunião)
      if (etN === 'Diagnóstico agendado' && g('mg_diag') && PASSO_REUNIAO.includes(row.proximo_passo_tipo)) row.proximo_passo_data = isoLocal(new Date(g('mg_diag')));
      if (etN === 'Reunião de proposta' && g('mg_prop') && PASSO_REUNIAO.includes(row.proximo_passo_tipo)) row.proximo_passo_data = isoLocal(new Date(g('mg_prop')));
      if (etN === 'Follow-up') {
        if (!g('mg_fup')) { $('msgRe').textContent = 'Escolha quando chamar o cliente de novo (3, 7, 15 dias, 1, 3 ou 6 meses, ou uma data).'; const c = $('fupChips'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
        row.proximo_passo_data = g('mg_fup'); row.proximo_passo_tipo = 'follow_up'; row.proximo_passo = 'Follow-up' + (g('mg_fupnota') ? ': ' + g('mg_fupnota') : '');
        const M = { ...(base.marcos || {}) }, ant = M['Follow-up'] || {}, hist = (ant.hist || []).concat([{ em: new Date().toISOString(), por: D.meuId, retorno: g('mg_fup'), nota: g('mg_fupnota') || null }]);
        M['Follow-up'] = { ...ant, em: ant.em || new Date().toISOString(), por: ant.por || D.meuId, nota: g('mg_fupnota') || null, retorno: g('mg_fup'), hist }; row.marcos = M;
      }
      if (g('mg_em') && etN !== 'Follow-up') { const M = { ...(base.marcos || {}) }, ant = M[etN] || {}; M[etN] = { ...ant, em: new Date(g('mg_em')).toISOString(), por: ant.por || D.meuId, ...(etN === 'Reunião de proposta' ? { cond: g('mg_cond') || null, pauta: g('mg_pauta') || null } : {}) }; row.marcos = M; }
    }
    if (res === 'Em andamento') registrarAdiamento(base, row, et);
    $('salvarRe').disabled = true; $('msgRe').textContent = 'Salvando...';
    if (!row.pessoa_id) {
      // antes de criar: a pessoa já tem ficha (CPF, celular, e-mail ou nome parecido)? liga com um toque
      const ja = VENDA.acharPessoa(D, { nome: g('cliente'), contato: g('contato') });
      if (ja && confirm(`Já existe a ficha de ${ja.nome}${ja.celular ? ' (' + ja.celular + ')' : ''}. É esta pessoa?\n\nOK: usar esta ficha. Cancelar: criar uma ficha nova.`)) { row.pessoa_id = ja.id; f.elements.pessoa_id.value = ja.id; }
    }
    if (!row.pessoa_id) {
      // cliente novo: cria a ficha no CRM antes de salvar o atendimento
      const ct = g('contato'), ehMail = /@/.test(ct);
      const pn = await sb.from('pessoas').insert({ nome: g('cliente').replace(/\s+/g, ' '), celular: !ehMail && ct ? ct : null, email: ehMail ? ct : (g('cn_email') || null), nascimento: g('cn_nasc') || null, papeis: [], interesse: [G ? 'gestao' : 'viagens'], origem: g('origem') || null, ...(oriRe.v || {}) }).select().single();
      if (pn.error) falhas.push('O atendimento será salvo, mas a ficha do cliente não foi criada: ' + pn.error.message);
      else { (D.pessoas = D.pessoas || []).push(pn.data); row.pessoa_id = pn.data.id; f.elements.pessoa_id.value = pn.data.id; }
    } else if (oriRe.v) {
      // cliente com ficha e sem origem: a origem escolhida aqui vai para a ficha (primeira marcação)
      const pf = (D.pessoas || []).find(x => x.id === row.pessoa_id);
      if (pf && !pf.origem_canal) { const ro = await IND.gravarOrigem(ctxIND(), pf.id, oriRe.v); if (ro.erro) falhas.push('A origem não foi salva na ficha: ' + ro.erro); }
    }
    if (nova && G && row.pessoa_id) {
      const ja = D.reunioes.find(x => ehGestao(x) && x.pessoa_id === row.pessoa_id && ['Em andamento', 'Fechou'].includes(x.resultado));
      if (ja && confirm(`${ja.cliente} já tem um card da Gestão (${ja.resultado === 'Fechou' ? 'fechado' : etapaDe(ja)}).\n\nOK: abrir o card que já existe. Cancelar: criar outro mesmo assim.`)) { $('salvarRe').disabled = false; $('msgRe').textContent = ''; SUJO = false; abrirAtendimento(ja.id); return; }
    }
    const q = nova ? sb.from('atendimentos').insert(row).select().single() : sb.from('atendimentos').update(row).eq('id', base.id).select().single();
    const { data, error } = await q;
    $('salvarRe').disabled = false;
    if (error) { $('msgRe').textContent = limparTec('Não salvou: ' + error.message); return; }
    const i = D.reunioes.findIndex(x => x.id === data.id); if (i >= 0) D.reunioes[i] = data; else D.reunioes.unshift(data);
    // Gestão: reunião de proposta entra na agenda; Fechou ou Não fechou marca a reunião como realizada, com o resumo
    if (G && D.agenda && (g('mg_prop') || ((data.resultado === 'Fechou' || data.resultado === 'Não fechou') && g('mg_resprop')))) {
      const ap = agProp(data), part = [data.closer_id || data.responsavel_id || D.meuId];
      const q3 = g('mg_prop') && data.resultado === 'Em andamento'
        ? (ap ? sb.from('agenda_reunioes').update({ data: new Date(g('mg_prop')).toISOString(), participantes: part, status: 'Agendada' }).eq('id', ap.id).select().single()
          : sb.from('agenda_reunioes').insert({ atendimento_id: data.id, titulo: 'Reunião de proposta da Gestão', tipo: 'Comercial · Gestão de Milhas', data: new Date(g('mg_prop')).toISOString(), status: 'Agendada', resumo: g('mg_pauta') ? 'Pauta: ' + g('mg_pauta') : null, participantes: part }).select().single())
        : (ap ? sb.from('agenda_reunioes').update({ status: 'Realizada', resumo: g('mg_resprop') }).eq('id', ap.id).select().single()
          : sb.from('agenda_reunioes').insert({ atendimento_id: data.id, titulo: 'Reunião de proposta da Gestão', tipo: 'Comercial · Gestão de Milhas', data: g('mg_em') ? new Date(g('mg_em')).toISOString() : new Date().toISOString(), status: 'Realizada', resumo: g('mg_resprop'), participantes: part }).select().single());
      const a3 = await q3; if (a3.error) falhas.push('O card foi salvo, mas a reunião de proposta não entrou na agenda: ' + a3.error.message); else if (ap) Object.assign(ap, a3.data); else D.agenda.unshift(a3.data);
    }
    // Gestão: diagnóstico agendado entra na agenda (e no TickTick); diagnóstico feito marca a reunião como realizada
    if (G && D.agenda && (g('mg_diag') || data.etapa === 'Diagnóstico feito')) {
      const ag = agDiag(data), part = [data.closer_id || data.responsavel_id || D.meuId];
      if (data.etapa === 'Diagnóstico agendado' && g('mg_diag')) {
        const quando = new Date(g('mg_diag')).toISOString();
        const q2 = ag ? sb.from('agenda_reunioes').update({ data: quando, participantes: part, status: 'Agendada' }).eq('id', ag.id).select().single()
          : sb.from('agenda_reunioes').insert({ atendimento_id: data.id, titulo: 'Diagnóstico da Gestão de Milhas', tipo: 'Comercial · Gestão de Milhas', data: quando, status: 'Agendada', resumo: null, participantes: part }).select().single();
        const a2 = await q2; if (a2.error) falhas.push('O card foi salvo, mas o diagnóstico não entrou na agenda: ' + a2.error.message); else if (ag) Object.assign(ag, a2.data); else D.agenda.unshift(a2.data);
      } else if (data.etapa === 'Diagnóstico feito') {
        const quando = g('mg_em') ? new Date(g('mg_em')).toISOString() : new Date().toISOString(), resumo = g('mg_resumo') || null;
        const q2 = ag ? sb.from('agenda_reunioes').update({ status: 'Realizada', resumo: resumo || ag.resumo || null }).eq('id', ag.id).select().single()
          : sb.from('agenda_reunioes').insert({ atendimento_id: data.id, titulo: 'Diagnóstico da Gestão de Milhas', tipo: 'Comercial · Gestão de Milhas', data: quando, status: 'Realizada', resumo, participantes: part }).select().single();
        const a2 = await q2; if (a2.error) falhas.push('O card foi salvo, mas o diagnóstico não foi registrado na agenda: ' + a2.error.message); else if (ag) Object.assign(ag, a2.data); else D.agenda.unshift(a2.data);
      }
    }
    // card criado a partir de um pedido de convite ou de uma indicação: agora sim o pedido sai da fila
    if (nova && r.solicitacao_id) { const sl = (D.sols || []).find(x => String(x.id) === String(r.solicitacao_id)); if (sl && sl.status === 'nova') { const u = await sb.from('solicitacoes_acesso').update({ status: 'em_analise' }).eq('id', sl.id); if (!u.error) sl.status = 'em_analise'; } }
    if (nova && r._convite) { const ci = (D.indic || []).find(x => String(x.id) === r._convite); if (ci) { const u = await sb.from('convites').update({ status: 'em_contato' }).eq('id', ci.id); if (!u.error) ci.status = 'em_contato'; } }
    if (nova && data.lead_id) { const ld = (D.leads || []).find(x => x.id === data.lead_id); if (ld && ld.status === 'novo') { const u = await sb.from('leads').update({ status: 'em conversa' }).eq('id', ld.id); if (!u.error) ld.status = 'em conversa'; } }
    // passageiros de voo já emitido viram ficha no CRM com CPF e nascimento na hora de salvar
    if (IT && IT.some(x => x.emitido)) await VENDA.salvarPassageiros(ctxVenda(), IT.filter(x => x.emitido));
    if (data.pessoa_id) { if (res === 'Fechou') virarCliente(data.pessoa_id); else if (nova) marcarInteresse(data.pessoa_id, G); }
    if (g('nr_assunto') && D.agenda) {
      const feita = f.elements.nr_feita.checked;
      const nr = await sb.from('agenda_reunioes').insert({ atendimento_id: data.id, titulo: g('nr_assunto'), tipo: G ? 'Comercial · Gestão de Milhas' : 'Comercial · Viagens', data: new Date(g('nr_data')).toISOString(),
        status: feita ? 'Realizada' : 'Agendada', resumo: feita ? (g('nr_abordado') || null) : null, participantes: [data.responsavel_id || D.meuId] }).select().single();
      if (nr.error) falhas.push('O atendimento foi salvo, mas a reunião não: ' + nr.error.message); else D.agenda.unshift(nr.data);
    }
    if (falhas.length) alert('O card foi salvo, mas:\n\n' + falhas.map(t => '- ' + limparTec(t)).join('\n'));
    aviso(res === 'Fechou' && G ? 'Fechou! Defina a data de entrada na ficha do cliente para contar os 12 meses.' : res === 'Fechou' ? 'Venda registrada na conversão.' : nova ? (G ? 'Lead da Gestão registrado.' : 'Cotação registrada.') : 'Atualizado.');
    RE_ED = null; ANTERIOR = null; history.replaceState(null, '', reHash()); telaReunioes(P); scrollTo(0, 0);
  };
  // arquivar no lugar de excluir: o card sai do funil, das listas e dos avisos (92-arquivar-avisos-ignoram-arquivados.sql), nada é apagado
  if ($('arquivarRe')) $('arquivarRe').onclick = async () => {
    const ok = await confirmarFolha('Arquivar o card de ' + (base.cliente || 'cliente') + '?', ['Ele sai do funil, das listas, dos números e dos avisos.', 'Nada é apagado. Dá para restaurar em Mais, Arquivados.'], 'Arquivar');
    if (!ok) return;
    const { error } = await sb.from('atendimentos').update({ arquivado_em: new Date().toISOString(), arquivado_por: D.meuId }).eq('id', base.id);
    if (error) { aviso('Não arquivou: ' + limparTec(error.message)); return; }
    D.reunioes = D.reunioes.filter(x => x.id !== base.id); SUJO = false; PREENCHIDO = false;
    aviso('Card arquivado.'); RE_ED = null; ANTERIOR = null; history.replaceState(null, '', reHash()); telaReunioes(P);
  };
}

/* ---------- comissão do colaborador ---------- */
function telaComissao(P) {
  const minha = (e) => e.vendedor_id === D.meuId;
  const L = doMes(EM_MES).filter(minha), ano = D.emissoes.filter(e => minha(e) && String(e.data_negociacao).slice(0, 4) === EM_MES.slice(0, 4));
  P.innerHTML = `
    <h1 class="titulo">Minha <em>comissão</em></h1>
    <div class="sub">${pct(D.perfil.comissao_pct)} sobre o lucro de cada venda, depois do imposto</div>
    ${seletorMes('coMes')}
    <div class="numeros" style="margin-top:10px">
      <div class="num destaque"><div class="l">Comissão gerada no mês</div><div class="v">${brlC(soma(L, 'comissao'))}</div><div class="d">${mesFechado(EM_MES) ? 'mês fechado, valor final' : 'parcial, mês em aberto'}</div></div>
      <div class="num"><div class="l">Emissões no mês</div><div class="v">${L.length}</div><div class="d">com você como vendedor</div></div>
    </div>
    <div id="minhaRem"></div>
    <section class="bloco"><h2>Acumulado em ${EM_MES.slice(0, 4)}</h2><div class="lin"><span>Comissões</span><span>${brl2(soma(ano, 'comissao'))}</span></div><div class="lin"><span>Emissões</span><span>${ano.length}</span></div></section>
    <div class="secao">Emissões do mês</div>
    <div class="bloco" style="margin-top:0">${L.length ? L.map(e => `<div class="lin"><span>${esc(e.comprador || e.produto || e.servico)} · ${dataCurta(dia(e.data_negociacao))}</span><span>${brl2(e.comissao)}</span></div>`).join('') : '<div class="vazio">Nenhuma emissão neste mês.</div>'}</div>`;
  ligarMes('coMes', () => telaComissao(P));
  const alvo = EM_MES;
  sb.rpc('minha_remuneracao', { p_mes: EM_MES + '-01' }).then(({ data, error }) => {
    const el = $('minhaRem'); if (!el || error || !data || EM_MES !== alvo) return;
    const [yy, mm] = EM_MES.split('-').map(Number), pg = new Date(yy, mm, data.dia || 5).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const itens = CMP.parcelas(D.emissoes, D.meuId).filter(x => x.comp === EM_MES);
    data.comissao = Math.round(itens.reduce((a, x) => a + (+x.valor || 0), 0) * 100) / 100;
    el.innerHTML = `<section class="bloco"><h2>Sua remuneração de ${mesNome(EM_MES).toLowerCase()}</h2><div class="sub" style="margin-top:-4px">Paga em ${pg}. Fechamento do mês: salário fixo + 1ª metade das vendas do mês + 2ª metade das viagens que embarcaram no mês + comissão inteira das emissões B2B do mês.</div><div class="lin"><span>Salário fixo</span><span>${brl2(data.fixo)}</span></div><div class="lin"><span>Comissões (50/50)</span><span>${brl2(data.comissao)}</span></div><div class="lin forte"><span>Total</span><span>${brl2(+data.fixo + +data.comissao)}</span></div>
      ${itens.length ? `<details style="margin-top:6px"><summary class="sub" style="cursor:pointer">Ver as comissões que entram</summary>${itens.map(i => `<div class="lin"><span>${esc(i.nome)}<small style="display:block;color:var(--tinta-3);font-size:12px">${esc(i.tipo)}</small></span><span>${brl2(i.valor)}</span></div>`).join('')}</details>` : ''}</section>`;
  });
}

      <div class="num"><div class="l">Comissões</div><div class="v">${brlC(soma(L, 'comissao'))}</div><div class="d">geradas ${FIN_MODO === 'ano' ? 'no ano' : 'no mês'}, pagas 50/50</div></div>
      <div class="num"><div class="l">Parceiros</div><div class="v">${brlC(soma(L, 'repasse'))}</div><div class="d">remuneração de indicações</div></div>

/* ---------- pagamentos a receber (administradores) ---------- */
let RC_CONF = null;
/* ---------- pagamentos a fornecedores ---------- */
const nNome = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const fornecedoresFichas = () => (D.pessoas || []).filter(p => (p.papeis || []).includes('fornecedor')).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
const fichaFornecedor = (nome) => { const k = nNome(nome); return k ? fornecedoresFichas().find(p => nNome(p.nome) === k) || null : null; };
const devePagar = (e) => (+e.custo || 0) > 0;
// a receber: só o que ainda tem valor para o cliente pagar (cancelamento sem custo e linhas de ajuste não entram)
function aReceberCli(e) { return !e.pago && (+e.valor_receber || 0) > 0.009 && !B2B.ehAjuste(e); }
const aPagar = () => D.emissoes.filter(e => devePagar(e) && !e.pago_fornecedor);
let PG_CONF = null;
function telaPagar(P) {
  const L = aPagar().sort((a, b) => String(a.data_negociacao).localeCompare(String(b.data_negociacao)));
  const grupos = {}; L.forEach(e => { const f = fichaFornecedor(e.fornecedor), k = f ? 'f:' + f.id : 'n:' + nNome(e.fornecedor); (grupos[k] = grupos[k] || { nome: f ? f.nome : (e.fornecedor || 'Fornecedor não informado'), ficha: f, L: [] }).L.push(e); });
  const G = Object.entries(grupos).sort((a, b) => soma(b[1].L, 'custo') - soma(a[1].L, 'custo'));
  P.innerHTML = `<button class="voltar" id="voltar">‹ Mais</button><h1 class="titulo" style="margin-top:6px">Pagamentos a <em>fornecedores</em></h1>
    <div class="numeros" style="margin-top:10px">
      <div class="num destaque"><div class="l">A pagar</div><div class="v">${brlC(soma(L, 'custo'))}</div><div class="d">${L.length} ${L.length === 1 ? 'venda' : 'vendas'} · ${G.length} ${G.length === 1 ? 'fornecedor' : 'fornecedores'}</div></div>
      <div class="num"><div class="l">A receber</div><div class="v">${brlC(soma(D.emissoes.filter(aReceberCli), 'valor_receber'))}</div><div class="d">dos clientes</div></div>
    </div>
    <div class="sub">O valor a pagar é o custo de cada venda. Pague venda por venda ou tudo de um fornecedor de uma vez.</div>
    ${(R => R.length ? `<details class="bloco" style="margin-top:12px"><summary style="cursor:pointer;color:var(--verde)">Pagos nos últimos 30 dias (${R.length})</summary>${R.map(e => `<div class="lin" style="align-items:center"><span>${esc(e.fornecedor || 'Fornecedor não informado')} · ${esc(e.comprador || e.servico)}${e.localizador ? ' · ' + esc(e.localizador) : ''}<small style="display:block;color:var(--tinta-3)">pago em ${new Date(e.pago_fornecedor_em).toLocaleDateString('pt-BR')}</small></span><span style="white-space:nowrap">${brl2(e.custo)} <button class="sec" data-desf="${e.id}" style="padding:6px 10px;min-width:0;font-size:11px">Desfazer</button></span></div>`).join('')}</details>` : '')(D.emissoes.filter(e => e.pago_fornecedor && e.pago_fornecedor_em && Date.now() - new Date(e.pago_fornecedor_em) < 30 * 864e5).sort((a, b) => String(b.pago_fornecedor_em).localeCompare(String(a.pago_fornecedor_em))))}
    ${G.length ? G.map(([k, g]) => `<section class="bloco"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2 style="margin:0">${g.ficha ? `<button type="button" data-fch="${g.ficha.id}" style="background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer">${esc(g.nome)} ›</button>` : esc(g.nome)}</h2><b style="color:var(--verde)">${brl2(soma(g.L, 'custo'))}</b></div>
      ${g.L.map(e => `<div class="lin" style="align-items:center"><span>${esc(e.comprador || e.produto || e.servico)}${e.localizador ? ' · ' + esc(e.localizador) : ''}<small style="display:block;color:var(--tinta-3)">${dataCurta(dia(e.data_negociacao))}${e.origem && e.destino ? ' · ' + esc(e.origem) + ' → ' + esc(e.destino) : ''} · cliente ${e.pago ? 'já pagou' : 'ainda não pagou'}</small></span><span style="white-space:nowrap">${brl2(e.custo)} <button class="sec" data-pg="${e.id}" style="padding:6px 10px;min-width:0;font-size:11px">Pago</button></span></div>`).join('')}
      ${g.L.length > 1 ? `<button class="zap" type="button" data-pgall="${esc(k)}" style="width:100%;margin-top:10px">Pagar tudo de ${esc(g.nome)}: ${brl2(soma(g.L, 'custo'))}</button>` : ''}</section>`).join('') : '<div class="vazio">Nada a pagar a fornecedores.</div>'}`;
  $('voltar').onclick = () => voltarA('mais');
  const marcar = async (ids, msg) => {
    const agora = new Date().toISOString(), feitos = []; let erro = '';
    for (let i = 0; i < ids.length; i += 100) {
      const lote = ids.slice(i, i + 100);
      const { error } = await sb.from('emissoes').update({ pago_fornecedor: true, pago_fornecedor_em: agora }).in('id', lote);
      if (error) { erro = error.message + (/pago_fornecedor/.test(error.message) ? ' (rode o 1-fornecedores-pagar.sql)' : ''); break; }
      feitos.push(...lote);
    }

    // com erro, a tela é redesenhada (o botão volta a funcionar) e o aviso fica até a pessoa fechar
    if (erro) { telaPagar(P); alert((feitos.length ? `Marcou ${feitos.length} de ${ids.length}. ` : '') + limparTec('Não salvou: ' + erro)); return; }
    aviso(msg); telaPagar(P);
  };
  P.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { if (PG_CONF !== b.dataset.pg) { PG_CONF = b.dataset.pg; b.textContent = 'Confirmar'; return; } PG_CONF = null; b.disabled = true; marcar([b.dataset.pg], 'Pagamento ao fornecedor marcado.'); });
  P.querySelectorAll('[data-pgall]').forEach(b => b.onclick = () => { const g = grupos[b.dataset.pgall]; if (!confirm(`Marcar ${g.L.length} vendas de ${g.nome} como pagas (${brl2(soma(g.L, 'custo'))})?`)) return; b.disabled = true; marcar(g.L.map(e => e.id), `Pago a ${g.nome}.`); });
  P.querySelectorAll('[data-fch]').forEach(b => b.onclick = () => ir('crm', () => CRM.abrir(b.dataset.fch)));
  P.querySelectorAll('[data-desf]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.from('emissoes').update({ pago_fornecedor: false, pago_fornecedor_em: null }).eq('id', b.dataset.desf);
    if (error) { b.disabled = false; aviso('Não desfez: ' + error.message); return; }
    const e = D.emissoes.find(x => x.id === b.dataset.desf); if (e) { e.pago_fornecedor = false; e.pago_fornecedor_em = null; }
    aviso('Voltou para a lista de a pagar.'); telaPagar(P);
  });
}

// vendas de todas as datas (o app carrega só desde janeiro do ano passado; o painel precisa de "desde o início")
let PNL_EM = null, PNL_EM_T = 0;
async function emissoesTodas() {
  if (PNL_EM && Date.now() - PNL_EM_T < 60e3) return PNL_EM;
  const { data, error } = await sb.from('emissoes').select('*').order('data_negociacao', { ascending: false }).limit(20000);
  PNL_EM = error ? D.emissoes.filter(e => !e.outra) : (data || []); PNL_EM_T = Date.now();
  return PNL_EM;
}
const PNL_METAS = {};
async function metasDoMes(k) {
  if (k in PNL_METAS) return PNL_METAS[k];
  const { data, error } = await sb.rpc('metas_progresso', { p_mes: k + '-01' });
  return (PNL_METAS[k] = error ? null : ((data && data.empresa) || {}));
}
// meta do período: mês = a do mês; ano = soma dos meses; semana = proporcional aos dias corridos (vendas arredondadas para cima); desde o início = sem meta
async function metaPeriodo(per, modo) {
  if (modo === 'tudo') return null;
  const meses = modo === 'ano' ? Array.from({ length: 12 }, (_, i) => per.ini.slice(0, 4) + '-' + String(i + 1).padStart(2, '0')) : [per.ini.slice(0, 7)];
  const L = await Promise.all(meses.map(metasDoMes));
  let lucro = 0, qtd = 0;
  L.forEach(m => { if (m) { lucro += +m.lucro_meta1 || 0; qtd += +m.qtd_meta || 0; } });
  if (modo === 'semana') {
    const [y, mm] = per.ini.split('-').map(Number), dm = new Date(y, mm, 0).getDate();
    const dias = Math.round((dia(per.fim) - dia(per.ini)) / 864e5) + 1;
    lucro = lucro * dias / dm; qtd = Math.ceil(qtd * dias / dm);
  }
  return { lucro, qtd };
}
function refAnterior() {
  const p = IND.periodo(PNL_PER, PNL_REF), d = dia(PNL_PER === 'semana' ? p.ini : PNL_REF);
  if (PNL_PER === 'semana') { d.setDate(d.getDate() - 1); return isoLocal(d); }
  if (PNL_PER === 'mes') return isoLocal(new Date(d.getFullYear(), d.getMonth() - 1, 1));
  return isoLocal(new Date(d.getFullYear() - 1, 0, 1));
}
function moverPainel(n) {
  const p = IND.periodo(PNL_PER, PNL_REF), d = dia(PNL_REF);
  if (PNL_PER === 'semana') { const x = dia(n < 0 ? p.ini : p.fim); x.setDate(x.getDate() + n); PNL_REF = isoLocal(x); }
  else if (PNL_PER === 'mes') PNL_REF = isoLocal(new Date(d.getFullYear(), d.getMonth() + n, 1));
  else if (PNL_PER === 'ano') PNL_REF = isoLocal(new Date(d.getFullYear() + n, 0, 1));
}
const noPeriodoDe = (p, campo) => (x) => { const v = x[campo]; if (!v) return false; const s = String(v).length > 10 ? isoLocal(new Date(v)) : String(v).slice(0, 10); return s >= p.ini && s <= p.fim; };
// variação contra o período anterior
function variacao(v, a, dinheiro) {
  if (a === null || a === undefined) return '';
  const d = v - a;
  if (dinheiro) { if (!a) return v ? '' : ''; const pc = d / Math.abs(a) * 100; return `<span style="color:${pc < 0 ? 'var(--alerta)' : 'var(--ok)'};font-weight:600">${pc >= 0 ? '+' : '−'}${Math.abs(Math.round(pc))}%</span>`; }
  return `<span style="color:${d < 0 ? 'var(--alerta)' : 'var(--ok)'};font-weight:600">${d >= 0 ? '+' : '−'}${Math.abs(d)}</span>`;
}

// Comercial: funil e conversão no período (os mesmos cálculos de Comercial › Resultados)
/* ---------- funil do período (etapa 9 do layout): quantos chegaram a cada etapa e quantos passam ---------- */
function etapasAlcancadas(r, G) {
  const fechou = r.resultado === 'Fechou', M = r.marcos || {}, et = etapaDe(r);
  if (G) {
    const idx = Math.max(ETAPAS_G.indexOf(et), ...Object.keys(M).map(k => ETAPAS_G.indexOf(k)));
    return { 'Lead': true, 'Qualificado': fechou || idx >= 1 || !!r.sdr_id && !!(r.qualificacao || {}).gasto, 'Diagnóstico feito': fechou || idx >= 3, 'Reunião de proposta': fechou || idx >= 4, 'Fechou': fechou };
  }
  const enviada = fechou || ['Cotação enviada', 'Follow-up'].includes(et) || cotsDe(r.id).some(c => (c.hist || []).length) || !!(M['Cotação enviada']);
  // cards antigos não têm quem assumiu registrado: quem já andou no funil conta como assumido
  return { 'Lead': true, 'Assumido': fechou || enviada || !!r.assumido_por || (et !== 'Novo lead' && ETAPAS_V.includes(et)), 'Cotação enviada': enviada, 'Fechou': fechou };
}
function htmlFunilPeriodo(base, baseAnt, G, nomeAnt) {
  const L = base.filter(r => r.resultado !== 'Não se aplica' && !VENDA.soMilhasCliente(r));
  if (!L.length) return '<div class="vazio" style="margin-top:12px">Nenhum atendimento aberto neste período.</div>';
  const passos = Object.keys(etapasAlcancadas(L[0], G));
  const cont = passos.map(k => L.filter(r => etapasAlcancadas(r, G)[k]).length);
  const taxa = cont[cont.length - 1] / cont[0] * 100;
  const LA = (baseAnt || []).filter(r => r.resultado !== 'Não se aplica' && !VENDA.soMilhasCliente(r));
  const taxaA = LA.length ? LA.filter(r => r.resultado === 'Fechou').length / LA.length * 100 : null;
  const dif = taxaA === null ? null : Math.round(taxa - taxaA);
  return `<section class="funil-p"><div class="ini-rot">${G ? 'Funil da Gestão de Milhas' : 'Funil de viagens'}</div>
    <div class="ini-num">${pct(Math.round(taxa * 10) / 10)}</div><div class="fp-sub">dos leads viraram venda${L.length < 20 ? ` · <b>com base em ${L.length} ${L.length === 1 ? 'card' : 'cards'}</b>` : ''}</div>
    ${dif !== null && nomeAnt ? `<div class="fp-vs ${dif < 0 ? 'al' : ''}">${dif === 0 ? 'Igual a ' + esc(nomeAnt) : `${Math.abs(dif)} ${Math.abs(dif) === 1 ? 'ponto' : 'pontos'} ${dif < 0 ? 'abaixo' : 'acima'} de ${esc(nomeAnt)}`}</div>` : ''}
    ${passos.map((k, i) => `<div class="fp-l"><div class="fp-t"><span>${esc(k)}</span><b>${cont[i]}</b></div><div class="fp-b"><i class="${k === 'Fechou' ? 'ouro' : ''}" style="width:${Math.max(2, cont[i] / cont[0] * 100)}%"></i></div>${i ? `<small>${cont[i - 1] ? pct(Math.round(cont[i] / cont[i - 1] * 100)) : '-'} passam</small>` : ''}</div>`).join('')}
    </section>`;
}

// Financeiro: do faturamento ao lucro líquido das vendas, e o que falta receber
function abaFinanceiro(L, E) {
  const rec = soma(L, 'valor_receber'), cus = soma(L, 'custo'), lb = soma(L, 'lucro_bruto'), imp = soma(L, 'imposto'), com = soma(L, 'comissao'), rep = soma(L, 'repasse'), ll = soma(L, 'lucro_liquido');

  const ar = E.filter(aReceberCli);
  return `<section class="bloco"><h2>Das vendas do período</h2>
      ${ln('Faturamento', rec)}${ln('(−) Custo', -cus)}${ln('= Lucro bruto', lb, true)}${ln('(−) Imposto', -imp)}${ln('(−) Comissão dos vendedores', -com)}${ln('(−) Repasse a parceiros (comissão direta)', -rep)}${ln('= Lucro líquido das vendas', ll, true)}
      <div class="sub">${rec ? pct(ll / rec * 100) + ' de margem líquida. ' : ''}A comissão indireta não existe: só a direta é paga.</div></section>
    <section class="bloco"><h2>A receber dos clientes</h2>

}

        return { id: String(v.id), milhas_cliente: true, atendimento_id: v.atendimento_id, passageiro: P.length ? P[0] + (P.length > 1 ? ` e mais ${P.length - 1}` : '') : (v.comprador || ''), contato: v.contato || '',

  { const t = await sb.from('voos_emissao').select('*'); if (!t.error) { D.trechos = {}; (t.data || []).forEach(x => (D.trechos[String(x.emissao_id)] = D.trechos[String(x.emissao_id)] || []).push(x)); } else D.trechos = null; }

// voado: marca sozinho quando a data do último voo já passou (venda cancelada não conta). Mudança de voo, a equipe ajusta.
let VOADO_FEITO = false;
async function marcarVoados() {
  if (VOADO_FEITO || !(ADMIN || pode('checkin'))) return; VOADO_FEITO = true;
  const hj = hojeISO();
  const ids = (D.emissoes || []).filter(e => !e.voado && !e.outra && !B2B.ehAjuste(e) && !B2B.ehCancelada(e, D) && (e.data_volta || e.data_ida) && String(e.data_volta || e.data_ida).slice(0, 10) < hj).map(e => e.id);
  if (!ids.length) return;
  for (let i = 0; i < ids.length; i += 200) {
    const lote = ids.slice(i, i + 200);
    try { const { error } = await sb.from('emissoes').update({ voado: true }).in('id', lote); if (error) return; D.emissoes.forEach(e => { if (lote.includes(e.id)) e.voado = true; }); } catch (_) { return; }
  }
}
// check-in do B2B é feito pela agência: o app marca sozinho para não cobrar ninguém (nem no Telegram)
let CK_B2B_FEITO = new Set();
async function marcarCheckinB2B() {
  if (!pode('checkin')) return;
  for (const v of D.voosEm || []) {
    const e = (D.emissoes || []).find(x => x.id === v.id);
    if (!B2B.ehB2B(e)) continue;
    for (const tr of ['ida', 'volta']) {
      const k = v.id + tr;
      if (!v['data_' + tr] || v['checkin_' + tr] || CK_B2B_FEITO.has(k)) continue;
      CK_B2B_FEITO.add(k);
      const { error } = await sb.rpc('marcar_checkin', { p_id: v.id, p_trecho: tr, p_feito: true });
      if (!error) { v['checkin_' + tr] = true; e['checkin_' + tr] = true; }
    }
  }
}

// instante real de saída: data e hora locais do aeroporto de saída, no fuso dele
function instanteVoo(iso, hhmm, tz) {
  const [y, m, d] = iso.split('-').map(Number), [hh, mm] = hhmm.split(':').map(Number), utc = Date.UTC(y, m - 1, d, hh, mm);
  try {
    const s = new Intl.DateTimeFormat('en-US', { timeZone: tz || 'America/Sao_Paulo', timeZoneName: 'longOffset' }).formatToParts(new Date(utc)).find(x => x.type === 'timeZoneName').value;
    const r = s.match(/GMT([+-])(\d{1,2}):?(\d{2})?/), off = r ? (r[1] === '-' ? -1 : 1) * (+r[2] * 60 + (+r[3] || 0)) : 0;
    return utc - off * 6e4;
  } catch (_) {
    try { const loc = new Date(new Date(utc).toLocaleString('en-US', { timeZone: tz || 'America/Sao_Paulo' })), ref = new Date(new Date(utc).toLocaleString('en-US', { timeZone: 'UTC' })); return utc - (loc - ref); } catch (__) { return utc + 3 * 36e5; }
  }
}
// voo sem horário de saída: check-in pendente no dia do voo e, a partir das 7h (horário de Brasília), no dia anterior.
// Mesma regra do aviso no celular e no Telegram (avisos_checkin_24h no servidor).
const horaBrasilia = () => { try { return +new Intl.DateTimeFormat('en-GB', { timeZone: 'America/Sao_Paulo', hour: '2-digit', hourCycle: 'h23' }).format(new Date()); } catch (_) { return new Date().getHours(); } };
const pendSemHora = (k) => k === 0 || (k === 1 && horaBrasilia() >= 7);
/* trechos de voo das emissões (todo o time vê) */
function trechosEm() {
  const T = [];
  D.voosEm.forEach(v => {
    { const em = (D.emissoes || []).find(x => x.id === v.id); if (B2B.ehB2B(em) || B2B.ehCancelada(em, D)) return; }
    // voos registrados um a um (vendas novas): um check-in por voo, com a rota, a data e o horário reais
    const R = ((D.trechos || {})[String(v.id)] || []).slice().sort((a, b) => a.n - b.n);
    if (R.length) {
      R.forEach(r => {
        const d = dia(r.data), k = difDias(d); if (k < -1) return;
        const hr = r.hora ? String(r.hora).slice(0, 5) : '', feito = !!r.checkin;
        let pend = !feito && pendSemHora(k);
        if (hr) { const ms = instanteVoo(String(r.data).slice(0, 10), hr, r.tz) - Date.now(); pend = !feito && ms > 0 && ms <= 24 * 36e5; }
        T.push({ id: v.id, tr: 't' + r.n, n: r.n, total: R.length, d, hora: hr, feito, pendente: pend, de: r.origem, para: r.destino, v });
      });
      return;
    }
    [['ida', v.data_ida, v.checkin_ida, v.origem, v.destino], ['volta', v.data_volta, v.checkin_volta, v.destino, v.origem]].forEach(([tr, data, feito, de, para]) => {
      if (!data) return;
      const d = dia(data), k = difDias(d);
      if (k < -1) return;
      const H = (D.horas || {})[String(v.id)] || {}, hr = H['hora_' + tr];
      let pend = !feito && pendSemHora(k);
      if (hr) { const ms = instanteVoo(String(data).slice(0, 10), String(hr).slice(0, 5), H['tz_' + tr]) - Date.now(); pend = !feito && ms > 0 && ms <= 24 * 36e5; }
      T.push({ id: v.id, tr, d, hora: hr ? String(hr).slice(0, 5) : '', feito, pendente: pend, de, para, v });
    });
  });
  return T;
}
const checkinsEm = () => trechosEm().filter(t => t.pendente);
// voos que ainda vão acontecer e não têm horário de saída (vendas antigas): sem horário, o aviso de check-in só chega às 7h do dia anterior
function voosSemHorario() {
  const L = [];
  (D.voosEm || []).forEach(v => {
    if (v.milhas_cliente) return;
    const em = (D.emissoes || []).find(x => x.id === v.id); if (B2B.ehB2B(em) || B2B.ehCancelada(em, D)) return;
    const R = ((D.trechos || {})[String(v.id)] || []).slice().sort((a, b) => a.n - b.n), H = (D.horas || {})[String(v.id)] || {};
    const falta = R.length
      ? R.filter(r => r.data && !r.hora && !r.checkin && difDias(dia(r.data)) >= 0).map(r => ({ d: dia(r.data), de: r.origem, para: r.destino }))
      : [['ida', v.data_ida, v.origem, v.destino], ['volta', v.data_volta, v.destino, v.origem]].filter(([tr, data]) => data && !v['checkin_' + tr] && !H['hora_' + tr] && difDias(dia(data)) >= 0).map(([, data, de, para]) => ({ d: dia(data), de, para }));
    if (falta.length) L.push({ v, em, falta, d: falta[0].d });
  });
  return L.sort((a, b) => a.d - b.d);
}
function blocoSemHorario() {

function cicloCliente(c) {

/* ---------- KPIs da Gestão (topo da tela Gestão) ---------- */
const META_CLIENTES = 100; // meta de clientes ativos em 2027
const META_ANO = 2027;
const inicioGestao = (c) => [c.gestao_inicio, ...(D.ciclosG || []).filter(x => String(x.cliente_id) === String(c.id)).map(x => x.inicio)].filter(Boolean).map(x => String(x).slice(0, 10)).sort()[0] || null;
// ativo: contrato com data de entrada e não vencido; o congelado conta (o contrato só está pausado)
const ativoGestao = (c) => !!c.gestao_inicio && (!!c.gestao_congelado_em || (!!c.gestao_vencimento && diasPara(c.gestao_vencimento) >= 0));
const ativoNoMes = (c, k) => { const i = inicioGestao(c); if (!i || i.slice(0, 7) > k) return false; return !!c.gestao_congelado_em || !c.gestao_vencimento || String(c.gestao_vencimento).slice(0, 7) >= k; };
const clientesAtivos = () => (D.clientes || []).filter(ativoGestao);
// ciclo de um mês que já passou, pelo histórico carregado (o mês atual usa cicloCliente)
function cicloMes(c, k) {
  const id = String(c.id), ant = mesMais(k, -1);
  // antes de novembro de 2026 a conferência sem diferença não deixava registro: nesses meses, qualquer lançamento conta
  const saldos = (D.confs || []).some(x => String(x.cliente_id) === id && mesLocal(x.feita_em) === k) || (k < '2026-11' && (D.extH || []).some(x => String(x.cliente_id) === id && mesLocal(x.created_at) === k));
  const reuniao = (D.agenda || []).some(a => String(a.cliente_id) === id && a.status === 'Realizada' && mesLocal(a.data) === k) || (D.atasH || []).some(x => String(x.cliente_id) === id && String(x.data_reuniao).slice(0, 7) === k);
  const carta = (D.relH || []).some(r => String(r.cliente_id) === id && String(r.mes).slice(0, 7) === ant && r.publicado);
  return { saldos, reuniao, carta, feitos: [saldos, reuniao, carta].filter(Boolean).length };
}
function historicoCiclo(n) {
  const k0 = mesKey(new Date()), H = [];
  for (let i = n - 1; i >= 0; i--) {
    const k = mesMais(k0, -i), L = i ? (D.clientes || []).filter(c => ativoNoMes(c, k)) : clientesAtivos();
    H.push({ k, total: L.length, emDia: L.filter(c => (i ? cicloMes(c, k) : cicloCliente(c)).feitos === 3).length });
  }
  return H;
}
const fechouEm = (r) => r.fechado_em || ((r.marcos || {})['Fechou'] || {}).em || r.data;
// conversão da call: fechados no mês ÷ reuniões de proposta realizadas no mês
function kpiConversaoCall(k) {
  const G = (D.reunioes || []).filter(ehGestao);
  const fechados = G.filter(r => r.resultado === 'Fechou' && fechouEm(r) && mesLocal(fechouEm(r)) === k).length;
  const calls = G.reduce((t, r) => t + reunioesDe(r.id).filter(a => /proposta/i.test(a.titulo || '') && a.status === 'Realizada' && mesLocal(a.data) === k).length, 0);

  return true;
}

function linhasDoPrint(L, data) {
  if (L.primeira) return L.saldoVisivel ? { linhas: L.saldo > 0 ? [{ data, programa: L.nome, tipo: 'saldo_inicial', quantidade: L.saldo, descricao: 'Saldo lido no print' }] : [] } : { erro: `${L.nome}: não achei o saldo no print.` };
  const out = [];
  for (const m of L.linhas.filter(x => x.incluir)) {
    // estorno de resgate fica como emissão positiva: devolve as milhas sem contar como ganho
    const tipo = m.tipo === 'estorno' ? 'emissao' : m.tipo, q = m.quantidade;
    const row = { data: m.data, programa: L.nome, tipo, quantidade: q, descricao: m.tipo === 'estorno' ? 'Estorno: ' + m.descricao : m.descricao };
    if (dataISO(m.validade) && q > 0) row.validade = m.validade;
    if (tipo === 'emissao' && q < 0) row.categoria_uso = 'passagem';
    if (tipo === 'transf_entrada' && pctBonus(m) > 0) row.milhas_bonus = bonusDe(q, pctBonus(m));
    if (tipo === 'compra' || tipo === 'clube') {
      const v = Number(String(m.custo).replace(',', '.'));
      if (!(v > 0)) return { erro: `${L.nome}: informe o valor pago em "${m.descricao}".` };
      row.custo_brl = v;
    }
    out.push(row);
  }
  const dif = difPrint(L);
  if (dif) out.push({ data, programa: L.nome, tipo: 'ajuste', quantidade: dif, descricao: 'Diferença para fechar com o saldo do print' });
  return { linhas: out };
}

    if (error) return error.message;
  }
  return '';
}

async function fiDocs(el, c) {
  el.innerHTML = '<div class="vazio" style="margin-top:14px">Carregando...</div>';
  const { data, error } = await sb.from('documentos').select('*').eq('cliente_id', c.id).is('arquivado_em', null).order('created_at', { ascending: false });
  if (CLI !== c.id || FI_ABA !== 'docs' || !$('fiCorpo')) return;
  if (error) { el.innerHTML = `<div class="vazio">${esc(limparTec('Não carregou: ' + error.message))}</div>`; return; }
  el.innerHTML = `
    <form class="bloco form" id="fDoc" style="margin-top:12px"><h2>Enviar para o painel do cliente</h2>
      ${campo('titulo', 'Título', '', 'text', 'required placeholder="Ex.: Bilhete GRU-SCL"')}
      ${selG('tipo', 'Tipo', TIPO_DOC, 'bilhete')}
      <label class="fl"><span>Arquivo (PDF, imagem ou HTML, até 20 MB)</span><input type="file" name="arquivo" required accept=".pdf,.html,.htm,.png,.jpg,.jpeg,.webp"></label>
      <button class="zap" type="submit" id="upBtn" style="margin-top:10px;width:100%">Enviar documento</button></form>
    <div class="secao">Enviados</div>
    <div class="bloco" style="margin-top:0">${(data || []).length ? data.map(d => `<div class="lanc"><div><b>${esc(d.titulo)}</b><small>${esc((TIPO_DOC.find(x => x[0] === d.tipo) || [0, d.tipo])[1])} · ${new Date(d.created_at).toLocaleDateString('pt-BR')}</small></div><div class="q"><button class="mini" data-ver="${esc(d.arquivo_path)}">ver</button>${ADMIN ? `<button class="mini" data-rm="${d.id}">arquivar</button>` : ''}</div></div>`).join('') : '<div class="vazio">Nenhum documento enviado.</div>'}</div>`;
  $('fDoc').onsubmit = async (e) => {
    e.preventDefault(); const f = e.target, file = f.elements.arquivo.files[0];
    if (!tv(f, 'titulo') || !file) { aviso('Informe o título e escolha o arquivo.'); return; }
    if (file.size > 20 * 1024 * 1024) { aviso('Arquivo acima de 20 MB.'); return; }
    const nome = file.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '-').toLowerCase(), path = `${c.id}/${Date.now()}-${nome}`;
    $('upBtn').disabled = true; $('upBtn').textContent = 'Enviando...';
    const up = await sb.storage.from('documentos').upload(path, file, { contentType: /\.html?$/i.test(nome) ? 'text/html' : (file.type || 'application/octet-stream'), upsert: false });
    if (up.error) { $('upBtn').disabled = false; $('upBtn').textContent = 'Enviar documento'; aviso('Não enviou: ' + up.error.message); return; }
    const ins = await sb.from('documentos').insert({ cliente_id: c.id, titulo: tv(f, 'titulo'), tipo: tv(f, 'tipo'), arquivo_path: path, tamanho_bytes: file.size });
    if (ins.error) { await sb.storage.from('documentos').remove([path]); $('upBtn').disabled = false; $('upBtn').textContent = 'Enviar documento'; aviso('Não salvou: ' + ins.error.message); return; }
    const agora = new Date().toISOString();
    await sb.from('clientes').update({ ultima_atualizacao: agora }).eq('id', c.id).then(({ error: e2 }) => { if (!e2) c.ultima_atualizacao = agora; });
    aviso('Documento enviado. Já está no painel do cliente.'); fiDocs(el, c);
  };
  el.querySelectorAll('[data-ver]').forEach(b => b.onclick = async () => {
    const w = window.open('', '_blank');
    const { data: s, error: er } = await sb.storage.from('documentos').createSignedUrl(b.dataset.ver, 300);
    if (er) { w && w.close(); aviso('Não abriu: ' + er.message); } else if (w) w.location = s.signedUrl;
  });
  // arquivar no lugar de excluir (93-arquivar-documentos-e-lancamentos.sql): some do painel do cliente e o arquivo fica guardado
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    const d = data.find(x => String(x.id) === b.dataset.rm); if (!d) return;
    if (!await confirmarFolha('Arquivar "' + d.titulo + '"?', ['O documento sai do painel do cliente.', 'Nada é apagado, o arquivo continua guardado. Dá para restaurar em Mais, Arquivados.'], 'Arquivar')) return;
    const { error: er } = await sb.from('documentos').update({ arquivado_em: new Date().toISOString(), arquivado_por: D.meuId }).eq('id', d.id);
    if (er) { aviso('Não arquivou: ' + limparTec(er.message)); return; }
    aviso('Documento arquivado. Saiu do painel do cliente.'); fiDocs(el, c);
  });
}

// cartões do cliente: ligados à base de cartões, com as contas de anuidade e pontos
// o que o cliente informou no diagnóstico (formulário do site) e na qualificação do SDR: a ficha da Gestão parte disso
function dadosDiag(c) {
  const pfs = (D.pessoas || []).filter(p => p.cliente_id === c.id).map(p => p.id);
  const cards = (D.reunioes || []).filter(r => ehGestao(r) && (pfs.includes(r.pessoa_id) || (clienteGestaoDe(r) || {}).id === c.id));
  const r = cards.find(x => x.resultado === 'Fechou') || cards[0];
  if (!r) return {};
  const q = r.qualificacao || {}, so = solDoCard(r) || {};
  return { gasto: q.gasto || so.gasto_mensal || '', pix: so.movimentacao_pix || '', programas: q.programas || so.programas || '', viagens: q.viagens || so.viagens_ano || '' };
}
// calculadora de cartões (aba Gestão): avulsa, da ficha do cliente ou do card do lead
function abrirCalc(modo, id) { ir('calccartoes', () => CALC.abrir(modo, id)); }
// gasto mensal do lead em número: o da qualificação do SDR ou o do formulário de diagnóstico
function gastoDoLead(r) { const q = (r && r.qualificacao) || {}, so = solDoCard(r) || {}; return CARTOES.numeroSolto(q.gasto) || CARTOES.numeroSolto(so.gasto_mensal) || null; }
// cards de lead da Gestão ligados ao cliente (o mesmo critério do dadosDiag): as simulações feitas no lead aparecem na ficha
function cardsDoCliente(cid) { const pfs = (D.pessoas || []).filter(p => p.cliente_id === cid).map(p => p.id); return (D.reunioes || []).filter(r => ehGestao(r) && (pfs.includes(r.pessoa_id) || (clienteGestaoDe(r) || {}).id === cid)).map(r => r.id); }
const simulacoesCtx = () => ({ listar: (cid) => CALC.listarSimulacoes({ sb, cardsDoCliente }, { cliente: cid }), resumo: CALC.resumoSimulacao, rodape: (x) => CALC.rodapeSimulacao(x, { nomeTime }) });
function fiCartoes(el, c) {
  CARTOES.abaCartoesCliente(el, c, { sb, esc, aviso, campo, brl, num, D, CART, tec, limparTec, dadosDiag, abrirCalc: podeAba('calccartoes') ? (id) => abrirCalc('cliente', id) : null, simulacoes: podeAba('calccartoes') ? simulacoesCtx() : null }, async () => {
